<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Командная строка Windows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Учебная платформа: меню уроков слева, теория по центру, закреплённый тренажёр справа. */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --ink: #15171c;
  --muted: #5b6270;
  --line: #e1e4ea;
  --accent: #2f55d4;
  --accent-ink: #ffffff;
  --accent-soft: #e9eefc;
  --ok: #17865a;
  --ok-soft: #e5f4ec;
  --warn: #a8620b;
  --warn-soft: #fbf1e2;
  --def-soft: #f1f3f8;
  --term-bg: #0c0c0c;
  --term-fg: #cccccc;
  --term-bar: #1f1f1f;
  --font-body: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  --radius: 10px;
  --header-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #181b21; --ink: #e8eaee; --muted: #9aa1ae; --line: #2a2f38;
    --accent: #7d9bff; --accent-ink: #0d1020; --accent-soft: #1d2645; --ok: #4cc58c; --ok-soft: #15301f;
    --warn: #e2a24f; --warn-soft: #33260f; --def-soft: #1e222a; --term-bar: #1b1b1b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #181b21; --ink: #e8eaee; --muted: #9aa1ae; --line: #2a2f38;
  --accent: #7d9bff; --accent-ink: #0d1020; --accent-soft: #1d2645; --ok: #4cc58c; --ok-soft: #15301f;
  --warn: #e2a24f; --warn-soft: #33260f; --def-soft: #1e222a; --term-bar: #1b1b1b; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, kbd, pre { font-family: var(--font-mono); }
code { font-size: .88em; background: var(--def-soft); padding: .1em .35em; border-radius: 4px; }
kbd { font-size: .8em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: .05em .45em; background: var(--surface); white-space: nowrap; }

/* ---------- Шапка ---------- */
.top { position: sticky; top: 0; z-index: 30; height: var(--header-h); display: flex; align-items: center; gap: 16px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.progress { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.progress-bar { width: 160px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress-bar span { display: block; height: 100%; background: var(--ok); width: 0; transition: width .4s; }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; }

/* ---------- Каркас ---------- */
.shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: calc(100% - var(--header-h)); }
.side { position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); padding: 18px 14px 28px; }
.side h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 10px 6px; font-weight: 600; }
.side h3:first-child { margin-top: 0; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 15px; line-height: 1.35; text-decoration: none; color: var(--ink); }
.nav-item:hover { background: var(--def-soft); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.ring { flex: none; width: 20px; height: 20px; border-radius: 50%; background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; }
.ring::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); }
.ring.done { background: var(--ok); }
.ring.done::after { content: "✓"; background: none; color: #fff; font-size: 12px; font-weight: 700; width: auto; height: auto; line-height: 1; }
.nav-num { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; width: 16px; flex: none; }
.side-foot { margin: 22px 10px 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.reset-link { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; font-size: 13px; }

/* ---------- Урок: теория + тренажёр ---------- */
.lesson { display: grid; grid-template-columns: minmax(0, 1fr); }
.theory { padding: 36px clamp(16px, 4vw, 56px) 64px; max-width: 860px; }
.practice { padding: 0 clamp(16px, 4vw, 56px) 48px; }
@media (min-width: 1240px) {
  .lesson { grid-template-columns: minmax(0, 1fr) clamp(480px, 42%, 620px); }
  .practice { position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); padding: 16px 16px 16px 0; display: flex; flex-direction: column; grid-column: 2; grid-row: 1; }
  .theory { grid-column: 1; grid-row: 1; }
}
.eyebrow { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; }
.eyebrow b { color: var(--accent); font-weight: 600; }
h1 { font-size: clamp(28px, 3.4vw, 38px); line-height: 1.15; letter-spacing: -.02em; margin: 10px 0 14px; text-wrap: balance; }
.lead { font-size: 18px; color: var(--muted); max-width: 62ch; margin: 0 0 28px; }
.theory h2 { font-size: 24px; letter-spacing: -.01em; line-height: 1.25; margin: 44px 0 12px; text-wrap: balance; }
.theory h3 { font-size: 18px; margin: 28px 0 8px; }
.theory p, .theory li { max-width: 68ch; }
.theory ul, .theory ol { padding-left: 1.3em; }
.theory li { margin: 4px 0; }

.def { position: relative; background: var(--def-soft); border-radius: var(--radius); padding: 12px 16px 12px 18px; margin: 12px 0; max-width: 70ch; border-left: 3px solid var(--accent); }
.def-term { font-weight: 700; }
.note, .warn { border-radius: var(--radius); padding: 12px 16px; margin: 16px 0; max-width: 70ch; }
.note { background: var(--accent-soft); }
.warn { background: var(--warn-soft); }
.warn b:first-child { color: var(--warn); }

.table-wrap { overflow-x: auto; margin: 14px 0; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 15px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; background: var(--def-soft); }
tr:last-child td { border-bottom: 0; }
td code { white-space: nowrap; }

pre.out, pre.listing { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto; font-size: 13.5px; line-height: 1.55; margin: 12px 0; }
pre.out.tree { line-height: 1.35; }
pre.listing .ln { color: var(--muted); display: inline-block; width: 1.6em; user-select: none; }
pre.listing .cm { color: var(--ok); }
pre.ex { position: relative; display: flex; align-items: center; gap: 10px; background: var(--term-bg); color: var(--term-fg); border-radius: 8px; padding: 9px 10px 9px 14px; margin: 8px 0; font-size: 14px; overflow-x: auto; max-width: 70ch; }
pre.ex::before { content: ">"; color: #6c6c6c; flex: none; }
pre.ex code { background: none; padding: 0; font-size: inherit; color: inherit; white-space: pre; flex: 1; }
.ins-btn { flex: none; margin-left: auto; border: 1px solid #3a3a3a; background: #1c1c1c; color: #e8e8e8; border-radius: 6px; font-size: 12.5px; padding: 3px 10px; cursor: pointer; font-family: var(--font-body); }
.ins-btn:hover { background: #2b2b2b; border-color: #555; }

/* ---------- Тренажёр ---------- */
.practice-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; flex: 1; overflow: hidden; }
.practice-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.practice-head h2 { margin: 0; font-size: 18px; }
.task-count { margin-left: auto; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tasks { list-style: none; margin: 0; padding: 0 10px 10px; overflow-y: auto; max-height: 38vh; flex: none; }
.task { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 8px 8px; border-radius: 8px; font-size: 15px; line-height: 1.45; }
.task.current { background: var(--accent-soft); }
.task .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); margin-top: 1px; display: grid; place-items: center; transition: background .2s, border-color .2s; }
.task.done .box { background: var(--ok); border-color: var(--ok); }
.task.done .box::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 700; }
.task.done .ttext { color: var(--muted); }
.task.flash { animation: flash 1s; }
@keyframes flash { 0% { background: var(--ok-soft); } 100% { background: transparent; } }
.hint-btn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 13.5px; text-decoration: underline; text-underline-offset: 2px; }
.hint { display: block; margin-top: 4px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.all-done { margin: 0 16px 10px; padding: 10px 14px; border-radius: 8px; background: var(--ok-soft); color: var(--ok); font-weight: 600; font-size: 15px; }

.term { background: var(--term-bg); color: var(--term-fg); display: flex; flex-direction: column; min-height: 0; flex: 1; border-top: 1px solid var(--line); }
.term-bar { display: flex; align-items: center; gap: 8px; background: var(--term-bar); padding: 0 6px 0 0; height: 38px; flex: none; }
.term-tab { display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 14px; background: var(--term-bg); color: #e6e6e6; font-size: 13px; max-width: 60%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.term-tab svg { flex: none; }
.term-btn { border: 0; background: none; color: #a8a8a8; font-size: 12.5px; padding: 6px 8px; border-radius: 5px; cursor: pointer; }
.term-btn:hover { background: #2c2c2c; color: #fff; }
.term-bar .term-btn:first-of-type { margin-left: auto; }
.term-screen { flex: 1; overflow-y: auto; padding: 10px 14px 14px; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; cursor: text; min-height: 260px; }
.term-line { display: flex; align-items: baseline; }
.term-line .pr { white-space: pre; }
.term-input { flex: 1; min-width: 40px; background: transparent; border: 0; outline: none; color: inherit; font: inherit; padding: 0; caret-color: currentColor; }
.term-input:focus-visible { outline: none; }
.term-screen:focus-within { box-shadow: inset 0 0 0 1px #2f2f2f; }

/* ---------- Тест ---------- */
.quiz { margin-top: 56px; }
.quiz h2 { margin-top: 0; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin: 14px 0; max-width: 72ch; }
.q-title { font-weight: 600; margin: 0 0 12px; }
.q-num { color: var(--muted); font-weight: 500; margin-right: 6px; font-variant-numeric: tabular-nums; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; cursor: pointer; line-height: 1.4; transition: border-color .15s, background .15s; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: #c4413a; background: color-mix(in srgb, #c4413a 10%, var(--surface)); }
.why { margin: 12px 0 0; padding: 10px 14px; border-radius: 8px; background: var(--def-soft); font-size: 15px; }
.why b { color: var(--ok); }
.why.bad b { color: #c4413a; }
.retry { border: 0; background: none; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; margin-left: 8px; font-size: 14px; }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; flex-wrap: wrap; }
.pager a { display: inline-flex; flex-direction: column; gap: 2px; text-decoration: none; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 18px; color: var(--ink); min-width: 220px; }
.pager a:hover { border-color: var(--accent); }
.pager small { color: var(--muted); }
.pager a.next { margin-left: auto; text-align: right; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pager a.next small { color: inherit; opacity: .85; }

/* ---------- Виджеты ---------- */
.widget { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin: 16px 0; max-width: 72ch; }
.anat-cmd { font-family: var(--font-mono); font-size: clamp(15px, 2.2vw, 19px); display: flex; flex-wrap: wrap; gap: 6px; background: var(--term-bg); color: var(--term-fg); padding: 14px; border-radius: 10px; }
.anat-cmd .pr { color: #6c6c6c; }
.tok { border: 0; font: inherit; color: inherit; background: #1d1d1d; border-radius: 6px; padding: 2px 8px; cursor: pointer; border-bottom: 3px solid var(--c); }
.tok[aria-pressed="true"], .tok:hover { background: #2e2e2e; }
.anat-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 12px 0 0; font-size: 14px; color: var(--muted); }
.anat-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; }
.anat-explain { margin-top: 12px; min-height: 3.2em; font-size: 15px; }
.anat-explain b { font-family: var(--font-mono); }

.pl-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pl-row label { font-size: 14px; color: var(--muted); }
.pl-input { flex: 1; min-width: 200px; font-family: var(--font-mono); font-size: 15px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.pl-input:focus { border-color: var(--accent); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.chip { border: 1px solid var(--line); background: var(--def-soft); border-radius: 999px; padding: 3px 11px; font-family: var(--font-mono); font-size: 13px; cursor: pointer; }
.chip:hover, .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.pl-result { margin-top: 14px; font-family: var(--font-mono); font-size: 15px; padding: 10px 12px; border-radius: 8px; background: var(--def-soft); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; word-break: break-all; }
.badge { font-family: var(--font-body); font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.no { background: var(--warn-soft); color: var(--warn); }

.pipe-stages { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stage { display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 10px; font-family: var(--font-mono); font-size: 14px; cursor: pointer; background: var(--surface); }
.stage input { accent-color: var(--accent); }
.stage.fixed { cursor: default; background: var(--def-soft); }
.stage.on { border-color: var(--accent); }
.pipe-arrow { color: var(--muted); font-family: var(--font-mono); }
.pipe-cmd { margin-top: 14px; }
.pipe-out { margin-top: 8px; background: var(--term-bg); color: var(--term-fg); border-radius: 8px; padding: 10px 14px; font-family: var(--font-mono); font-size: 14px; white-space: pre; min-height: 3em; overflow-x: auto; }

.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; display: grid; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
.steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.steps .st-t { font-weight: 600; }
.steps .st-d { font-size: 15px; color: var(--muted); }
.steps pre.ex { margin: 6px 0 0; }

/* ---------- Приложение ---------- */
.appx { padding: 36px clamp(16px, 4vw, 56px) 64px; max-width: 1100px; }
.appx-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 8px; position: sticky; top: var(--header-h); background: var(--bg); padding: 10px 0; z-index: 5; }
.search { flex: 1; min-width: 220px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 16px; background: var(--surface); color: var(--ink); }
.search:focus { border-color: var(--accent); outline: none; }
.ref-table td:first-child { font-family: var(--font-mono); font-weight: 600; white-space: nowrap; }
.ref-table .syn { font-family: var(--font-mono); font-size: 13px; white-space: pre-wrap; color: var(--muted); }
.ref-table .keys { font-size: 13.5px; margin: 6px 0 0; padding-left: 1.1em; }
.ref-table .cat-row td { background: var(--def-soft); font-family: var(--font-body); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.copy-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-size: 12.5px; padding: 2px 8px; cursor: pointer; margin-left: 6px; }
.copy-btn:hover { border-color: var(--accent); }
.empty { color: var(--muted); padding: 20px 0; }
.sandbox { height: 460px; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); margin-top: 14px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Адаптив ---------- */
@media (max-width: 1000px) {
  .shell { grid-template-columns: 1fr; }
  .menu-btn { display: inline-block; }
  .side { position: fixed; left: 0; top: var(--header-h); width: min(320px, 86vw); z-index: 40; transform: translateX(-102%); transition: transform .25s; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
  .side.open { transform: none; }
  .progress-bar { width: 90px; }
}
@media (max-width: 1239px) {
  .practice-card { min-height: 560px; }
  .tasks { max-height: none; }
}
@media (max-width: 560px) {
  .progress span.txt { display: none; }
  .brand .bt { display: none; }
  .term-input { font-size: 16px; }
  .pager a { min-width: 0; flex: 1; }
}

/* ---------- Шапка: кнопки ---------- */
.progress { margin-left: auto; }
.top-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 12px; cursor: pointer; font-size: 14.5px; font-weight: 500; white-space: nowrap; }
.top-btn:hover { border-color: var(--accent); }
.top-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.top-btn.accent { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.top-btn.accent[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nav-t { flex: 1; display: flex; flex-direction: column; }
.nav-t small { font-size: 12px; color: var(--muted); font-weight: 400; }

/* ---------- Лекция ---------- */
.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin: 0 0 8px; max-width: 70ch; }
.plan-h { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.plan ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.plan button { display: flex; gap: 12px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 7px; cursor: pointer; line-height: 1.35; }
.plan button:hover { background: var(--def-soft); color: var(--accent); }
.sec-n { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; min-width: 2.4em; display: inline-block; }
.theory h2 .sec-n { margin-right: .35em; }
.theory h2, .summary, .game { scroll-margin-top: calc(var(--header-h) + 16px); }
.summary { margin-top: 56px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 14px; padding: 6px 24px 18px; max-width: 72ch; }
.summary h2 { margin: 18px 0 8px !important; }
.summary li { margin: 8px 0; }

/* ---------- Игра ---------- */
.game { margin-top: 32px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px clamp(16px, 3vw, 28px); max-width: 76ch; box-shadow: 0 1px 0 var(--line); }
.g-intro { display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.g-kicker { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
.g-title { margin: 6px 0 6px !important; font-size: 24px; }
.g-sub { color: var(--muted); margin: 0; max-width: 52ch; }
.g-total { text-align: center; background: var(--def-soft); border-radius: 14px; padding: 10px 18px; min-width: 96px; }
.g-total b { display: block; font-size: 32px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.g-total span { font-size: 13px; color: var(--muted); }
.g-rounds { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 18px 0 4px; }
.g-round { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.g-round:hover { border-color: var(--accent); }
.g-round.done { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.g-ri { width: 32px; height: 32px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; }
.g-rt { font-weight: 600; line-height: 1.3; }
.g-rs { font-size: 13px; color: var(--muted); }
.stars { letter-spacing: 2px; white-space: nowrap; }
.star { color: var(--line); }
.star.on { color: #e3a008; }
.g-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.g-badge { font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; }
.g-meta { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.g-x { margin-left: auto; border: 0; background: var(--def-soft); width: 32px; height: 32px; border-radius: 8px; font-size: 20px; line-height: 1; cursor: pointer; }
.g-desc { color: var(--muted); margin: 10px 0 16px; }
.g-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 600; font-size: 15px; }
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn[disabled] { opacity: .5; cursor: default; }
.g-result { text-align: center; padding: 18px 0 6px; }
.g-big .stars { font-size: 46px; letter-spacing: 6px; }
.g-res-t { font-size: 20px; font-weight: 700; margin: 8px 0 2px; }
.g-res-d { color: var(--muted); margin: 0; }
.g-result .g-actions { justify-content: center; }

.match { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 12px; }
.m-col { display: grid; gap: 8px; align-content: start; }
.m-card { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; text-align: left; cursor: pointer; line-height: 1.35; min-height: 48px; transition: border-color .15s, background .15s, opacity .3s; }
.m-card.term { font-family: var(--font-mono); font-weight: 600; font-size: 14.5px; }
.m-card:hover:not([disabled]) { border-color: var(--accent); }
.m-card.sel { border-color: var(--accent); background: var(--accent-soft); }
.m-card.ok { border-color: var(--ok); background: var(--ok-soft); opacity: .55; cursor: default; }
.m-card.bad { border-color: #c4413a; background: color-mix(in srgb, #c4413a 12%, var(--surface)); animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.b-task { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
.b-lbl { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.b-answer { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--term-bg); color: var(--term-fg); border-radius: 10px; padding: 12px 14px; min-height: 54px; font-family: var(--font-mono); }
.b-pr { color: #6c6c6c; }
.b-slots { display: contents; }
.b-ph { color: #6c6c6c; font-family: var(--font-body); font-size: 14px; }
.b-caret { width: 9px; height: 18px; background: #cccccc; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.b-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.b-tok { font-family: var(--font-mono); font-size: 15px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.b-tok:hover:not([disabled]) { border-color: var(--accent); }
.b-tok[disabled] { opacity: .3; cursor: default; }
.b-tok.in { background: #1f1f1f; color: #f0f0f0; border-color: #3a3a3a; }
.b-tok.in:hover { border-color: #c4413a; }
.b-fb { min-height: 1.6em; margin-top: 12px; }
.b-fb.ok { color: var(--ok); }
.b-fb.ok code { color: var(--ink); }
.b-fb.bad { color: #c4413a; }
.muted { color: var(--muted); }

.tf-timer { height: 8px; border-radius: 4px; background: var(--def-soft); overflow: hidden; }
.tf-timer span { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .1s linear; }
.tf-timer.low span { background: #c4413a; }
.tf-time { text-align: right; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 4px; }
.tf-card { font-size: clamp(18px, 2.4vw, 22px); font-weight: 600; text-align: center; padding: 26px 12px; min-height: 110px; display: grid; place-items: center; text-wrap: balance; }
.tf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tf-btns .btn { padding: 14px; font-size: 17px; }
.tf-yes:hover:not([disabled]) { border-color: var(--ok); background: var(--ok-soft); }
.tf-no:hover:not([disabled]) { border-color: #c4413a; background: color-mix(in srgb, #c4413a 10%, var(--surface)); }
.tf-fb { min-height: 3em; margin-top: 14px; text-align: center; }
.tf-fb.ok b { color: var(--ok); }
.tf-fb.bad b { color: #c4413a; }

/* ---------- Выезжающий справочник ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 18, .38); z-index: 60; opacity: 0; transition: opacity .25s; }
.scrim.show { opacity: 1; }
.drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(560px, 100vw); background: var(--surface); z-index: 70; transform: translateX(102%); transition: transform .28s cubic-bezier(.2,.7,.2,1); display: flex; flex-direction: column; box-shadow: -18px 0 50px rgba(0,0,0,.18); border-left: 1px solid var(--line); visibility: hidden; }
.drawer.open { transform: none; visibility: visible; }
.d-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 18px 20px 10px; }
.d-kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
.d-head h2 { margin: 2px 0 0; font-size: 22px; }
.d-close { border: 0; background: var(--def-soft); width: 36px; height: 36px; border-radius: 9px; font-size: 22px; cursor: pointer; line-height: 1; }
.d-tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--line); }
.d-tabs button { border: 0; background: none; padding: 10px 12px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.d-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.d-body { flex: 1; overflow-y: auto; padding: 16px 20px 28px; }
.d-body .search { width: 100%; }
.d-cats { margin: 10px 0 6px; }
.d-cats .chip { font-family: var(--font-body); }
.d-cat { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 20px 0 8px; }
.d-cmd { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 8px 0; }
.d-name { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.d-name code { font-weight: 700; font-size: 15px; }
.d-name span { font-weight: 600; }
.d-cmd p { margin: 6px 0; font-size: 15px; color: var(--muted); }
.d-syn { font-size: 12.5px; background: var(--def-soft); border-radius: 8px; padding: 8px 10px; margin: 6px 0; white-space: pre-wrap; }
.d-keys { margin: 6px 0; padding-left: 1.1em; font-size: 14px; }
.d-ex { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.mini { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; font-size: 12.5px; padding: 3px 9px; cursor: pointer; }
.mini:hover { border-color: var(--accent); color: var(--accent); }
.d-list { display: grid; gap: 4px; }
.d-row { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.d-sym { font-size: 16px; font-weight: 700; justify-self: start; }
.d-row kbd { justify-self: start; }

/* ---------- Режим показа ---------- */
body.present .side, body.present .practice, body.present .ins-btn { display: none !important; }
body.present .shell { grid-template-columns: 1fr; }
body.present .lesson { grid-template-columns: 1fr; }
body.present .theory { max-width: 1120px; margin: 0 auto; font-size: 20px; }
body.present .theory p, body.present .theory li, body.present .def, body.present .note, body.present .warn, body.present .plan, body.present .summary, body.present .game, body.present .widget { max-width: 80ch; }
body.present h1 { font-size: clamp(36px, 4.4vw, 52px); }
body.present .theory h2 { font-size: 32px; }
body.present .lead { font-size: 23px; }
body.present pre.ex, body.present pre.out, body.present pre.listing { font-size: 17px; max-width: 80ch; }
body.present table { font-size: 18px; }
body.present .menu-btn { display: none; }

@media (max-width: 760px) {
  .tb-t { display: none; }
  .match { grid-template-columns: 1fr; }
  .d-row { grid-template-columns: 80px 1fr; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<h2>Зачем нужна командная строка</h2>
<p>Почти всё, что вы делаете мышью в Проводнике и Параметрах, можно сделать текстовыми командами. Сначала это кажется медленнее, но у командной строки есть сильные стороны:</p>
<ul>
  <li><b>Повторяемость.</b> Команду можно сохранить в файл и запускать снова — так появляются сценарии резервного копирования, установки программ, проверки сети.</li>
  <li><b>Скорость на больших объёмах.</b> Переименовать 300 фотографий или удалить все временные файлы — одна строка вместо сотни кликов.</li>
  <li><b>Диагностика.</b> Утилиты <code>ping</code>, <code>ipconfig</code>, <code>netstat</code>, <code>tasklist</code> показывают то, чего не видно в обычных окнах.</li>
  <li><b>Администрирование.</b> У серверов часто нет графической оболочки вообще, а к удалённому компьютеру проще подключиться текстовой консолью.</li>
</ul>

<div class="def"><span class="def-term">Интерфейс командной строки</span> (CLI, Command Line Interface) — способ управления компьютером, при котором пользователь вводит текстовые команды, а система отвечает текстом.</div>
<div class="def"><span class="def-term">Интерпретатор команд</span> — программа, которая читает введённую строку, разбирает её и выполняет. В Windows классический интерпретатор — <code>cmd.exe</code>, его часто и называют «командной строкой».</div>
<div class="def"><span class="def-term">Консоль</span> — окно, в котором работает интерпретатор: в нём вводятся команды и выводятся результаты.</div>

<h2>cmd, PowerShell и Терминал Windows</h2>
<p>В современной Windows есть несколько похожих инструментов. Их легко перепутать:</p>
<div class="table-wrap"><table>
  <thead><tr><th>Инструмент</th><th>Что это</th><th>Когда использовать</th></tr></thead>
  <tbody>
    <tr><td><b>cmd.exe</b></td><td>Классический интерпретатор, совместим с командами MS-DOS</td><td>Простые команды, пакетные файлы .bat, старые инструкции</td></tr>
    <tr><td><b>PowerShell</b></td><td>Современная оболочка: работает с объектами, а не только с текстом</td><td>Администрирование, сложная автоматизация</td></tr>
    <tr><td><b>Терминал Windows</b></td><td>Приложение-«окно» с вкладками, внутри которого запускаются cmd, PowerShell или Linux (WSL)</td><td>Удобная повседневная работа с любой оболочкой</td></tr>
  </tbody>
</table></div>
<p>В этом курсе мы изучаем <b>cmd</b>: его команды проще, и они работают на любой версии Windows.</p>

<h2>Как открыть командную строку</h2>
<ol>
  <li><kbd>Win</kbd> + <kbd>R</kbd> → введите <code>cmd</code> → <kbd>Enter</kbd>.</li>
  <li>«Пуск» → начните вводить «cmd» или «Командная строка».</li>
  <li>В адресной строке Проводника введите <code>cmd</code> и нажмите <kbd>Enter</kbd> — консоль откроется сразу в этой папке.</li>
  <li><b>От имени администратора:</b> в поиске «Пуск» найдите cmd и нажмите <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Enter</kbd>. Это нужно для команд, которые меняют систему.</li>
</ol>

<h2>Приглашение и текущая папка</h2>
<p>Когда консоль готова принять команду, она показывает <b>приглашение</b>:</p>
<pre class="out">C:\Users\student&gt;_</pre>
<div class="def"><span class="def-term">Приглашение</span> (prompt) — текст перед курсором, который показывает, что интерпретатор ждёт команду. По умолчанию в нём выводится текущая папка и знак <code>&gt;</code>.</div>
<div class="def"><span class="def-term">Текущая (рабочая) папка</span> — папка, относительно которой команда ищет файлы, если полный путь не указан. Сейчас это <code>C:\Users\student</code>.</div>

<h2>Анатомия команды</h2>
<p>Любая команда строится по одной схеме: <b>имя команды</b>, затем <b>аргументы</b> — что обработать — и <b>ключи</b> — как именно. Наведите курсор или нажмите на часть команды:</p>
<div data-widget="anatomy"></div>
<div class="def"><span class="def-term">Ключ</span> (параметр, опция) — уточнение, меняющее поведение команды. В cmd ключи обычно начинаются с косой черты: <code>/s</code>, <code>/b</code>, <code>/?</code>. У сетевых утилит — с дефиса: <code>ping -n 2</code>.</div>

<h2>Главные правила синтаксиса</h2>
<ul>
  <li><b>Регистр не важен:</b> <code>DIR</code>, <code>dir</code> и <code>Dir</code> — одно и то же.</li>
  <li><b>Части команды разделяются пробелами.</b> Поэтому путь с пробелом берут в кавычки: <code>cd "Program Files"</code>.</li>
  <li><b>Справка всегда под рукой:</b> <code>команда /?</code> или <code>help команда</code>. Просто <code>help</code> выводит список команд.</li>
  <li><b>Ошибка — это нормально.</b> Если команда не найдена, cmd скажет: «не является внутренней или внешней командой». Проверьте опечатку.</li>
</ul>
<pre class="ex"><code>help</code></pre>
<pre class="ex"><code>dir /?</code></pre>

<h2>Внутренние и внешние команды</h2>
<div class="def"><span class="def-term">Внутренние команды</span> встроены в сам <code>cmd.exe</code>: <code>cd</code>, <code>dir</code>, <code>copy</code>, <code>echo</code>, <code>set</code>. Отдельных файлов у них нет.</div>
<div class="def"><span class="def-term">Внешние команды</span> — это отдельные программы, обычно в папке <code>C:\Windows\System32</code>: <code>ping.exe</code>, <code>tasklist.exe</code>, <code>xcopy.exe</code>. Cmd находит их по списку папок в переменной <code>PATH</code>.</div>
<pre class="ex"><code>dir C:\Windows\System32\*.exe</code></pre>

<h2>Горячие клавиши, которые экономят время</h2>
<div class="table-wrap"><table>
  <tbody>
    <tr><td><kbd>↑</kbd> / <kbd>↓</kbd></td><td>Повторить одну из предыдущих команд</td></tr>
    <tr><td><kbd>Tab</kbd></td><td>Дописать имя файла или папки</td></tr>
    <tr><td><kbd>Ctrl</kbd> + <kbd>C</kbd></td><td>Прервать выполняющуюся команду</td></tr>
    <tr><td><code>cls</code></td><td>Очистить экран</td></tr>
  </tbody>
</table></div>
<div class="note"><b>Как работать с тренажёром.</b> Ниже — эмулятор настоящей консоли Windows. Он ничего не меняет на вашем компьютере, поэтому экспериментируйте смело. Кнопка «Вставить» у примеров переносит команду в тренажёр — останется нажать <kbd>Enter</kbd>. Задания отмечаются галочкой автоматически.</div>
`,

    { q: 'Как получить справку по команде <code>copy</code>?', opts: ['copy --help', 'man copy', 'copy /?', 'info copy'], a: 2, why: 'В cmd справка вызывается ключом /? или командой help copy. --help и man — это привычки из Linux.' },

{
  id: 'dirs', module: 'Файловая система', title: 'Навигация и работа с папками', time: 20,
  lead: 'Научимся перемещаться по дискам и папкам, смотреть их содержимое, создавать и удалять каталоги.',
  html: String.raw`
<h2>Как устроена файловая система</h2>
<div class="def"><span class="def-term">Файловая система</span> — способ, которым ОС хранит и упорядочивает файлы на диске. В Windows обычно используется NTFS.</div>
<div class="def"><span class="def-term">Диск (том)</span> обозначается буквой с двоеточием: <code>C:</code> — системный диск, <code>D:</code> — второй диск или раздел.</div>
<div class="def"><span class="def-term">Каталог</span> (папка, директория) — контейнер, в котором лежат файлы и другие каталоги. Каталоги вложены друг в друга и образуют <b>дерево</b>.</div>
<div class="def"><span class="def-term">Корневой каталог</span> — самая верхняя папка диска, обозначается <code>C:\</code>.</div>
<p>Вот фрагмент дерева виртуального компьютера в тренажёре:</p>
<pre class="out tree">C:\
├───Program Files
├───Users
│   └───student          ← вы здесь
│       ├───Desktop
│       ├───Documents
│       │   └───Лабораторные
│       ├───Downloads
│       ├───Projects
│       │   └───site
│       ├───Scripts
│       └───Temp
└───Windows
    └───System32</pre>

<h2>Пути: абсолютные и относительные</h2>
<div class="def"><span class="def-term">Путь</span> — адрес файла или папки в дереве. Имена разделяются обратной косой чертой <code>\</code>.</div>
<div class="def"><span class="def-term">Абсолютный (полный) путь</span> начинается с буквы диска или с корня и однозначно указывает место: <code>C:\Users\student\Documents\список.txt</code>.</div>
<div class="def"><span class="def-term">Относительный путь</span> отсчитывается от текущей папки: если вы в <code>C:\Users\student</code>, то <code>Documents\список.txt</code> указывает на тот же файл.</div>
<p>Специальные имена:</p>
<div class="table-wrap"><table>
  <tbody>
    <tr><td><code>.</code></td><td>текущая папка</td></tr>
    <tr><td><code>..</code></td><td>родительская папка (на уровень выше)</td></tr>
    <tr><td><code>\</code> в начале</td><td>корень текущего диска</td></tr>
  </tbody>
</table></div>
<p>Проверьте себя: введите путь и посмотрите, куда он ведёт из текущей папки <code>C:\Users\student</code>.</p>
<div data-widget="pathlab"></div>

<h2>cd — перейти в другую папку</h2>
<pre class="ex"><code>cd Documents</code></pre>
<pre class="ex"><code>cd ..</code></pre>
<pre class="ex"><code>cd \</code></pre>
<pre class="ex"><code>cd "C:\Program Files"</code></pre>
<p><code>cd</code> без параметров просто печатает текущую папку. <code>cd ..\..</code> поднимает на два уровня.</p>

<h3>Переход на другой диск</h3>
<p>Чтобы сменить диск, введите его букву с двоеточием:</p>
<pre class="ex"><code>D:</code></pre>
<div class="warn"><b>Ловушка.</b> Команда <code>cd D:\Backup</code>, введённая на диске C:, <i>не переносит</i> вас на диск D. Она только запоминает текущую папку для D. Чтобы сменить и диск, и папку одной командой, нужен ключ <code>/d</code>: <code>cd /d D:\Backup</code>.</div>

<h2>dir — что лежит в папке</h2>
<pre class="ex"><code>dir</code></pre>
<p>Разберём вывод команды:</p>
<pre class="out">12.11.2026  09:30    &lt;DIR&gt;          Documents     ← папка
09.10.2026  10:07                41 список.txt    ← файл размером 41 байт
               1 файлов             41 байт
               8 папок 118 345 113 600 байт свободно</pre>
<div class="table-wrap"><table>
  <thead><tr><th>Ключ</th><th>Что делает</th><th>Пример</th></tr></thead>
  <tbody>
    <tr><td><code>/b</code></td><td>только имена, без даты и размера</td><td><code>dir /b</code></td></tr>
    <tr><td><code>/s</code></td><td>включить все вложенные папки</td><td><code>dir /s /b *.txt</code></td></tr>
    <tr><td><code>/a</code></td><td>показать и скрытые файлы; <code>/ad</code> — только папки</td><td><code>dir /a</code></td></tr>
    <tr><td><code>/w</code></td><td>в несколько колонок</td><td><code>dir /w</code></td></tr>
  </tbody>
</table></div>

<h3>Маски имён</h3>
<div class="def"><span class="def-term">Маска</span> (шаблон) — имя со специальными символами, под которое подходит сразу много файлов. <code>*</code> — любое количество любых символов, <code>?</code> — ровно один символ.</div>
<pre class="ex"><code>dir Downloads\*.jpg</code></pre>
<pre class="ex"><code>dir Downloads\photo?.jpg</code></pre>

<h2>Создание и удаление папок</h2>
<p><code>mkdir</code> (или коротко <code>md</code>) создаёт папку. Можно сразу создать цепочку вложенных:</p>
<pre class="ex"><code>mkdir Practice\Week1</code></pre>
<p><code>rmdir</code> (<code>rd</code>) удаляет <b>пустую</b> папку. Для папки с содержимым нужен ключ <code>/s</code>, а <code>/q</code> отключает вопрос «вы уверены?»:</p>
<pre class="ex"><code>rd Temp</code></pre>
<pre class="ex static"><code>rd /s /q Practice</code></pre>
<div class="warn"><b>Внимание.</b> Файлы и папки, удалённые из командной строки, <b>не попадают в Корзину</b>. Проверяйте путь дважды, особенно с <code>/s /q</code>.</div>

<h2>tree — дерево папок</h2>
<pre class="ex"><code>tree</code></pre>
<pre class="ex"><code>tree Projects /f</code></pre>
<p>Ключ <code>/f</code> добавляет в дерево файлы.</p>

{
  id: 'files', module: 'Файловая система', title: 'Работа с файлами', time: 25,
  lead: 'Создадим, просмотрим, скопируем, переименуем и удалим файлы, а ещё научимся перенаправлять вывод команд и строить конвейеры.',
  html: String.raw`
<h2>Файл, имя и расширение</h2>
<div class="def"><span class="def-term">Файл</span> — именованная область данных на диске. Имя файла состоит из <b>собственно имени</b> и <b>расширения</b> после последней точки: <code>отчет.docx</code>, <code>backup.bat</code>.</div>
<div class="def"><span class="def-term">Расширение</span> подсказывает Windows, какой программой открыть файл: <code>.txt</code> — текст, <code>.exe</code> — программа, <code>.bat</code> — пакетный файл.</div>

<h2>Потоки ввода-вывода и перенаправление</h2>
<p>Каждая команда пишет результат в <b>стандартный вывод</b> — по умолчанию это экран. Но вывод можно направить в файл или передать другой команде.</p>
<div class="def"><span class="def-term">Стандартный вывод</span> (stdout) — канал, куда команда пишет обычный результат. <span class="def-term">Поток ошибок</span> (stderr) — отдельный канал для сообщений об ошибках.</div>
<div class="def"><span class="def-term">Перенаправление</span> — отправка вывода команды не на экран, а в файл (или чтение входных данных из файла).</div>
<div class="table-wrap"><table>
  <thead><tr><th>Оператор</th><th>Что делает</th><th>Пример</th></tr></thead>
  <tbody>
    <tr><td><code>&gt;</code></td><td>записать вывод в файл; старое содержимое <b>стирается</b></td><td><code>dir &gt; list.txt</code></td></tr>
    <tr><td><code>&gt;&gt;</code></td><td>дописать вывод в конец файла</td><td><code>echo ещё &gt;&gt; list.txt</code></td></tr>
    <tr><td><code>2&gt;</code></td><td>записать в файл только ошибки</td><td><code>dir X 2&gt; err.txt</code></td></tr>
    <tr><td><code>&gt;nul</code></td><td>выбросить вывод, ничего не показывать</td><td><code>copy a b &gt;nul</code></td></tr>
    <tr><td><code>&lt;</code></td><td>взять входные данные из файла</td><td><code>sort &lt; список.txt</code></td></tr>
  </tbody>
</table></div>

<h2>Создание текстовых файлов</h2>
<p>Самый быстрый способ — перенаправить вывод <code>echo</code>:</p>
<pre class="ex"><code>echo Купить флешку &gt; Desktop\todo.txt</code></pre>
<pre class="ex"><code>echo Сдать отчёт &gt;&gt; Desktop\todo.txt</code></pre>
<p>Пустой файл можно создать командой <code>type nul &gt; empty.txt</code>.</p>

<h2>Просмотр: type и more</h2>
<pre class="ex"><code>type Desktop\todo.txt</code></pre>
<p><code>type</code> выводит содержимое текстового файла целиком. Для длинных файлов используют <code>more</code> — он показывает текст по экрану. Двоичные файлы (.exe, .docx, .jpg) через type смотреть бессмысленно: получатся «кракозябры».</p>

<h2>Копирование: copy, xcopy, robocopy</h2>
<pre class="ex"><code>copy Desktop\todo.txt D:\Backup</code></pre>
<p>Если указать в назначении имя файла, копия получит новое имя: <code>copy todo.txt todo_old.txt</code>. Ключ <code>/y</code> заменяет существующий файл без вопроса.</p>
<div class="table-wrap"><table>
  <thead><tr><th>Команда</th><th>Подходит для</th><th>Главные ключи</th></tr></thead>
  <tbody>
    <tr><td><code>copy</code></td><td>одного или нескольких файлов</td><td><code>/y</code></td></tr>
    <tr><td><code>xcopy</code></td><td>папок вместе с подпапками</td><td><code>/s</code>, <code>/e</code> (и пустые), <code>/i</code>, <code>/y</code></td></tr>
    <tr><td><code>robocopy</code></td><td>резервных копий и больших объёмов: повторяет при сбоях, пишет отчёт</td><td><code>/e</code>, <code>/mir</code> (зеркало)</td></tr>
  </tbody>
</table></div>
<pre class="ex"><code>xcopy Projects D:\Backup\Projects /e /i</code></pre>

<h2>Перемещение и переименование</h2>
<pre class="ex"><code>move Downloads\photo1.jpg D:\Backup</code></pre>
<pre class="ex"><code>ren Desktop\заметки.txt notes.txt</code></pre>
<p>У <code>ren</code> второй параметр — только новое имя, без пути. Маски работают и здесь: <code>ren *.txt *.bak</code> поменяет расширение всем текстовым файлам.</p>

<h2>Удаление: del</h2>
<pre class="ex"><code>del Downloads\*.tmp</code></pre>
<div class="table-wrap"><table>
  <tbody>
    <tr><td><code>/q</code></td><td>не спрашивать подтверждение при удалении по маске <code>*</code></td></tr>
    <tr><td><code>/s</code></td><td>удалять подходящие файлы и во всех подпапках</td></tr>
    <tr><td><code>/f</code></td><td>удалять даже файлы с атрибутом «только чтение»</td></tr>
    <tr><td><code>/p</code></td><td>спрашивать про каждый файл</td></tr>
  </tbody>
</table></div>
<div class="warn"><b>Без Корзины.</b> <code>del</code> удаляет файлы безвозвратно. Перед <code>del *.*</code> выполните <code>dir</code> с той же маской и убедитесь, что удалится именно то, что нужно.</div>

<h2>Атрибуты файлов</h2>
<div class="def"><span class="def-term">Атрибуты</span> — служебные пометки файла: <b>R</b> — только чтение, <b>H</b> — скрытый, <b>S</b> — системный, <b>A</b> — архивный (файл изменён после последнего архивирования).</div>
<pre class="ex"><code>attrib Desktop\*</code></pre>
<p>Обратите внимание на скрытый файл <code>desktop.ini</code>: обычный <code>dir</code> его не показывает, а <code>dir /a</code> покажет. Установить или снять атрибут: <code>attrib +h файл</code>, <code>attrib -h файл</code>.</p>

<h2>Поиск текста и конвейер</h2>
<div class="def"><span class="def-term">Конвейер</span> (pipe, оператор <code>|</code>) передаёт вывод одной команды на вход следующей. Так из простых команд собираются сложные.</div>
<pre class="ex"><code>find "хлеб" Documents\список.txt</code></pre>
<pre class="ex"><code>findstr /i "хлеб чай" Documents\список.txt</code></pre>
<pre class="ex"><code>type Documents\список.txt | sort</code></pre>
<pre class="ex"><code>dir /s /b | find ".txt"</code></pre>
<p><code>find</code> ищет одну фразу, <code>findstr</code> — любое из нескольких слов. Ключ <code>/i</code> отключает учёт регистра, <code>/v</code> выводит строки, где текста <i>нет</i>, <code>/c</code> — только количество.</p>
<div data-widget="pipe"></div>

<h2>Программа и процесс</h2>
<div class="def"><span class="def-term">Программа</span> — файл на диске с инструкциями, например <code>notepad.exe</code>. Пока её не запустили, она просто лежит.</div>
<div class="def"><span class="def-term">Процесс</span> — запущенный экземпляр программы: ему выделены память и процессорное время. Одна программа может породить много процессов — браузер запускает отдельный процесс на каждую вкладку.</div>
<div class="def"><span class="def-term">PID</span> (Process ID) — уникальный номер процесса, который назначает ОС при запуске. У двух открытых Блокнотов одинаковое имя образа, но разные PID.</div>
<div class="def"><span class="def-term">Имя образа</span> (image name) — имя исполняемого файла, из которого запущен процесс: <code>chrome.exe</code>, <code>explorer.exe</code>.</div>
<div class="def"><span class="def-term">Служба</span> — фоновый процесс без окна, который запускается вместе с Windows и работает без участия пользователя: печать, обновления, DNS-клиент.</div>

<h2>tasklist — список процессов</h2>
<pre class="ex"><code>tasklist</code></pre>
<p>Это текстовый аналог вкладки «Подробности» Диспетчера задач. Столбцы: имя образа, PID, сеанс (Services — системный сеанс 0, Console — сеанс пользователя) и объём памяти.</p>
<h3>Фильтры</h3>
<p>Ключ <code>/fi</code> оставляет только нужные процессы. Фильтр записывается в кавычках: <i>поле — оператор — значение</i>.</p>
<div class="table-wrap"><table>
  <thead><tr><th>Фильтр</th><th>Что найдёт</th></tr></thead>
  <tbody>
    <tr><td><code>"imagename eq chrome.exe"</code></td><td>процессы с этим именем</td></tr>
    <tr><td><code>"pid eq 5216"</code></td><td>процесс с конкретным PID</td></tr>
    <tr><td><code>"memusage gt 100000"</code></td><td>процессы, которые занимают больше 100 000 КБ памяти</td></tr>
    <tr><td><code>"status eq not responding"</code></td><td>зависшие процессы</td></tr>
  </tbody>
</table></div>
<p>Операторы: <code>eq</code> — равно, <code>ne</code> — не равно, <code>gt</code> — больше, <code>lt</code> — меньше.</p>
<pre class="ex"><code>tasklist /fi "imagename eq chrome.exe"</code></pre>
<pre class="ex"><code>tasklist /fi "status eq not responding"</code></pre>
<p>То же можно сделать конвейером — это короче и проще запомнить:</p>
<pre class="ex"><code>tasklist | find "chrome"</code></pre>

<h2>Запуск программ</h2>
<p>Программу из <code>System32</code> можно запустить просто по имени, а <code>start</code> запускает её в отдельном окне и сразу возвращает управление консоли:</p>
<pre class="ex"><code>start notepad</code></pre>
<pre class="ex static"><code>start https://example.com</code></pre>

<h2>taskkill — завершить процесс</h2>
<pre class="ex static"><code>taskkill /im notepad.exe</code></pre>
<pre class="ex static"><code>taskkill /pid 8420 /f</code></pre>
<div class="table-wrap"><table>
  <thead><tr><th>Ключ</th><th>Значение</th></tr></thead>
  <tbody>
    <tr><td><code>/im имя</code></td><td>завершить все процессы с таким именем образа</td></tr>
    <tr><td><code>/pid номер</code></td><td>завершить один процесс по его PID</td></tr>
    <tr><td><code>/f</code></td><td>принудительно, без ожидания ответа от программы</td></tr>
    <tr><td><code>/t</code></td><td>вместе со всеми дочерними процессами</td></tr>
  </tbody>
</table></div>
<p>Без <code>/f</code> процессу отправляется вежливая просьба закрыться. Программа может сохранить данные или спросить «Сохранить изменения?». Зависшая программа на такую просьбу не отвечает — её приходится завершать принудительно.</p>
<div class="warn"><b>Осторожно с /f и /im.</b> <code>taskkill /im chrome.exe /f</code> закроет <i>все</i> окна браузера без сохранения. Если нужен один процесс, используйте <code>/pid</code>. Системные процессы (<code>svchost.exe</code>, <code>lsass.exe</code>) обычному пользователю завершить не дадут: «Отказано в доступе».</div>

<h2>Сведения о системе и службах</h2>
<pre class="ex"><code>systeminfo</code></pre>
<pre class="ex"><code>sc query spooler</code></pre>
<p><code>systeminfo</code> показывает версию ОС, процессор, объём памяти. <code>sc query</code> — состояние служб. Запускать и останавливать службы (<code>sc start</code>, <code>sc stop</code>) может только администратор.</p>

{
  id: 'net', module: 'Система', title: 'Сетевые команды', time: 25,
  lead: 'Посмотрим сетевые настройки компьютера, проверим связь с узлами, узнаем адрес сайта и найдём программу, которая заняла сетевой порт.',
  html: String.raw`
<h2>Минимум сетевых понятий</h2>
<div class="def"><span class="def-term">IP-адрес</span> — числовой адрес устройства в сети, например <code>192.168.1.42</code>. Четыре числа от 0 до 255 через точку (IPv4).</div>
<div class="def"><span class="def-term">Маска подсети</span> показывает, какая часть IP-адреса — номер сети, а какая — номер устройства. Маска <code>255.255.255.0</code> значит: устройства <code>192.168.1.*</code> в одной сети.</div>
<div class="def"><span class="def-term">Основной шлюз</span> — адрес маршрутизатора (роутера), через который компьютер выходит за пределы своей сети, например в интернет.</div>
<div class="def"><span class="def-term">DNS</span> (Domain Name System) — служба, которая переводит понятные имена (<code>example.com</code>) в IP-адреса. Без DNS сайты пришлось бы открывать по числам.</div>
<div class="def"><span class="def-term">MAC-адрес</span> — физический адрес сетевой карты, задаётся производителем: <code>3C-7C-3F-A1-4B-92</code>.</div>
<div class="def"><span class="def-term">Порт</span> — номер от 0 до 65535, по которому ОС понимает, какой программе отдать пришедшие данные. Веб-сайты работают на портах 80 и 443.</div>

<h2>ipconfig — сетевые настройки</h2>
<pre class="ex"><code>ipconfig</code></pre>
<pre class="ex"><code>ipconfig /all</code></pre>
<p>Обычный вывод показывает IP-адрес, маску и шлюз. С ключом <code>/all</code> добавляются MAC-адрес («Физический адрес»), адреса DNS-серверов и сведения о DHCP.</p>
<div class="def"><span class="def-term">DHCP</span> — служба, которая автоматически раздаёт устройствам IP-адреса. Если в выводе «DHCP включен: Да», адрес компьютер получил от роутера.</div>
<p>Полезные ключи: <code>/flushdns</code> очищает кэш DNS (помогает, когда сайт «переехал», а компьютер помнит старый адрес); <code>/release</code> и <code>/renew</code> освобождают и заново получают адрес.</p>

<h2>ping — есть ли связь</h2>
<pre class="ex"><code>ping 192.168.1.1</code></pre>
<p><code>ping</code> отправляет узлу короткие эхо-запросы (по протоколу ICMP) и ждёт ответа. Как читать вывод:</p>
<pre class="out">Ответ от 8.8.8.8: число байт=32 время=35мс TTL=117
                                  │          │
           задержка туда и обратно┘          └ сколько ещё маршрутизаторов мог пройти пакет
Пакетов: отправлено = 4, получено = 4, потеряно = 0 (0% потерь)</pre>
<ul>
  <li><b>«Превышен интервал ожидания»</b> — узел не ответил: он выключен, недоступен или блокирует ping.</li>
  <li><b>«Не удалось обнаружить узел»</b> — имя не удалось перевести в адрес: проблема с DNS или опечатка.</li>
</ul>
<pre class="ex"><code>ping -n 2 8.8.8.8</code></pre>
<p>Ключ <code>-n</code> задаёт число запросов, <code>-t</code> пингует бесконечно, пока не нажать <kbd>Ctrl</kbd> + <kbd>C</kbd>.</p>

<h2>tracert и nslookup</h2>
<pre class="ex"><code>tracert example.com</code></pre>
<p><code>tracert</code> показывает путь пакета: каждый маршрутизатор на пути — отдельная строка. По ней видно, на каком участке пропадает связь.</p>
<pre class="ex"><code>nslookup example.com</code></pre>
<p><code>nslookup</code> спрашивает у DNS-сервера IP-адрес по имени. «Не заслуживающий доверия ответ» — это нормально: ответ пришёл из кэша DNS-сервера, а не от главного сервера домена.</p>

<h2>netstat — подключения и порты</h2>
<pre class="ex"><code>netstat -ano</code></pre>
<div class="table-wrap"><table>
  <thead><tr><th>Ключ</th><th>Значение</th></tr></thead>
  <tbody>
    <tr><td><code>-a</code></td><td>все подключения, включая «слушающие» порты (LISTENING)</td></tr>
    <tr><td><code>-n</code></td><td>адреса и порты цифрами, без перевода в имена — быстрее</td></tr>
    <tr><td><code>-o</code></td><td>PID процесса, который использует подключение</td></tr>
  </tbody>
</table></div>
<p>Состояние <b>LISTENING</b> значит, что программа ждёт входящих подключений на этом порту. <b>ESTABLISHED</b> — соединение установлено и данные передаются.</p>
<div class="note"><b>Типичная задача.</b> Вы запускаете сайт на порту 8080, а система отвечает «порт уже занят». Найдите строку с <code>:8080</code> в выводе <code>netstat -ano</code>, возьмите PID из последнего столбца и посмотрите, что это за процесс: <code>tasklist /fi "pid eq НОМЕР"</code>. Если процесс лишний, завершите его с помощью <code>taskkill</code>.</div>
<pre class="ex"><code>netstat -ano | find ":8080"</code></pre>

<h2>Ещё несколько утилит</h2>
<pre class="ex"><code>arp -a</code></pre>
<pre class="ex"><code>getmac</code></pre>
<pre class="ex"><code>curl -I https://example.com</code></pre>
<p><code>arp -a</code> — какие IP-адреса в локальной сети соответствуют каким MAC-адресам. <code>getmac</code> — MAC-адреса своих адаптеров. <code>curl</code> отправляет HTTP-запрос к сайту; встроен в Windows 10 и 11.</p>

<h2>Алгоритм: «не работает интернет»</h2>
<p>Проверяйте по цепочке от себя к внешнему миру — первый неудачный шаг укажет на проблему:</p>
<div data-widget="netcheck"></div>
<div class="note">Адреса сайтов в тренажёре условные — на настоящем компьютере вы увидите другие числа.</div>
`,

{
  id: 'batch', module: 'Пакетное управление', title: 'Пакетные файлы .bat', time: 30,
  lead: 'Соберём команды в сценарий, который запускается одним словом: переменные, параметры, условия, циклы и разбор настоящего скрипта резервного копирования.',
  html: String.raw`
<h2>Что такое пакетный файл</h2>
<div class="def"><span class="def-term">Пакетный файл</span> (batch-файл) — текстовый файл с расширением <code>.bat</code> или <code>.cmd</code>, в котором записана последовательность команд cmd. При запуске интерпретатор выполняет их по очереди, строка за строкой.</div>
<div class="def"><span class="def-term">Пакетная обработка</span> — выполнение набора команд без участия человека. Отсюда и название: команды выполняются «пакетом».</div>
<p>Пакетные файлы автоматизируют рутину: резервное копирование, очистку временных файлов, настройку рабочего места, проверку сети по расписанию.</p>

<h2>Как создать и запустить .bat</h2>
<ol>
  <li>Откройте Блокнот и напишите команды — каждую с новой строки.</li>
  <li>«Файл → Сохранить как», тип «Все файлы», имя <code>hello.bat</code>.</li>
  <li>Запустите двойным щелчком или из консоли — по имени, расширение можно не писать: <code>hello</code>.</li>
</ol>
<p>Короткий файл можно создать и прямо из консоли — через <code>echo</code> с перенаправлением:</p>
<pre class="ex"><code>echo @echo off&gt; hello.bat</code></pre>
<pre class="ex"><code>echo echo Привет из батника&gt;&gt; hello.bat</code></pre>
<pre class="ex"><code>hello</code></pre>
<div class="warn"><b>Русский текст и кодировка.</b> Консоль по умолчанию использует кодировку CP866, а Блокнот сохраняет в UTF-8, и русские буквы превращаются в «кракозябры». Добавьте первой строкой <code>chcp 65001 &gt;nul</code>: она переключит консоль на UTF-8.</div>

<h2>Первые строки: @echo off и комментарии</h2>
<p>По умолчанию cmd перед выполнением печатает каждую команду из файла. Это мешает читать результат, поэтому почти любой .bat начинается со строки:</p>
<pre class="ex static"><code>@echo off</code></pre>
<p><code>echo off</code> отключает показ команд, а <code>@</code> скрывает саму эту строку. Комментарии пишутся после <code>rem</code> или <code>::</code> — интерпретатор их пропускает.</p>
<p>Сравните: запустите готовый скрипт <code>Scripts\info.bat</code>, а потом посмотрите его код командой <code>type</code>.</p>
<pre class="ex"><code>Scripts\info.bat</code></pre>

<h2>Переменные</h2>
<div class="def"><span class="def-term">Переменная окружения</span> — именованное значение, которое хранит интерпретатор. Значение подставляется, если записать имя между знаками процента: <code>%NAME%</code>.</div>
<pre class="ex"><code>set NAME=Анна</code></pre>
<pre class="ex"><code>echo Привет, %NAME%!</code></pre>
<div class="warn"><b>Пробелы важны.</b> <code>set NAME = Анна</code> создаст переменную с именем «NAME␣» и значением «␣Анна». Пишите без пробелов вокруг <code>=</code>.</div>
<p>Встроенные переменные, которые есть всегда:</p>
<div class="table-wrap"><table>
  <tbody>
    <tr><td><code>%USERNAME%</code></td><td>имя пользователя</td></tr>
    <tr><td><code>%USERPROFILE%</code></td><td>домашняя папка, <code>C:\Users\student</code></td></tr>
    <tr><td><code>%CD%</code></td><td>текущая папка</td></tr>
    <tr><td><code>%DATE%</code>, <code>%TIME%</code></td><td>текущие дата и время</td></tr>
    <tr><td><code>%RANDOM%</code></td><td>случайное число от 0 до 32767</td></tr>
    <tr><td><code>%ERRORLEVEL%</code></td><td>код возврата последней команды</td></tr>
  </tbody>
</table></div>
<pre class="ex"><code>set</code></pre>
<h3>Арифметика и ввод</h3>
<pre class="ex"><code>set /a 7*6</code></pre>
<pre class="ex"><code>set /a X=10+5</code></pre>
<pre class="ex"><code>set /p CITY=Ваш город: </code></pre>
<p><code>set /a</code> вычисляет целочисленное выражение, <code>set /p</code> ждёт ввода с клавиатуры и сохраняет его в переменную.</p>

<h2>Параметры запуска</h2>
<div class="def"><span class="def-term">Параметры</span> — значения, переданные пакетному файлу при запуске: <code>info.bat test</code>. Внутри файла они доступны как <code>%1</code>…<code>%9</code>. <code>%0</code> — имя самого файла, <code>%*</code> — все параметры сразу.</div>
<pre class="ex"><code>Scripts\info.bat Привет</code></pre>

<h2>Код возврата и операторы && и ||</h2>
<div class="def"><span class="def-term">Код возврата</span> (ERRORLEVEL) — число, которое команда сообщает после выполнения: <b>0</b> — успех, любое другое — ошибка.</div>
<pre class="ex"><code>mkdir Reports &amp;&amp; echo Папка создана</code></pre>
<pre class="ex"><code>cd NoSuchFolder || echo Такой папки нет</code></pre>
<p><code>&amp;&amp;</code> выполняет вторую команду, только если первая прошла успешно; <code>||</code> — только если первая завершилась ошибкой; <code>&amp;</code> выполняет обе по очереди в любом случае.</p>

<h2>Условия: if</h2>
<div class="table-wrap"><table>
  <thead><tr><th>Форма</th><th>Пример</th></tr></thead>
  <tbody>
    <tr><td>файл существует</td><td><code>if exist todo.txt echo Есть список дел</code></td></tr>
    <tr><td>файл не существует</td><td><code>if not exist D:\Backup mkdir D:\Backup</code></td></tr>
    <tr><td>строки равны</td><td><code>if "%1"=="" echo Нет параметров</code></td></tr>
    <tr><td>сравнение чисел</td><td><code>if %X% GTR 10 echo Больше десяти</code></td></tr>
    <tr><td>проверка ошибки</td><td><code>if errorlevel 1 echo Была ошибка</code></td></tr>
  </tbody>
</table></div>
<p>Операторы сравнения чисел: <code>EQU</code> (=), <code>NEQ</code> (≠), <code>LSS</code> (&lt;), <code>LEQ</code> (≤), <code>GTR</code> (&gt;), <code>GEQ</code> (≥). Ветка «иначе» записывается со скобками:</p>
<pre class="ex"><code>if exist Desktop (echo Папка есть) else (echo Папки нет)</code></pre>

<h2>Циклы: for</h2>
<pre class="ex"><code>for %f in (Documents\*.txt) do echo %f</code></pre>
<pre class="ex"><code>for /l %i in (1,1,5) do echo Шаг %i</code></pre>
<pre class="ex"><code>for /d %d in (*) do echo Папка: %d</code></pre>
<div class="warn"><b>Главное отличие.</b> В консоли переменная цикла пишется с одним знаком процента: <code>%f</code>. <b>Внутри .bat-файла — с двумя</b>: <code>%%f</code>. Это самая частая ошибка новичков.</div>
<p><code>for /l %i in (начало,шаг,конец)</code> перебирает числа, <code>for /d</code> — папки.</p>

<h2>Метки и переходы</h2>
<p>Строка, начинающаяся с двоеточия, — <b>метка</b>. Команда <code>goto метка</code> переходит к ней, <code>goto :eof</code> — в конец файла. <code>call другой.bat</code> вызывает ещё один пакетный файл и возвращается обратно. <code>pause</code> ждёт нажатия клавиши, чтобы окно не закрылось сразу.</p>

<h2>Разбор настоящего скрипта</h2>
<p>Файл <code>Scripts\backup.bat</code> копирует документы на диск D. Прочитайте его построчно:</p>
<pre class="listing"><span class="ln">1</span>@echo off                                     <span class="cm">:: не показывать команды</span>
<span class="ln">2</span>rem Резервное копирование папки Documents на диск D:
<span class="ln">3</span>set SRC=%USERPROFILE%\Documents               <span class="cm">:: откуда копируем</span>
<span class="ln">4</span>set DST=D:\Backup\Documents                   <span class="cm">:: куда копируем</span>
<span class="ln">5</span>if not exist "%DST%" mkdir "%DST%"            <span class="cm">:: создать папку, если её нет</span>
<span class="ln">6</span>xcopy "%SRC%" "%DST%" /e /i /y                <span class="cm">:: скопировать всё, заменяя старое</span>
<span class="ln">7</span>echo Копирование завершено: %date% %time%     <span class="cm">:: отчёт с датой</span></pre>
<pre class="ex"><code>type Scripts\backup.bat</code></pre>
<pre class="ex"><code>Scripts\backup.bat</code></pre>
<div class="note"><b>Автозапуск по расписанию.</b> Чтобы скрипт выполнялся сам, например каждый вечер, его добавляют в Планировщик заданий Windows. Из консоли это делается командой <code>schtasks /create /tn "Backup" /tr "C:\Scripts\backup.bat" /sc daily /st 20:00</code>.</div>
<div class="note"><b>Ограничения тренажёра.</b> Внутри .bat работают <code>echo</code>, <code>set</code>, <code>if</code>, <code>for</code>, <code>goto</code>, <code>call</code> и обычные команды. Многострочные блоки в скобках не поддерживаются — пишите <code>if</code> в одну строку.</div>
`,
  tasks: [
    { t: 'Посмотрите код готового скрипта <code>Scripts\\backup.bat</code>.', hint: 'type Scripts\\backup.bat', check: function (c) { return H(c, /^(type|more)\s+.*backup\.bat/i); } },
    { t: 'Запустите <code>backup.bat</code> и убедитесь, что на диске D появилась копия документов.', hint: 'Scripts\\backup.bat, затем dir D:\\Backup\\Documents', check: function (c) { return c.sh.exists('D:\\Backup\\Documents\\список.txt'); } },
    { t: 'Создайте в текущей папке <code>hello.bat</code> из двух строк: <code>@echo off</code> и <code>echo Привет из батника</code>.', hint: 'echo @echo off> hello.bat, затем echo echo Привет из батника>> hello.bat', check: function (c) { var f = c.sh.glob('hello.bat')[0] || c.sh.glob('C:\\Users\\student\\hello.bat')[0]; if (!f) return false; var l = f.node.content.split('\n').map(function (s) { return s.trim().toLowerCase(); }).filter(Boolean); return l.length >= 2 && l[0] === '@echo off' && /^echo\s+привет/.test(l[1]); } },
    { t: 'Запустите <code>hello.bat</code>.', hint: 'hello', check: function (c) { return !!c.sh.flags['ran:hello.bat']; } },
    { t: 'Запишите своё имя в переменную <code>NAME</code> и выведите её значение.', hint: 'set NAME=Анна, затем echo %NAME%', check: function (c) { return c.sh.getVar('NAME') !== null && H(c, /^echo\b.*%name%/i); } },
    { t: 'Вычислите 7 × 6 командой <code>set /a</code>.', hint: 'set /a 7*6', check: function (c) { return H(c, /^set\s+\/a\s*.*7\s*\*\s*6/i); } },
    { t: 'Циклом <code>for</code> выведите имена всех .txt-файлов из <code>Documents</code>.', hint: 'for %f in (Documents\\*.txt) do echo %f', check: function (c) { return H(c, /^for\s+%\w\s+in\s*\(.*\*\.txt.*\)\s*do/i); } }
  ],
  quiz: [
    { q: 'Зачем в начале .bat пишут <code>@echo off</code>?', opts: ['Чтобы отключить звук', 'Чтобы команды из файла не печатались перед выполнением', 'Чтобы файл нельзя было изменить', 'Чтобы скрипт работал быстрее'], a: 1, why: 'echo off отключает показ каждой команды, а @ скрывает и саму эту строку. На экране остаётся только результат.' },
    { q: 'Как правильно записать переменную цикла внутри .bat-файла?', opts: ['%f', '%%f', '$f', '!f'], a: 1, why: 'В консоли пишут %f, а в пакетном файле знак процента удваивается: %%f.' },
    { q: 'Скрипт запустили так: <code>deploy.bat site prod</code>. Что будет в <code>%2</code>?', opts: ['deploy.bat', 'site', 'prod', 'site prod'], a: 2, why: '%0 — имя файла, %1 — первый параметр (site), %2 — второй (prod).' }

},

{
  id: 'winget', module: 'Пакетное управление', title: 'Менеджер пакетов winget', time: 15,
  lead: 'Установим, обновим и удалим программы одной командой, без поиска установщиков на сайтах.',
  html: String.raw`
<h2>Что такое менеджер пакетов</h2>
<div class="def"><span class="def-term">Пакет</span> — программа, подготовленная для автоматической установки: установщик плюс описание (название, версия, издатель, ссылка на файл, контрольная сумма).</div>
<div class="def"><span class="def-term">Менеджер пакетов</span> — программа, которая сама находит пакеты в каталоге, скачивает, проверяет, устанавливает, обновляет и удаляет их.</div>
<div class="def"><span class="def-term">Репозиторий</span> (источник) — каталог пакетов, из которого берёт программы менеджер. У winget основной источник так и называется — <code>winget</code>.</div>
<div class="def"><span class="def-term">Идентификатор пакета</span> (ИД) — уникальное имя пакета в репозитории вида <code>Издатель.Программа</code>: <code>7zip.7zip</code>, <code>Git.Git</code>.</div>
<p>Без менеджера установка выглядит так: найти сайт программы, скачать установщик, проверить, что это не подделка, нажать «Далее» пять раз. С менеджером — одна команда. А для компьютерного класса на 25 машин — один скрипт.</p>

<h2>winget — диспетчер пакетов Windows</h2>
<p><code>winget</code> встроен в Windows 11 и в обновлённую Windows 10 (через приложение «Установщик приложений» из Microsoft Store). Проверить можно командой <code>winget --version</code>.</p>
<div class="table-wrap"><table>
  <thead><tr><th>Команда</th><th>Что делает</th></tr></thead>
  <tbody>
    <tr><td><code>winget search запрос</code></td><td>найти пакеты по названию</td></tr>
    <tr><td><code>winget show ИД</code></td><td>подробности о пакете</td></tr>
    <tr><td><code>winget install --id ИД</code></td><td>установить пакет</td></tr>
    <tr><td><code>winget list</code></td><td>список установленных программ</td></tr>
    <tr><td><code>winget upgrade</code></td><td>какие программы можно обновить</td></tr>
    <tr><td><code>winget upgrade --all</code></td><td>обновить всё сразу</td></tr>
    <tr><td><code>winget uninstall ИД</code></td><td>удалить программу</td></tr>
    <tr><td><code>winget export -o apps.json</code></td><td>сохранить список программ, чтобы потом установить его на другом компьютере командой <code>winget import</code></td></tr>
  </tbody>
</table></div>

<h2>Поиск и установка</h2>
<pre class="ex"><code>winget search python</code></pre>
<p>Найдено два пакета. Если написать <code>winget install python</code>, winget не поймёт, какой из них нужен, и попросит уточнить. Поэтому устанавливать надёжнее по <b>точному идентификатору</b>:</p>
<pre class="ex"><code>winget install python</code></pre>
<pre class="ex"><code>winget install --id Python.Python.3.12</code></pre>
<p>Полезные ключи для установки без вопросов (в скриптах): <code>--silent</code> — без окон установщика, <code>--accept-package-agreements --accept-source-agreements</code> — заранее принять лицензии, <code>-e</code> — искать точное совпадение.</p>

<h2>Обновление и удаление</h2>
<pre class="ex"><code>winget upgrade</code></pre>
<pre class="ex"><code>winget upgrade --all</code></pre>
<pre class="ex static"><code>winget uninstall --id 7zip.7zip</code></pre>

<h2>Скрипт настройки рабочего места</h2>
<p>Менеджер пакетов и пакетный файл хорошо работают вместе. Такой <code>setup.bat</code> поставит нужные программы на новый компьютер:</p>
<pre class="listing">@echo off
chcp 65001 &gt;nul
echo Устанавливаю программы для занятий...
for %%p in (7zip.7zip Git.Git Microsoft.VisualStudioCode) do (
    winget install --id %%p -e --silent --accept-package-agreements --accept-source-agreements
)
echo Готово!
pause</pre>

<h2>Другие менеджеры пакетов</h2>
<div class="table-wrap"><table>
  <thead><tr><th>Менеджер</th><th>Особенности</th></tr></thead>
