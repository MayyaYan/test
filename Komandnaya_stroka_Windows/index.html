        var it = items[idx], answer = [];
        var pool = shuffle(it.tokens.concat(it.decoys)).map(function (t, i) { return { t: t, id: i, used: false }; });
        host.innerHTML = head(r, 'Команда ' + (idx + 1) + ' из ' + items.length + ' · <span class="g-err">Ошибок: ' + errors + '</span>') +
          '<div class="b-task"><span class="b-lbl">Задача</span>' + esc(it.task) + '</div>' +
          '<div class="b-answer" aria-label="Собранная команда" aria-live="polite"><span class="b-pr">C:\\&gt;</span><span class="b-slots"></span><span class="b-caret" aria-hidden="true"></span></div>' +
          '<div class="b-pool" role="group" aria-label="Части команды"></div>' +
          '<div class="b-fb" role="status"></div>' +
          '<div class="g-actions"><button class="btn primary" data-act="check" type="button">Проверить</button><button class="btn" data-act="clear" type="button">Очистить</button><button class="btn ghost" data-act="show" type="button">Показать ответ</button></div>';
        bindGo();
        var slots = $('.b-slots', host), poolEl = $('.b-pool', host), fb = $('.b-fb', host), solved = false;
        function draw() {
          slots.innerHTML = answer.length ? '' : '<span class="b-ph">нажимайте на части ниже</span>';
          answer.forEach(function (p, k) {
            var b = el('button', { class: 'b-tok in', type: 'button', title: 'Убрать' }, esc(p.t));
            b.addEventListener('click', function () { if (solved) return; answer.splice(k, 1); p.used = false; draw(); });
            slots.appendChild(b);
          });
          poolEl.innerHTML = '';
          pool.forEach(function (p) {
            var b = el('button', { class: 'b-tok', type: 'button' }, esc(p.t));
            b.disabled = p.used || solved;
            b.addEventListener('click', function () { p.used = true; answer.push(p); fb.textContent = ''; fb.className = 'b-fb'; draw(); });
            poolEl.appendChild(b);
          });
        }
        draw();
        function done(text) {
          solved = true; draw();
          fb.className = 'b-fb ok'; fb.innerHTML = text;
          var act = $('.g-actions', host);
          act.innerHTML = '<button class="btn primary" type="button" data-act="next">' + (idx + 1 < items.length ? 'Следующая команда →' : 'Завершить раунд') + '</button>';
          $('[data-act="next"]', act).addEventListener('click', function () { idx++; if (idx < items.length) item(); else finish(r, errors === 0 ? 3 : errors <= 2 ? 2 : 1, 'Ошибок: ' + errors + '.'); });
          $('[data-act="next"]', act).focus({ preventScroll: true });
        }
        host.querySelector('[data-act="check"]').addEventListener('click', function () {
          if (!answer.length) { fb.className = 'b-fb bad'; fb.textContent = 'Сначала соберите команду из частей.'; return; }
          if (sameCmd(answer.map(function (p) { return p.t; }), it.tokens)) done('<b>Верно!</b> <code>' + esc(answer.map(function (p) { return p.t; }).join(' ')) + '</code>');
          else {
            errors++; $('.g-err', host).textContent = 'Ошибок: ' + errors;
            fb.className = 'b-fb bad';
            var first = answer[0].t.toLowerCase() !== it.tokens[0].toLowerCase();
            fb.textContent = first ? 'Не та команда. Подумайте, какая команда решает эту задачу.' : answer.length !== it.tokens.length ? 'Команда верная, но частей ' + (answer.length < it.tokens.length ? 'не хватает' : 'лишние') + '.' : 'Почти: проверьте ключи и порядок аргументов.';
          }
        });
        host.querySelector('[data-act="clear"]').addEventListener('click', function () { answer.forEach(function (p) { p.used = false; }); answer = []; draw(); });
        host.querySelector('[data-act="show"]').addEventListener('click', function () { errors += 2; done('Правильный ответ: <code>' + esc(it.tokens.join(' ')) + '</code> <span class="muted">(+2 ошибки)</span>'); });
      }
      item();
    }

    /* Раунд 3: блиц «верно или нет» */
    function playTF(r) {
      var list = shuffle(B.tf), idx = 0, right = 0, left = 45000, paused = false, last = Date.now();
      host.innerHTML = head(r, '<span class="tf-score">Верно: 0 из ' + list.length + '</span>') +
        '<div class="tf-timer" aria-hidden="true"><span></span></div><div class="tf-time" aria-live="off">45 с</div>' +
        '<div class="tf-card" aria-live="polite"></div><div class="tf-btns"><button class="btn tf-yes" type="button" data-v="1">Верно</button><button class="btn tf-no" type="button" data-v="0">Неверно</button></div><div class="tf-fb" role="status"></div>';
      bindGo();
      var bar = $('.tf-timer span', host), tEl = $('.tf-time', host), card = $('.tf-card', host), fb = $('.tf-fb', host), sc = $('.tf-score', host), btns = host.querySelectorAll('.tf-btns .btn');
      function show() { card.textContent = list[idx][0]; fb.textContent = ''; fb.className = 'tf-fb'; btns.forEach(function (b) { b.disabled = false; }); }
      function end(timeout) { finish(r, right === list.length ? 3 : right >= list.length - 2 ? 2 : 1, 'Правильных ответов: ' + right + ' из ' + list.length + (timeout ? '. Время вышло.' : '.')); }
      show();
      timer = setInterval(function () {
        var now = Date.now(); if (!paused) left -= now - last; last = now;
        if (left <= 0) { left = 0; end(true); return; }
        bar.style.width = (left / 45000 * 100) + '%'; tEl.textContent = Math.ceil(left / 1000) + ' с';
        bar.parentNode.classList.toggle('low', left < 10000);
      }, 100);
      btns.forEach(function (b) {
        b.addEventListener('click', function () {
          var it = list[idx], ok = (b.dataset.v === '1') === it[1];
          if (ok) right++;
          sc.textContent = 'Верно: ' + right + ' из ' + list.length;
          btns.forEach(function (x) { x.disabled = true; });
          paused = true;
          fb.className = 'tf-fb ' + (ok ? 'ok' : 'bad');
          fb.innerHTML = '<b>' + (ok ? 'Да!' : 'Нет.') + '</b> ' + (it[1] ? 'Это правда. ' : 'Это неправда. ') + esc(it[2]);
          setTimeout(function () { paused = false; last = Date.now(); idx++; if (idx < list.length) show(); else end(false); }, ok ? 1300 : 2300);
        });
      });
    }

    /* Раунд 4: ситуации */
    function playQuiz(r) {
      var qs = les.quiz, idx = 0, wrong = 0;
      function q() {
        var it = qs[idx], tries = 0;
        host.innerHTML = head(r, 'Вопрос ' + (idx + 1) + ' из ' + qs.length) + '<p class="q-title">' + it.q + '</p><div class="opts" role="group"></div><div class="why-slot"></div>';
        bindGo();
        var opts = $('.opts', host), slot = $('.why-slot', host);
        it.opts.forEach(function (o, oi) {
          var b = el('button', { class: 'opt', type: 'button' }, esc(o));
          b.addEventListener('click', function () {
            if (oi === it.a) {
              b.classList.add('right'); opts.querySelectorAll('.opt').forEach(function (x) { x.disabled = true; });
              if (tries === 0) { } else wrong++;
              slot.innerHTML = '<div class="why"><b>Верно.</b> ' + esc(it.why) + '</div><div class="g-actions"><button class="btn primary" type="button" data-act="next">' + (idx + 1 < qs.length ? 'Следующий вопрос →' : 'Завершить раунд') + '</button></div>';
              var nb = $('[data-act="next"]', slot);
              nb.addEventListener('click', function () { idx++; if (idx < qs.length) q(); else finish(r, wrong === 0 ? 3 : wrong === 1 ? 2 : 1, 'Ответов с первой попытки: ' + (qs.length - wrong) + ' из ' + qs.length + '.'); });
              nb.focus({ preventScroll: true });
            } else {
              tries++; b.classList.add('wrong'); b.disabled = true;
              slot.innerHTML = '<div class="why bad"><b>Не совсем.</b> Выберите другой вариант.</div>';
            }
          });
          opts.appendChild(b);
        });
      }
      q();
    }
    menu();
  }

  /* ---------- Лекция ---------- */
  function renderLesson(les, idx) {
    var main = $('#main'), st = termState(les.id), B = BLOCKS[les.id];
    main.innerHTML = '';
    var wrap = el('div', { class: 'lesson' });
    var theory = el('article', { class: 'theory' });
    theory.innerHTML =
      '<div class="eyebrow"><span><b>Блок ' + (idx + 1) + ' из ' + L.length + '</b></span><span>Лекция</span><span>' + esc(les.module) + '</span><span>≈ ' + les.time + ' мин</span></div>' +
      '<h1>' + esc(les.title) + '</h1><p class="lead">' + esc(les.lead) + '</p><nav class="plan" aria-label="План лекции"></nav><div class="lecture-body">' + les.html + '</div>';
    var practice = el('aside', { class: 'practice', 'aria-label': 'Тренажёр' });
    var card = el('section', { class: 'practice-card' });
    card.innerHTML = '<div class="practice-head"><h2>Тренажёр</h2><span class="task-count"></span></div><ol class="tasks"></ol><div class="all-done" hidden>Все задания выполнены. Осталась игра-проверка в конце лекции.</div>';
    practice.appendChild(card);
    wrap.appendChild(theory); wrap.appendChild(practice); main.appendChild(wrap);

    /* Нумерация разделов и план */
    var heads = theory.querySelectorAll('.lecture-body h2'), planItems = [];
    heads.forEach(function (h, k) {
      var n = (idx + 1) + '.' + (k + 1);
      h.id = 'sec-' + les.id + '-' + (k + 1);
      planItems.push([n, h.textContent, h]);
      h.insertAdjacentHTML('afterbegin', '<span class="sec-n">' + n + '</span>');
    });
    var plan = $('.plan', theory);
    plan.innerHTML = '<div class="plan-h">План лекции</div><ol>' + planItems.map(function (p, k) { return '<li><button type="button" data-k="' + k + '"><span class="sec-n">' + p[0] + '</span>' + esc(p[1]) + '</button></li>'; }).join('') +
      '<li><button type="button" data-k="sum"><span class="sec-n">' + (idx + 1) + '.' + (planItems.length + 1) + '</span>Итоги лекции</button></li><li><button type="button" data-k="game"><span class="sec-n">★</span>Игра-проверка</button></li></ol>';

    var tState = tasksOf(les.id), listEl = $('.tasks', card), countEl = $('.task-count', card), doneEl = $('.all-done', card), tv;
    function drawTasks(flashIdx) {
      var firstOpen = -1; listEl.innerHTML = '';
      les.tasks.forEach(function (t, i) {
        var d = !!tState[i]; if (!d && firstOpen < 0) firstOpen = i;
        var li = el('li', { class: 'task' + (d ? ' done' : '') + (i === flashIdx ? ' flash' : '') });
        li.innerHTML = '<span class="box" aria-hidden="true"></span><div><span class="ttext"><span class="vh">' + (d ? 'Выполнено: ' : 'Не выполнено: ') + '</span>' + t.t + '</span> <button class="hint-btn" type="button" aria-expanded="false">Подсказка</button></div>';
        var hb = li.querySelector('.hint-btn');
        hb.addEventListener('click', function () {
          var h = li.querySelector('.hint');
          if (h) { h.remove(); hb.setAttribute('aria-expanded', 'false'); hb.textContent = 'Подсказка'; }
          else { hb.insertAdjacentElement('afterend', el('span', { class: 'hint' }, esc(t.hint))); hb.setAttribute('aria-expanded', 'true'); hb.textContent = 'Скрыть'; }
        });
        listEl.appendChild(li);
        if (i === firstOpen) li.classList.add('current');
      });
      var n = les.tasks.filter(function (x, i) { return tState[i]; }).length;
      countEl.textContent = n + ' из ' + les.tasks.length; doneEl.hidden = n !== les.tasks.length;
    }
    function check() {
      var sh = st.shell, ctx = { sh: sh }, newly = [];
      if (les.watch) les.watch(sh);
      les.tasks.forEach(function (t, i) { if (tState[i]) return; var ok = false; try { ok = !!t.check(ctx); } catch (e) { } if (ok) { tState[i] = true; newly.push(i); } });
      if (newly.length) {
        save(); drawTasks(newly[newly.length - 1]); renderSide(les.id);
        toast(les.tasks.every(function (x, i) { return tState[i]; }) ? 'Все задания тренажёра выполнены!' : 'Задание ' + (newly[newly.length - 1] + 1) + ' выполнено');
      }
    }
    drawTasks(-1);
    tv = new TermView(card, st, function (cmd) { if (cmd !== null) check(); });
    activeTerm = tv;
    mountWidgets(theory);
    enhanceExamples(theory, function () { return tv; });

    /* Итоги */
    var sum = el('section', { class: 'summary', id: 'sum-' + les.id });
    sum.innerHTML = '<h2><span class="sec-n">' + (idx + 1) + '.' + (planItems.length + 1) + '</span>Итоги лекции</h2><ul>' + B.summary.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>';
    theory.appendChild(sum);
    var gHost = el('section', { id: 'game-' + les.id, 'aria-label': 'Игра-проверка' });
    theory.appendChild(gHost);
    Game(gHost, les, idx + 1, function () { renderSide(les.id); });

    plan.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var k = b.dataset.k, target = k === 'sum' ? sum : k === 'game' ? gHost : planItems[+k][2];
      target.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
    });

    var pager = el('nav', { class: 'pager', 'aria-label': 'Переход между лекциями' });
    if (idx > 0) pager.innerHTML += '<a href="#' + L[idx - 1].id + '"><small>← Предыдущий блок</small>' + esc(L[idx - 1].title) + '</a>';
    if (idx < L.length - 1) pager.innerHTML += '<a class="next" href="#' + L[idx + 1].id + '"><small>Следующий блок →</small>' + esc(L[idx + 1].title) + '</a>';
    else pager.innerHTML += '<button class="next" type="button" data-open-ref><small>Приложение →</small>Справочник команд</button>';
    theory.appendChild(pager);
    check();
  }

  /* ---------- Выезжающий справочник ---------- */
  var drawer = $('#drawer'), scrim = $('#scrim'), lastFocus = null, refTab = 'cmds', refCat = null;
  function openRef() {
    lastFocus = document.activeElement;
    drawer.classList.add('open'); drawer.setAttribute('aria-hidden', 'false'); scrim.hidden = false;
    requestAnimationFrame(function () { scrim.classList.add('show'); });
    document.body.classList.add('ref-open');
    $('#refBtn').setAttribute('aria-expanded', 'true');
    setTimeout(function () { ($('#refQ') || $('.d-close')).focus({ preventScroll: true }); }, 60);
  }
  function closeRef() {
    drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true'); scrim.classList.remove('show');
    setTimeout(function () { scrim.hidden = true; }, 250);
    document.body.classList.remove('ref-open');
    $('#refBtn').setAttribute('aria-expanded', 'false');
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  function buildDrawer() {
    var cats = []; REF.forEach(function (r) { if (cats.indexOf(r.cat) < 0) cats.push(r.cat); });
    drawer.innerHTML =
      '<div class="d-head"><div><div class="d-kicker">Приложение</div><h2 id="drawerTitle">Справочник команд</h2></div><button class="d-close" type="button" aria-label="Закрыть справочник">×</button></div>' +
      '<div class="d-tabs" role="tablist"><button role="tab" type="button" data-tab="cmds" aria-selected="true">Команды</button><button role="tab" type="button" data-tab="sym" aria-selected="false">Спецсимволы</button><button role="tab" type="button" data-tab="keys" aria-selected="false">Клавиши</button></div>' +
      '<div class="d-body"></div>';
    var body = $('.d-body', drawer);
    function drawTab() {
      drawer.querySelectorAll('[data-tab]').forEach(function (t) { t.setAttribute('aria-selected', t.dataset.tab === refTab ? 'true' : 'false'); });
      if (refTab === 'sym') {
        body.innerHTML = '<div class="d-list">' + window.CMD_SYMBOLS.map(function (s) { return '<div class="d-row"><code class="d-sym">' + esc(s[0]) + '</code><div>' + esc(s[1]) + '<div class="d-ex"><code>' + esc(s[2]) + '</code><button class="mini" type="button" data-ins="' + esc(s[2]) + '">Вставить</button></div></div></div>'; }).join('') + '</div>';
        return;
      }
      if (refTab === 'keys') {
        body.innerHTML = '<div class="d-list">' + window.CMD_KEYS.map(function (k) { return '<div class="d-row"><kbd>' + esc(k[0]) + '</kbd><div>' + esc(k[1]) + '</div></div>'; }).join('') + '</div>';
        return;
      }
      body.innerHTML = '<label class="vh" for="refQ">Поиск по справочнику</label><input id="refQ" class="search" type="search" placeholder="Команда или задача: «удалить», «порт»…" autocomplete="off">' +
        '<div class="chips d-cats">' + ['Все'].concat(cats).map(function (c) { return '<button class="chip" type="button" data-cat="' + esc(c) + '" aria-pressed="' + ((c === 'Все' && !refCat) || c === refCat ? 'true' : 'false') + '">' + esc(c) + '</button>'; }).join('') + '</div>' +
        '<div class="d-cmds" aria-live="polite"></div>';
      var q = $('#refQ', body), list = $('.d-cmds', body);
      function draw() {
        var s = q.value.trim().toLowerCase(), html = '', cur = null, n = 0;
        REF.forEach(function (r) {
          if (refCat && r.cat !== refCat) return;
          var hay = (r.names.join(' ') + ' ' + r.short + ' ' + r.desc + ' ' + r.ex + ' ' + r.keys.map(function (k) { return k.join(' '); }).join(' ')).toLowerCase();
          if (s && hay.indexOf(s) < 0) return;
          if (r.cat !== cur) { cur = r.cat; html += '<div class="d-cat">' + esc(cur) + '</div>'; }
          n++;
          html += '<article class="d-cmd"><div class="d-name"><code>' + r.names.map(esc).join('</code> / <code>') + '</code><span>' + esc(r.short) + '</span></div><p>' + esc(r.desc) + '</p>' +
            '<pre class="d-syn">' + esc(r.syntax) + '</pre>' +
            (r.keys.length ? '<ul class="d-keys">' + r.keys.map(function (k) { return '<li><code>' + esc(k[0]) + '</code> — ' + esc(k[1]) + '</li>'; }).join('') + '</ul>' : '') +
            '<div class="d-ex"><code>' + esc(r.ex) + '</code><button class="mini" type="button" data-ins="' + esc(r.ex) + '">Вставить в тренажёр</button><button class="mini" type="button" data-copy="' + esc(r.ex) + '">Копировать</button></div></article>';
        });
        list.innerHTML = n ? html : '<p class="empty">Ничего не найдено. Попробуйте другое слово.</p>';
      }
      q.addEventListener('input', draw);
      body.querySelectorAll('[data-cat]').forEach(function (c) {
        c.addEventListener('click', function () { refCat = c.dataset.cat === 'Все' ? null : c.dataset.cat; body.querySelectorAll('[data-cat]').forEach(function (x) { x.setAttribute('aria-pressed', x === c ? 'true' : 'false'); }); draw(); });
      });
      draw();
    }
    drawer.addEventListener('click', function (e) {
      var t = e.target.closest('[data-tab]'); if (t) { refTab = t.dataset.tab; drawTab(); return; }
      if (e.target.closest('.d-close')) { closeRef(); return; }
      var ins = e.target.closest('[data-ins]');
      if (ins) { if (activeTerm && !document.body.classList.contains('present')) { closeRef(); activeTerm.insert(ins.dataset.ins); } else toast('Тренажёр скрыт в режиме показа'); return; }
      var cp = e.target.closest('[data-copy]');
      if (cp) { try { navigator.clipboard.writeText(cp.dataset.copy).then(function () { toast('Команда скопирована'); }, function () { toast('Не удалось скопировать — выделите текст вручную'); }); } catch (err) { toast('Не удалось скопировать — выделите текст вручную'); } }
    });
    drawTab();
  }
  document.addEventListener('click', function (e) { if (e.target.closest('[data-open-ref]')) { e.preventDefault(); $('#side').classList.remove('open'); openRef(); } });
  scrim.addEventListener('click', closeRef);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && drawer.classList.contains('open')) closeRef();
    if (e.key === 'Tab' && drawer.classList.contains('open')) { // фокус остаётся внутри панели
      var f = drawer.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])'); if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  $('#refBtn').addEventListener('click', function () { drawer.classList.contains('open') ? closeRef() : openRef(); });

  /* ---------- Режим показа (для проектора) ---------- */
  var presBtn = $('#presBtn');
  function setPresent(on) {
    document.body.classList.toggle('present', on); presBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    try { localStorage.setItem('cmd-course-present', on ? '1' : '0'); } catch (e) { }
  }
  presBtn.addEventListener('click', function () { setPresent(!document.body.classList.contains('present')); });
  try { if (localStorage.getItem('cmd-course-present') === '1') setPresent(true); } catch (e) { }

  /* ---------- Маршрутизация ---------- */
  function route() {
    var id = (location.hash || '').replace('#', '') || L[0].id, wantRef = id === 'appendix';
    var idx = -1; L.forEach(function (l, i) { if (l.id === id) idx = i; });
    if (idx < 0) idx = 0;
    renderLesson(L[idx], idx);
    renderSide(L[idx].id);
    $('#side').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false');
    window.scrollTo(0, 0);
    if (wantRef) openRef();
  }
  window.addEventListener('hashchange', route);
  $('#menuBtn').addEventListener('click', function () { var s = $('#side'), open = !s.classList.contains('open'); s.classList.toggle('open', open); this.setAttribute('aria-expanded', open ? 'true' : 'false'); });
  buildDrawer();
  route();
})();

</script>
</body>
