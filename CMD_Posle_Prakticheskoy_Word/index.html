<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:21px/1.48 var(--font)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:var(--blue)}:focus-visible{outline:3px solid #ffb141;outline-offset:3px}
.header{background:var(--navy);color:#fff;padding:17px max(20px,calc((100vw - 1440px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:5px solid #57d6be}.headTitle{font-size:25px;font-weight:800}.headSub{font-size:16px;color:#ccdaf4}.headScore{font-size:19px;border:1px solid #748eb7;padding:9px 16px;border-radius:14px;white-space:nowrap}.headScore b{font-size:26px;color:#a9f3da}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1440px;margin:0 auto;gap:22px;padding:22px}

.eyebrow{font-size:17px;text-transform:uppercase;font-weight:800;letter-spacing:.08em;color:var(--blue)}h1{font-size:clamp(29px,3.6vw,42px);line-height:1.15;margin:9px 0 16px}h2{font-size:26px;margin:24px 0 11px}h3{font-size:22px;margin:16px 0 9px}p{margin:10px 0 16px}.lead{font-size:22px;color:var(--muted)}.small{font-size:17px;color:var(--muted)}.flag{background:var(--blueLight);border-left:6px solid var(--blue);border-radius:12px;padding:15px 18px;margin:16px 0}.warn{background:var(--orangeLight);border-left:6px solid var(--orange);border-radius:12px;padding:15px 18px;margin:16px 0}.okbox{background:var(--tealLight);border-left:6px solid var(--teal);border-radius:12px;padding:15px 18px;margin:16px 0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.formField{display:flex;flex-direction:column;gap:6px;margin:8px 0}.formField label{font-weight:750}.formField input,.formField textarea{border:2px solid #b6c6e0;border-radius:10px;padding:12px 13px;width:100%;min-width:0;background:white;color:var(--ink)}.formField textarea{min-height:125px;resize:vertical}input[type=checkbox],input[type=radio]{accent-color:var(--blue);width:22px;height:22px;flex:none}

pre,code{font-family:var(--mono)}code{background:#eaf0f9;font-size:.88em;border-radius:5px;padding:2px 5px}pre{background:#0e1a31;color:#d9f4ea;padding:17px 19px;border-radius:15px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px;line-height:1.7}.terminal{background:#0e1a31;color:#eaf3ff;padding:20px;border-radius:15px;font:18px/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.orderItem{display:grid;grid-template-columns:45px minmax(0,1fr) auto;gap:13px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:13px;margin:9px 0;background:#f8faff}.orderItem code{font-size:17px;overflow-wrap:anywhere}.orderIndex{font-weight:850;color:var(--blue)}.arrow{width:46px;height:43px;border:2px solid #b6c6e0;border-radius:10px;background:white;font-weight:900;color:var(--blue)}.tiny{font-size:16px}.step{padding:13px 0;border-bottom:1px solid var(--line)}.step select{display:block;width:100%;background:white;color:var(--ink);border:2px solid #b6c6e0;padding:12px;border-radius:11px;margin:9px 0;font:17px var(--mono);min-width:0}.summaryTable{border-collapse:collapse;width:100%;font-size:19px}.summaryTable th,.summaryTable td{text-align:left;border-bottom:1px solid var(--line);padding:12px 8px}.summaryTable th{background:#edf3fe}.summaryTable td:last-child{text-align:right;white-space:nowrap;font-weight:750}.reportText{width:100%;height:330px;max-height:55vh;background:#f8faff;color:var(--ink);padding:15px;border:2px solid #b6c6e0;border-radius:12px;font:15px/1.5 var(--mono)}

@media(max-width:980px){.layout{grid-template-columns:1fr;padding:12px}.side{position:relative;top:0}.nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}.nav button{min-width:180px;font-size:16px;padding:8px}.sideTitle,.sidebarFoot{display:none}.main{padding:22px;min-height:0}.grid2{grid-template-columns:1fr}}
@media(max-width:650px){body{font-size:19px}.headTitle{font-size:22px}.header{padding:16px}.main{padding:16px}.orderItem{grid-template-columns:30px minmax(0,1fr)}.orderItem .row{grid-column:2}.q{padding:12px}.step select{font-size:15px}h1{font-size:29px}}
@media print{body{background:white}.header,.side,.actions{display:none}.layout{display:block;padding:0}.main{border:0;box-shadow:none;padding:0}.reportText{height:auto;white-space:pre-wrap}h1{font-size:26px}}
</style>

o+='<div class="grid2"><div class="formField"><label for="fio">Фамилия, имя и отчество</label><input id="fio" data-who="fio" autocomplete="name" placeholder="Иванов Иван Иванович" value="'+esc(S.who.fio)+'"></div><div class="formField"><label for="group">Учебная группа</label><input id="group" data-who="group" placeholder="ИСП-215" value="'+esc(S.who.group)+'"></div></div>';
o+='<h2>Проверьте готовность к продолжению</h2>';evidenceLabels.forEach(function(a){o+='<label class="checkline"><input type="checkbox" data-gate="'+a[0]+'" '+(S.gate[a[0]]?'checked':'')+'><span><strong>'+esc(a[1])+'</strong></span></label>';});
o+='<p class="small">Отмечено '+done+' из 6. Если Chocolatey отсутствует или действия требуют прав, зафиксируйте это в отчёте; установка ПО не обязательна.</p><div class="warn"><b>Безопасность.</b> Не запускайте <code>del</code>, <code>rmdir /s</code> или <code>taskkill /F</code> на системных файлах, чужих процессах и рабочих документах. Никакие команды из тренажёра не запускаются на вашем компьютере автоматически.</div>';
o+='<div class="actions"><button class="btn good" id="unlock">Практическая выполнена — перейти к продолжению</button><span class="small" id="gateMsg"></span><span class="spacer"></span><a href="https://mayyayan.github.io/test/Komandnaya_stroka_Windows/" target="_blank" rel="noopener noreferrer">Теория и справочник CMD</a></div>';
return o;}
function quizPage(id,title,desc,prefix){var q=qbank[id],point=maxScore(id)/q.length;
var o=heading(prefix,title,desc);if(id==='process')o+='<div class="terminal">C:\\Lab&gt; tasklist | findstr /i "notepad.exe"\nnotepad.exe             4512 Console                    10 200 КБ\n\nЭто пример данных, а не сведения о вашем компьютере.</div>';
if(id==='network')o+='<div class="terminal">C:\\Lab&gt; ipconfig\nIPv4: 192.168.1.40    Шлюз: 192.168.1.1\nC:\\Lab&gt; ping 192.168.1.1\nОтправлено = 4, Получено = 4, Потеряно = 0\nC:\\Lab&gt; ping example.org\nОтправлено = 4, Получено = 0, Потеряно = 4\nC:\\Lab&gt; netstat -ano\nTCP 0.0.0.0:445 0.0.0.0:0 LISTENING 4</div>';
if(id==='packages')o+='<div class="warn">Команды Chocolatey здесь разбираются как учебный синтаксис. Ничего устанавливать, обновлять или удалять на компьютере не нужно.</div>';
q.forEach(function(item,i){var k=id+'_'+i;var chose=S.answers[k];o+='<div class="q"><div class="qtitle">Вопрос '+(i+1)+' из '+q.length+' <span class="pill">'+point+' балла</span><div>'+esc(item[0])+'</div></div>';item[1].forEach(function(op,j){o+='<label class="option"><input type="radio" name="'+k+'" data-answer="'+k+'" value="'+j+'" '+(String(chose)===String(j)?'checked':'')+'><span>'+esc(op)+'</span></label>';});if(checked(id)){var ok=Number(chose)===item[2];o+='<div class="feedback '+(ok?'yes':'')+'">'+(ok?'Верно. ':'Пересмотрите выбор. ')+esc(item[3])+'</div>';}o+='</div>';});
o+='<div class="actions"><button class="btn good" data-check="'+id+'">Проверить ответы</button>'+scoreStatus(id)+'<span class="spacer"></span><button class="btn secondary" data-nav="'+prev(id)+'">← Назад</button><button class="btn" data-nav="'+next(id)+'">Далее →</button></div>';return o;}
function scoreStatus(id){return '<div class="scoreLine '+(checked(id)?'':'missing')+'">'+(checked(id)?'Результат: '+S.marks[id]+' / '+maxScore(id)+' · попыток: '+attempts(id):'Проверка ещё не выполнена')+'</div>';}
function prev(id){var i=pages.findIndex(function(x){return x.id===id;});return pages[Math.max(0,i-1)].id;}
function next(id){var i=pages.findIndex(function(x){return x.id===id;});return pages[Math.min(pages.length-1,i+1)].id;}
function orderPage(){var o=heading('Этап 2 · 12 баллов','Соберите последовательность команд','После работы с отдельными командами нужно составить воспроизводимый алгоритм. Расположите строки для создания резервной копии в правильном порядке.');
o+='<div class="flag">Все действия относятся только к учебной папке <code>CMD_Continuation_Lab</code> в профиле пользователя. Перетаскивать ничего не нужно: пользуйтесь стрелками.</div>';
S.order.forEach(function(v,i){o+='<div class="orderItem"><span class="orderIndex">'+(i+1)+'</span><code>'+esc(orderExpected[v])+'</code><span class="row"><button class="arrow" title="Выше" data-move="up" data-i="'+i+'" '+(i===0?'disabled':'')+'>↑</button><button class="arrow" title="Ниже" data-move="down" data-i="'+i+'" '+(i===5?'disabled':'')+'>↓</button></span></div>';});o+='<div class="actions"><button class="btn good" data-check="order">Проверить порядок</button>'+scoreStatus('order')+'<span class="spacer"></span><button class="btn secondary" data-nav="audit">← Назад</button><button class="btn" data-nav="errors">Далее →</button></div>';return o;}
function batchGood(){return safeLines.every(function(a,i){return Number(S.batch[i])===a.answer;});}
function cmdText(){return safeLines.map(function(a,i){return S.batch[i]===undefined?'REM Step '+(i+1)+' not chosen':a.options[Number(S.batch[i])];}).join('\r\n')+'\r\npause\r\n';}
function batchPage(){var o=heading('Этап 2 · 18 баллов','Конструктор безопасного .bat','В исходной работе вы сделали первый batch-файл с echo и pause. Теперь создайте сценарий, который при повторном запуске не ломается и сохраняет копию файла.');
o+='<div class="okbox"><b>Что делает готовый файл:</b> создаёт только <code>%USERPROFILE%\\CMD_Continuation_Lab</code>, записывает <code>audit.txt</code>, копирует его в <code>audit_backup.txt</code>, выводит список файлов. Нет удаления, закрытия процессов или установки программ.</div>';
safeLines.forEach(function(a,i){o+='<div class="step"><b>Шаг '+(i+1)+'. '+esc(a.title)+'</b><select data-batch="'+i+'"><option value="">Выберите строку команды</option>';a.options.forEach(function(t,j){o+='<option value="'+j+'" '+(String(S.batch[i])===String(j)?'selected':'')+'>'+esc(t)+'</option>';});o+='</select></div>';});
o+='<h2>Предпросмотр batch-файла</h2><pre>'+esc(cmdText())+'</pre><div class="actions"><button class="btn good" data-check="batch">Проверить сценарий</button>'+scoreStatus('batch')+'<button class="btn secondary" id="downloadBat" '+(!checked('batch')||!batchGood()?'disabled':'')+'>Скачать готовый .bat</button><span class="spacer"></span><button class="btn" data-nav="report">К отчёту →</button></div><p class="small">Кнопка скачивания становится доступной только после правильной сборки. Сначала ознакомьтесь с каждой строкой, затем запустите файл в Windows и убедитесь, что появились два текстовых файла.</p>';return o;}
function reportText(){var x=['ПРОДОЛЖЕНИЕ ПРАКТИЧЕСКОЙ РАБОТЫ CMD','Тема: диагностика, ошибки, пакетное управление и batch','ФИО: '+S.who.fio,'Группа: '+S.who.group,'Дата выгрузки: '+new Date().toLocaleString('ru-RU'),'','ПЕРВЫЙ ЭТАП (исходная Word-практика):'];evidenceLabels.forEach(function(a){x.push((S.gate[a[0]]?'[x] ':'[ ] ')+a[1]);});x.push('','АВТОПРОВЕРКА (максимум 90):');pages.filter(function(p){return p.max&&p.id!=='report';}).forEach(function(p){x.push(p.label+': '+(checked(p.id)?S.marks[p.id]:'не проверено')+' / '+p.max+'; попыток: '+attempts(p.id));});x.push('Автосумма: '+sumScore()+' / 90','Ручная проверка преподавателя: до 10 баллов','Итог: после проверки развёрнутых ответов преподавателем','','ОТВЕТЫ НА ЗАДАНИЯ:');Object.keys(qbank).forEach(function(k){x.push('['+k+']');qbank[k].forEach(function(q,i){var a=S.answers[k+'_'+i];x.push((i+1)+'. '+q[0]+' => '+(a===undefined?'нет ответа':q[1][Number(a)]));});});x.push('[Алгоритм CMD]');S.order.forEach(function(i,j){x.push((j+1)+'. '+orderExpected[i]);});x.push('[Batch]');x.push(cmdText(),'','ОТКРЫТЫЕ ОТВЕТЫ (оценить до 10 баллов):','Почему сценарий безопасен: '+S.write.why,'Чем отличается новый batch от первого: '+S.write.difference,'Результат запуска: '+S.write.run,'Вывод: '+S.write.conclusion,'','Примечание: результаты хранятся только в браузере обучающегося; учитель получает их из этого отчёта.');return x.join('\n');}
function reportPage(){var o=heading('Этап 3 · до 10 баллов','Отчёт и вывод','Завершите работу: опишите, что изменилось по сравнению с первой практикой, и передайте преподавателю отчёт вместе со скриншотами выполнения CMD.');
o+='<div class="flag">Автоматически проверяется до <b>90 баллов</b>, ещё <b>10 баллов</b> преподаватель выставляет после проверки развёрнутых ответов и доказательств выполнения. Оценка «2–5» выставляется только по общей сумме из 100.</div>';
var labels=[['why','Почему новый .bat безопасен для учебного компьютера?'],['difference','Чем он отличается от первого .bat из исходного задания?'],['run','Запустите созданный файл и опишите, какие файлы появились (или почему запуск невозможен).'],['conclusion','Сформулируйте вывод: когда CMD эффективнее ручных действий?']];
labels.forEach(function(a){o+='<div class="formField"><label for="w_'+a[0]+'">'+esc(a[1])+'</label><textarea data-write="'+a[0]+'" id="w_'+a[0]+'" placeholder="Ваш ответ — 2–4 предложения">'+esc(S.write[a[0]])+'</textarea></div>';});
o+='<h2>Сводная ведомость</h2><table class="summaryTable"><thead><tr><th>Часть</th><th>Баллы</th></tr></thead><tbody>';pages.filter(function(p){return p.max&&p.id!=='report';}).forEach(function(p){o+='<tr><td>'+esc(p.label)+'</td><td>'+(checked(p.id)?S.marks[p.id]:'—')+' / '+p.max+'</td></tr>';});o+='<tr><td><b>Автоматически</b></td><td><b>'+sumScore()+' / 90</b></td></tr><tr><td>Открытые ответы и скриншоты</td><td>до 10, проверка преподавателя</td></tr><tr><td>Всего</td><td>100</td></tr></tbody></table>';
o+='<div class="grid2"><div class="flag">90–100 баллов → «5»<br>75–89 → «4»<br>60–74 → «3»<br>0–59 → «2»</div><div class="warn">Добавьте к отчёту из первой работы таблицу команд и скриншоты. Этот сайт автоматически не отправляет ответы преподавателю.</div></div>';
o+='<h2>Текст для преподавателя</h2><textarea class="reportText" readonly id="outReport">'+esc(reportText())+'</textarea><div class="actions"><button id="copyReport" class="btn good">Скопировать отчёт</button><button id="saveReport" class="btn secondary">Скачать отчёт .txt</button><button id="printReport" class="btn soft">Печать / PDF</button><span class="spacer"></span><button id="reset" class="btn soft">Очистить для следующего студента</button></div><p class="small">Отчёт можно вставить в Word после таблицы из исходной практической работы. Преподаватель проверяет скриншоты и оценивает ответы.</p>';return o;}
function draw(){if(!S.unlocked&&S.active!=='gate')S.active='gate';nav();var html='';switch(S.active){case 'gate':html=gatePage();break;case 'audit':html=quizPage('audit','Что означают результаты команд?','Проверьте понимание выполненных в первой работе команд: назначение, вывод и риски.','Задание 1 · 10 баллов');break;case 'order':html=orderPage();break;case 'errors':html=quizPage('errors','Исправьте ошибки начинающего администратора','Теперь важно не просто ввести команду, а определить причину ошибки и выбрать безопасное решение.','Задание 3 · 16 баллов');break;case 'process':html=quizPage('process','Кейс: зависшая программа','Изучите учебный вывод tasklist и примите решения, не воздействуя на реальные процессы.','Задание 4 · 12 баллов');break;case 'network':html=quizPage('network','Кейс: сеть работает не полностью','Используйте учебные результаты ipconfig, ping, netstat. Не делайте выводов, которых не подтверждают данные.','Задание 5 · 12 баллов');break;case 'packages':html=quizPage('packages','Chocolatey без риска','Отличите установку, обновление и удаление пакетов. Ответьте без установки ПО на компьютере.','Задание 6 · 10 баллов');break;case 'batch':html=batchPage();break;case 'report':html=reportPage();break;}$('#content').innerHTML=html;save();}
function show(id){if(!pages.some(function(p){return p.id===id;}))return;if(!S.unlocked&&id!=='gate'){alert('Сначала выполните исходную практическую работу и подтвердите готовность.');return;}S.active=id;draw();window.scrollTo(0,0);}
function invalidate(id){delete S.marks[id];}
function mark(id,points){S.marks[id]=points;S.attempts[id]=attempts(id)+1;save();draw();}
function checkQuiz(id){var x=qbank[id],score=0,p=maxScore(id)/x.length;x.forEach(function(q,i){if(Number(S.answers[id+'_'+i])===q[2])score+=p;});mark(id,score);}
function checkOrder(){mark('order',S.order.reduce(function(n,v,i){return n+(v===i?2:0);},0));}
function checkBatch(){var count=safeLines.reduce(function(n,l,i){return n+(Number(S.batch[i])===l.answer?1:0);},0);mark('batch',count*3);}
function download(name,data,type){var b=new Blob([data],{type:type||'text/plain;charset=utf-8'}),a=document.createElement('a'),url=URL.createObjectURL(b);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},2500);}
document.addEventListener('change',function(e){var t=e.target;if(t.matches('[data-gate]')){S.gate[t.dataset.gate]=t.checked;save();var msg=$('#gateMsg');if(msg)msg.textContent='Отмечено '+evidenceLabels.filter(function(a){return S.gate[a[0]];}).length+' из 6.';}
if(t.matches('[data-answer]')){S.answers[t.dataset.answer]=Number(t.value);invalidate(t.dataset.answer.split('_')[0]);save();draw();}
if(t.matches('[data-batch]')){S.batch[t.dataset.batch]=t.value===''?undefined:Number(t.value);invalidate('batch');save();draw();}});
document.addEventListener('input',function(e){var t=e.target;if(t.matches('[data-who]')){S.who[t.dataset.who]=t.value;save();}if(t.matches('[data-write]')){S.write[t.dataset.write]=t.value;save();var r=$('#outReport');if(r)r.value=reportText();}});
document.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;if(t.dataset.nav){show(t.dataset.nav);return;}
if(t.id==='unlock'){var got=evidenceLabels.every(function(a){return !!S.gate[a[0]];});if(!S.who.fio.trim()||!S.who.group.trim()||!got){$('#gateMsg').textContent='Заполните ФИО и группу, затем отметьте все шесть разделов исходной работы.';return;}S.unlocked=true;show('audit');return;}
if(t.dataset.move){var n=Number(t.dataset.i),j=n+(t.dataset.move==='up'?-1:1);if(j>=0&&j<S.order.length){var temp=S.order[n];S.order[n]=S.order[j];S.order[j]=temp;invalidate('order');draw();}return;}
if(t.dataset.check){if(t.dataset.check==='order')checkOrder();else if(t.dataset.check==='batch')checkBatch();else checkQuiz(t.dataset.check);return;}
if(t.id==='downloadBat'){if(!checked('batch')||!batchGood())return;download('CMD_Continuation_Lab.bat',cmdText(),'application/octet-stream');return;}
if(t.id==='copyReport'){var txt=reportText();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){t.textContent='Скопировано ✓';}).catch(function(){$('#outReport').select();document.execCommand('copy');t.textContent='Скопировано';});}else{$('#outReport').select();document.execCommand('copy');t.textContent='Скопировано';}return;}
if(t.id==='saveReport'){download('Otchet_CMD_'+S.who.group.replace(/[^a-zA-Zа-яА-ЯёЁ0-9_-]/g,'_')+'.txt','\ufeff'+reportText());return;}
if(t.id==='printReport'){window.print();return;}
if(t.id==='reset'){if(window.confirm('Очистить ВСЕ введённые данные этого браузера?')){localStorage.removeItem(KEY);S=deepCopy(defaultState);draw();}return;}
});
draw();
})();
</script>
</body>
