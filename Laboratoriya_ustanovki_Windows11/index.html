<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лаборатория установки Windows 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Учебная лаборатория: лента этапов сверху, слева задание и теория, ниже — симулятор. Уровни сложности растут от этапа к этапу. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #141820;
  --muted: #5a6273;
  --line: #dde2ea;
  --accent: #0063b8;
  --accent-ink: #ffffff;
  --accent-soft: #e5f0fb;
  --ok: #157a4f;
  --ok-soft: #e3f3ea;
  --bad: #b8322a;
  --bad-soft: #fbeae8;
  --warn: #9a5b06;
  --warn-soft: #fdf2df;
  --def-soft: #f2f4f8;
  --font-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, monospace;
  --font-win: "Segoe UI Variable Text", "Segoe UI", "Golos Text", system-ui, sans-serif;
  --header-h: 58px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101317; --surface: #181c22; --ink: #e7eaf0; --muted: #9ba3b2; --line: #2a303a;
    --accent: #6fb1ff; --accent-ink: #0b1422; --accent-soft: #16263d; --ok: #4fc58d; --ok-soft: #13291f;
    --bad: #ff8a80; --bad-soft: #35191a; --warn: #f0b35a; --warn-soft: #33260f; --def-soft: #1f242c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101317; --surface: #181c22; --ink: #e7eaf0; --muted: #9ba3b2; --line: #2a303a;
  --accent: #6fb1ff; --accent-ink: #0b1422; --accent-soft: #16263d; --ok: #4fc58d; --ok-soft: #13291f;
  --bad: #ff8a80; --bad-soft: #35191a; --warn: #f0b35a; --warn-soft: #33260f; --def-soft: #1f242c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, kbd { font-family: var(--font-mono); }
code { font-size: .88em; background: var(--def-soft); padding: .1em .35em; border-radius: 4px; }
kbd { font-size: .8em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: .05em .45em; background: var(--surface); white-space: nowrap; }
a { color: var(--accent); }

/* ---------- Шапка и лента этапов ---------- */
.top { position: sticky; top: 0; z-index: 40; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { height: var(--header-h); display: flex; align-items: center; gap: 16px; padding: 0 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; white-space: nowrap; }
.logo { width: 30px; height: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.logo i { background: var(--accent); border-radius: 2px; }
.who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.who input { width: 200px; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }
.who input:focus { border-color: var(--accent); outline: none; }
.total { font-weight: 600; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.steps { display: flex; gap: 6px; padding: 0 20px 12px; overflow-x: auto; scrollbar-width: thin; }
.step { flex: 1 0 128px; display: flex; flex-direction: column; gap: 4px; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; cursor: pointer; text-decoration: none; color: var(--ink); min-width: 128px; }
.step:hover { border-color: var(--accent); }
.step[aria-current="page"] { border-color: var(--accent); background: var(--accent-soft); }
.step .s-top { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
.step .s-title { font-size: 13.5px; font-weight: 600; line-height: 1.25; }
.step.done { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.lvl { display: inline-flex; gap: 3px; }
.lvl i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.lvl i.on { background: var(--accent); }
.stars { letter-spacing: 1px; white-space: nowrap; }
.star { color: var(--line); }
.star.on { color: #e3a008; }

/* ---------- Страница этапа ---------- */
main { max-width: 1180px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 32px) 64px; }
.kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 14px; color: var(--muted); }
.kicker b { color: var(--accent); }
h1 { font-size: clamp(26px, 3.2vw, 36px); line-height: 1.15; letter-spacing: -.02em; margin: 8px 0 10px; text-wrap: balance; }
.lead { font-size: 18px; color: var(--muted); max-width: 70ch; margin: 0 0 20px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; }
.card h2 { font-size: 17px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.card h3 { font-size: 15.5px; margin: 14px 0 4px; }
.card p, .card li { font-size: 15.5px; }
.card ul, .card ol { padding-left: 1.25em; margin: 6px 0; }
.card li { margin: 3px 0; }
details.card summary { cursor: pointer; font-weight: 700; font-size: 17px; list-style: none; display: flex; align-items: center; gap: 8px; }
details.card summary::before { content: "▸"; color: var(--accent); transition: transform .2s; }
details.card[open] summary::before { transform: rotate(90deg); }
details.card summary::-webkit-details-marker { display: none; }
.mission { border-left: 4px solid var(--accent); }
.mission ol { counter-reset: m; list-style: none; padding: 0; }
.mission ol li { counter-increment: m; display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.mission ol li::before { content: counter(m); width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 2px; }
.mission ol li.ok::before { content: "✓"; background: var(--ok); color: #fff; }
.note { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: 15px; margin: 10px 0; }
.warnbox { background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; font-size: 15px; margin: 10px 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; margin: 8px 0; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }

.status { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 22px 0 12px; }
.status h2 { margin: 0; font-size: 20px; }
.pill { font-size: 13.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--def-soft); font-variant-numeric: tabular-nums; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 16px; cursor: pointer; font-weight: 600; font-size: 15px; }
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.small { padding: 4px 10px; font-size: 13.5px; }
.result { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); border-radius: 14px; padding: 16px 20px; margin: 18px 0; }
.result .big .stars { font-size: 30px; letter-spacing: 4px; }
.result b { font-size: 18px; }
.result p { margin: 2px 0 0; color: var(--muted); }
.result .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.feedback { margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 15px; }
.feedback.ok { background: var(--ok-soft); color: var(--ok); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback.info { background: var(--accent-soft); }
.log { margin: 10px 0 0; padding: 0; list-style: none; font-size: 14px; color: var(--muted); }
.log li::before { content: "— "; }
.sim { margin-top: 6px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 90; max-width: 90vw; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Этап 1: карточки компьютеров ---------- */
.pcs { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.pc { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.pc.right { border-color: var(--ok); }
.pc.wrong { border-color: var(--bad); }
.pc h3 { margin: 0; font-size: 16px; }
.pc dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; font-size: 14px; }
.pc dt { color: var(--muted); }
.pc dd { margin: 0; font-weight: 500; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 4px; font-size: 13.5px; cursor: pointer; border-right: 1px solid var(--line); line-height: 1.2; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--def-soft); border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.pc .expl { font-size: 14px; border-radius: 8px; padding: 8px 10px; }
.pc .expl.ok { background: var(--ok-soft); }
.pc .expl.bad { background: var(--bad-soft); color: var(--bad); }

/* ---------- Окна Windows ---------- */
.w { font-family: var(--font-win); background: #f3f3f3; color: #1b1b1b; border: 1px solid #c9c9c9; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.15); overflow: hidden; font-size: 14px; line-height: 1.4; color-scheme: light; }
.w-tb { height: 32px; display: flex; align-items: center; gap: 8px; padding-left: 12px; background: #eeeeee; font-size: 12.5px; }
.w-tb .ctl { margin-left: auto; display: flex; }
.w-tb .ctl span { width: 44px; height: 32px; display: grid; place-items: center; font-size: 12px; color: #333; }
.w-body { padding: 14px 16px; }
.w select, .w input[type=text], .w input[type=password] { width: 100%; padding: 5px 8px; border: 1px solid #b7b7b7; border-bottom: 2px solid #8a8a8a; border-radius: 4px; background: #fff; color: #1b1b1b; font-family: var(--font-win); font-size: 14px; }
.w select:focus, .w input:focus { border-bottom-color: #0067c0; outline: none; }
.wbtn { border: 1px solid #c4c4c4; background: #fdfdfd; border-radius: 4px; padding: 5px 16px; cursor: pointer; font-family: var(--font-win); font-size: 14px; color: #1b1b1b; min-width: 80px; }
.wbtn:hover:not([disabled]) { background: #f5f5f5; }
.wbtn.acc { background: #0067c0; border-color: #0067c0; color: #fff; }
.wbtn.acc:hover:not([disabled]) { background: #1975c5; }
.wbtn[disabled] { opacity: .5; cursor: default; }

.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 80; display: grid; place-items: center; padding: 16px; }
.modal { max-width: 520px; width: 100%; }
.modal .w-body p { margin: 0 0 10px; }
.modal .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.cb { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; cursor: pointer; }
.cb input { margin-top: 3px; accent-color: #0067c0; }

/* Порядок шагов */

.boot-screen { background: #000; color: #ddd; font-family: var(--font-mono); padding: 18px; border-radius: 10px; min-height: 160px; white-space: pre-wrap; font-size: 13.5px; }

/* Media Creation Tool */
.mct { max-width: 720px; }
.mct .w-body { padding: 22px 28px; min-height: 300px; }
.mct h3 { font-size: 20px; font-weight: 600; margin: 0 0 10px; }
.mct .mct-sub { color: #555; margin: 0 0 14px; font-size: 14px; }
.mct .mct-lic { border: 1px solid #ddd; background: #fff; border-radius: 6px; padding: 10px; height: 150px; overflow: auto; font-size: 13px; }
.mct .acts { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid #ddd; background: #eeeeee; min-height: 52px; }
.hash { font-family: var(--font-mono); font-size: 13px; word-break: break-all; background: var(--def-soft); border-radius: 6px; padding: 6px 8px; margin-top: 6px; letter-spacing: .02em; }
.hashes { display: grid; gap: 10px; }
.hfile { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(0, 2fr) 230px; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.hfile small { color: var(--muted); }
.hfile .hash { margin: 0; }
.hcmd { display: flex; gap: 6px; flex-wrap: wrap; }
.hcmd select, select.inp { padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; max-width: 100%; }
@media (max-width: 900px) { .hfile { grid-template-columns: 1fr; } }

/* VirtualBox */
.vb { display: grid; grid-template-columns: 180px minmax(0, 1fr); min-height: 400px; background: #fff; }
.vb-nav { background: #f6f6f6; border-right: 1px solid #ddd; padding: 8px 0; }
.vb-nav button { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 9px 16px; font-family: var(--font-win); font-size: 14px; cursor: pointer; color: #1b1b1b; }
.vb-nav button:hover { background: #e9f2fb; }
.vb-nav button[aria-current="true"] { background: #cce4f7; font-weight: 600; }
.vb-pane { padding: 14px 18px; }
.vb-pane h4 { margin: 0 0 10px; font-size: 17px; font-weight: 600; }
.vb-tabs { display: flex; gap: 2px; border-bottom: 1px solid #ccc; margin-bottom: 12px; }
.vb-tabs button { border: 1px solid transparent; background: none; padding: 6px 14px; cursor: pointer; font-family: var(--font-win); font-size: 13.5px; color: #1b1b1b; border-radius: 4px 4px 0 0; margin-bottom: -1px; }
.vb-tabs button[aria-selected="true"] { border-color: #ccc; border-bottom-color: #fff; background: #fff; font-weight: 600; }
.vb-row { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 10px; align-items: start; margin: 10px 0; font-size: 14px; }
.vb-row > label, .vb-row > span:first-child { padding-top: 5px; }
.vb-row select { max-width: 220px; }
.boot-list { list-style: none; margin: 0; padding: 0; max-width: 300px; border: 1px solid #ccc; border-radius: 4px; overflow: hidden; }
.boot-list li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 6px; align-items: center; padding: 4px 8px; border-bottom: 1px solid #eee; background: #fff; }
.boot-list li:last-child { border-bottom: 0; }
.boot-list button { border: 1px solid #ccc; background: #f7f7f7; border-radius: 3px; width: 26px; height: 22px; cursor: pointer; font-size: 10px; }
.boot-list button[disabled] { opacity: .35; cursor: default; }
.boot-list input { accent-color: #0067c0; }
.vb-media { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 14px; }
.vb-tree { border: 1px solid #ddd; border-radius: 4px; padding: 8px 10px; font-size: 13.5px; display: grid; gap: 6px; align-content: start; background: #fafafa; }
.vb-warn { margin-top: 10px; padding: 8px 10px; background: #fff4ce; border: 1px solid #f0d27a; border-radius: 4px; font-size: 13px; }
.vb-ft { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid #ddd; background: #eeeeee; }
@media (max-width: 760px) { .vb, .vb-media, .vb-row { grid-template-columns: 1fr; } .vb-nav { display: flex; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid #ddd; padding: 0; } .vb-nav button { width: auto; } }

/* Установщик Windows */
.setup { background: linear-gradient(135deg, #1b1f4a 0%, #2b2f72 55%, #3a2f74 100%); border-radius: 12px; padding: clamp(14px, 3vw, 34px); min-height: 520px; display: grid; place-items: center; color-scheme: light; }
.sdlg { width: min(760px, 100%); background: #fbfbfb; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.35); font-family: var(--font-win); color: #1b1b1b; overflow: hidden; }
.sdlg-hd { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 12.5px; color: #555; border-bottom: 1px solid #e6e6e6; }
.sdlg-bd { padding: 20px 26px; min-height: 330px; }
.sdlg-bd h3 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
.sdlg-bd p.sub { color: #555; margin: 0 0 16px; font-size: 14px; }
.sdlg-ft { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 20px; border-top: 1px solid #e6e6e6; background: #f5f5f5; }
.sdlg-ft .r { display: flex; gap: 8px; margin-left: auto; }
.sfield { display: grid; gap: 4px; margin: 0 0 14px; max-width: 420px; font-size: 14px; }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; margin: 6px 0; cursor: pointer; background: #fff; }
.radio input { accent-color: #0067c0; margin-top: 4px; }
.radio small { display: block; color: #666; }
.lnk { border: 0; background: none; color: #0067c0; cursor: pointer; padding: 0; font-family: var(--font-win); font-size: 14px; text-decoration: underline; }
.dtable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.dtable th { text-align: left; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid #ddd; color: #444; }
.dtable td { padding: 6px 8px; border-bottom: 1px solid #eee; cursor: pointer; }
.dtable tr.sel td { background: #cce4f7; }
.dtable tr.disk td { font-weight: 600; background: #f1f1f1; cursor: default; }
.dtools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.dtools .lnk { font-size: 13.5px; text-decoration: none; padding: 4px 8px; border-radius: 4px; }
.dtools .lnk:hover:not([disabled]) { background: #e9f2fb; }
.dtools .lnk[disabled] { color: #999; cursor: default; }
.sbar { height: 6px; background: #e3e3e3; border-radius: 3px; overflow: hidden; margin: 16px 0 8px; }
.sbar span { display: block; height: 100%; width: 0; background: #0067c0; transition: width .3s; }
.slist { list-style: none; padding: 0; margin: 10px 0; font-size: 14px; }
.slist li { padding: 3px 0; color: #777; }
.slist li.now { color: #1b1b1b; font-weight: 600; }
.slist li.fin { color: #157a4f; }
.slist li.fin::before { content: "✓ "; }

/* OOBE */
.oobe { background: #e9eef6; border-radius: 12px; padding: clamp(12px, 3vw, 30px); min-height: 520px; display: grid; place-items: center; color-scheme: light; }
.ocard { width: min(860px, 100%); min-height: 460px; background: #fff; border-radius: 10px; box-shadow: 0 12px 40px rgba(20,40,80,.15); display: grid; grid-template-columns: 38% 1fr; overflow: hidden; font-family: var(--font-win); color: #1b1b1b; }
@media (max-width: 700px) { .ocard { grid-template-columns: 1fr; } .oart { min-height: 120px !important; } }
.oart { background: linear-gradient(160deg, #dbe8fb, #c3d7f6); display: grid; place-items: center; padding: 20px; min-height: 200px; }
.oart svg { width: 60%; max-width: 160px; height: auto; }
.obody { padding: 26px 28px; display: flex; flex-direction: column; }
.obody h3 { font-size: 24px; font-weight: 600; margin: 0 0 8px; line-height: 1.25; }
.obody p.sub { color: #555; margin: 0 0 14px; font-size: 14px; }
.olist { border: 1px solid #ddd; border-radius: 6px; max-height: 200px; overflow-y: auto; }
.olist button { display: block; width: 100%; text-align: left; border: 0; background: #fff; padding: 8px 12px; font-family: var(--font-win); font-size: 14px; cursor: pointer; color: #1b1b1b; }
.olist button:hover { background: #f2f6fc; }
.olist button[aria-pressed="true"] { background: #cce4f7; }
.ofoot { margin-top: auto; padding-top: 16px; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.ofoot .left { margin-right: auto; }
.tgl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
.tgl small { color: #666; grid-column: 1; }
.sw { position: relative; width: 40px; height: 20px; border-radius: 10px; border: 1px solid #666; background: #fff; cursor: pointer; padding: 0; grid-row: 1 / span 2; grid-column: 2; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: #333; transition: left .15s; }
.sw[aria-checked="true"] { background: #0067c0; border-color: #0067c0; }
.sw[aria-checked="true"]::after { left: 23px; background: #fff; }
.opts2 { display: grid; gap: 10px; }
.obig { text-align: left; border: 1px solid #ccc; border-radius: 8px; padding: 14px; background: #fff; cursor: pointer; font-family: var(--font-win); color: #1b1b1b; }
.obig:hover { border-color: #0067c0; }
.obig b { display: block; font-size: 15px; }
.obig span { font-size: 13px; color: #555; }
.menu-pop { border: 1px solid #ddd; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.12); margin-top: 8px; background: #fff; }
.menu-pop button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; cursor: pointer; font-family: var(--font-win); font-size: 14px; color: #1b1b1b; }
.menu-pop button:hover { background: #f2f6fc; }
.oerr { color: #c42b1c; font-size: 13px; min-height: 1.3em; margin-top: 4px; }

/* Диспетчер устройств */
.dm { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 860px) { .dm { grid-template-columns: 1fr; } }
.dm-menu { display: flex; gap: 14px; padding: 4px 12px; font-size: 13px; border-bottom: 1px solid #ddd; background: #f9f9f9; }
.dm-tree { background: #fff; padding: 8px 4px; min-height: 380px; max-height: 520px; overflow: auto; border-right: 1px solid #ddd; font-size: 13.5px; }
.dm-tree ul { list-style: none; margin: 0; padding-left: 16px; }
.dm-tree > ul { padding-left: 4px; }
.dm-node { display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 6px; cursor: pointer; font-family: var(--font-win); font-size: 13.5px; color: #1b1b1b; border-radius: 3px; text-align: left; width: 100%; }
.dm-node:hover { background: #e5f1fb; }
.dm-node.sel { background: #cce8ff; }
.dm-node .ic { width: 16px; text-align: center; flex: none; }
.dm-node .warn-ic { color: #000; background: #ffcc00; border-radius: 2px; font-size: 10px; font-weight: 700; width: 13px; height: 13px; display: inline-grid; place-items: center; flex: none; }
.dm-props { background: #f3f3f3; padding: 12px; font-size: 13.5px; }
.dm-tabs { display: flex; gap: 2px; border-bottom: 1px solid #ccc; margin-bottom: 10px; }
.dm-tabs button { border: 1px solid transparent; background: none; padding: 5px 12px; cursor: pointer; font-family: var(--font-win); font-size: 13px; color: #1b1b1b; border-radius: 4px 4px 0 0; margin-bottom: -1px; }
.dm-tabs button[aria-selected="true"] { border-color: #ccc; border-bottom-color: #f3f3f3; background: #f3f3f3; font-weight: 600; }
.dm-box { background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 10px; min-height: 90px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
.dm-box code { background: none; padding: 0; font-size: 12.5px; }
.src { display: grid; gap: 6px; margin: 8px 0; }
.src label { display: flex; gap: 8px; align-items: flex-start; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 8px 10px; cursor: pointer; }
.src input { accent-color: #0067c0; margin-top: 3px; }

/* Консоль */
.term { background: #0c0c0c; color: #cccccc; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; height: 460px; border: 1px solid #2a2a2a; color-scheme: dark; }
.term-bar { display: flex; align-items: center; height: 36px; background: #1f1f1f; padding-right: 6px; }
.term-tab { height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #0c0c0c; font-size: 13px; color: #eee; font-family: var(--font-win); }
.term-btn { margin-left: auto; border: 0; background: none; color: #aaa; font-size: 12.5px; padding: 6px 8px; border-radius: 5px; cursor: pointer; }
.term-btn:hover { background: #2c2c2c; color: #fff; }
.term-screen { flex: 1; overflow-y: auto; padding: 10px 14px; font: 13.5px/1.45 var(--font-mono); white-space: pre-wrap; word-break: break-word; cursor: text; }
.term-line { display: flex; }
.term-line .pr { white-space: pre; }
.term-input { flex: 1; min-width: 40px; background: transparent; border: 0; outline: none; color: inherit; font: inherit; padding: 0; }
.tasks { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.tasks li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 15px; padding: 5px 6px; border-radius: 8px; }
.tasks li .bx { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--line); margin-top: 3px; display: grid; place-items: center; }
.tasks li.done .bx { background: var(--ok); border-color: var(--ok); }
.tasks li.done .bx::after { content: "✓"; color: #fff; font-size: 12px; font-weight: 700; }
.tasks li.done .tx { color: var(--muted); }
.tasks .hint { display: block; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }

/* Отчёт */
.report pre { background: var(--def-soft); border-radius: 10px; padding: 14px; font: 13.5px/1.5 var(--font-mono); white-space: pre-wrap; overflow-x: auto; }

@media (max-width: 640px) {
  .who label, .brand .bt { display: none; }
  .who input { width: 140px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

        ['Почему не работает wmic', 'выполните wmic os get caption и ответьте на вопрос ниже', function () { return wmicOk; }]
      ];
      var done = tasks.map(function () { return false; }), wmicOk = false;
      var tl = el('ul', { class: 'tasks' }); left.appendChild(tl);
      var qHost = el('div'); left.appendChild(qHost);
      if (!L.rec('s6').done) left.appendChild(el('div', { class: 'note' }, 'Этап 6 ещё не пройден, поэтому в системе осталось устройство без драйвера — <code>pnputil</code> его покажет.'));
      function drawTasks() {
        tl.innerHTML = tasks.map(function (t, i) { return '<li class="' + (done[i] ? 'done' : '') + '"><span class="bx" aria-hidden="true"></span><span class="tx">' + esc(t[0]) + '<span class="hint">' + esc(t[1]) + '</span></span></li>'; }).join('');
      }
      drawTasks();
      function check() {
        tasks.forEach(function (t, i) { if (!done[i] && t[2]()) { done[i] = true; ctx.mark(i); L.toast('Выполнено: ' + t[0]); } });
        drawTasks();
        if (!wmicOk && H(/^wmic\b/i) && !qHost.innerHTML) askWmic();
        if (done.every(Boolean)) ctx.done('Проведён аудит: версия 26H2, проблемные устройства, drivers.csv, резервная копия драйверов в D:\\DriversBackup, активация.');
      }
      function askWmic() {
        var o = [['WMIC удалена из Windows 11 — нужно использовать PowerShell (Get-CimInstance)', true], ['Консоль запущена без прав администратора', false], ['В команде опечатка', false], ['Нужно сначала установить WMIC через «Дополнительные компоненты»', false]];
        qHost.innerHTML = '<div class="card" style="margin-top:12px"><b>Почему команда wmic не сработала?</b>' + o.map(function (x, i) { return '<label class="cb"><input type="radio" name="wq" value="' + i + '"> <span>' + esc(x[0]) + '</span></label>'; }).join('') + '<button class="btn primary small" type="button" id="wa">Ответить</button><div id="wf"></div></div>';
        $('#wa', qHost).onclick = function () {
          var c = qHost.querySelector('input[name=wq]:checked'); if (!c) return;
          if (!o[+c.value][1]) { ctx.mistake('Неверный ответ про WMIC'); fb($('#wf', qHost), 'bad', +c.value === 3 ? 'С августа 2026 года WMIC нельзя вернуть даже как дополнительный компонент.' : 'Нет. Консоль уже от имени администратора, а команда написана верно.'); return; }
          wmicOk = true; fb($('#wf', qHost), 'ok', 'Верно. WMIC полностью удалена; её задачи выполняет PowerShell: <code>Get-CimInstance Win32_OperatingSystem</code>.'); $('#wa', qHost).disabled = true; check();
        };
      }
      new L.TermView(right, sh, 'Администратор: Командная строка', function () { check(); });
    }
  });
})();

</script>
