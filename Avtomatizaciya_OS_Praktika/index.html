<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Автоматизация в ОС — практикум в командной строке</title>
<style>
/* ===== Практикум «Командная строка»: сцена 1280×720, кегль не меньше 22 pt ===== */
:root{
  --bg:#0B1220; --bar:#111827; --line:#CBD5E1; --ink:#0F172A; --muted:#475569; --panel:#F8FAFC;
  --acc:#22C55E; --acc2:#16A34A; --blue:#2563EB; --blue-soft:#DBEAFE; --amber:#D97706; --amber-soft:#FEF3C7;
  --ok:#15803D; --ok-soft:#DCFCE7; --bad:#B91C1C; --bad-soft:#FEE2E2;
  --ff:"Segoe UI","PT Sans",Arial,sans-serif; --mono:Consolas,"Cascadia Mono","PT Mono","Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#050A14}
body{font-family:var(--ff);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:default}
:focus-visible{outline:3px solid #FBBF24;outline-offset:2px}
.hidden{display:none!important}
.muted{color:var(--muted)}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:var(--bg);font-size:22pt;line-height:1.2}

/* шапка */
#top{position:absolute;left:0;right:0;top:0;height:54px;background:var(--bar);color:#E5E7EB;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:2px solid #1F2937}
#top .logo{font-family:var(--mono);font-weight:700;color:#0B1220;background:var(--acc);border-radius:8px;padding:0 8px;height:42px;display:flex;align-items:center}
#top .ttl{font-weight:700;white-space:nowrap;color:#fff}
#top .chips{display:flex;gap:4px;margin-left:6px}
#top .chips button{border:2px solid #374151;background:#1F2937;color:#D1D5DB;min-width:44px;height:42px;border-radius:8px;padding:0 8px;font-weight:700}
#top .chips button.on{background:#fff;color:#0B1220;border-color:#fff}
#top .chips button.done{border-color:var(--acc);color:#86EFAC}
#top .chips button.on.done{color:var(--acc2)}
#top .chips button:disabled{opacity:.4}
#top .sp{flex:1}
#top .pill{padding:0 12px;height:42px;display:flex;align-items:center;border-radius:8px;background:#1F2937;font-weight:700;white-space:nowrap}
#top .clock{font-family:var(--mono);background:#1E3A8A;color:#fff}
#top .clock.warn{background:#A16207}#top .clock.crit{background:#B91C1C}
#top .ib{border:0;background:#1F2937;color:#fff;width:44px;height:42px;border-radius:8px}

/* основная область */
#main{position:absolute;left:0;right:0;top:54px;bottom:0;display:flex;gap:8px;padding:8px}
#mis{width:500px;flex:none;background:var(--panel);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
#main.wide #mis{display:none}
#right{flex:1;min-width:0;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;background:#0C0C0C;position:relative}
.mh{flex:none;padding:6px 14px;background:#E2E8F0;border-bottom:3px solid var(--acc2)}
.mh .mn{color:var(--muted);display:block;line-height:1.1}
.mh b{display:block;line-height:1.15}
.mh .row{display:flex;align-items:center;gap:8px}
.mh .row b{flex:1;min-width:0}
.badge{padding:0 10px;border-radius:8px;font-weight:700;white-space:nowrap;background:#fff;border:2px solid var(--line)}
.badge.ok{background:var(--ok-soft);border-color:#86EFAC;color:var(--ok)}
.mb{flex:1;min-height:0;overflow:auto;padding:8px 12px}
.mf{flex:none;display:flex;gap:8px;padding:6px 10px;border-top:2px solid var(--line);background:#EEF2F7}
.mf .sp{flex:1}
.step{border:2px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.step>button.sh{display:flex;align-items:flex-start;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:4px 10px;line-height:1.2}
.step .ic{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid #94A3B8;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:2px}
.step.done{border-color:#86EFAC;background:#F0FDF4}
.step.done .ic{background:var(--acc2);border-color:var(--acc2);color:#fff}
.step.cur{border-color:var(--blue);box-shadow:0 0 0 3px #BFDBFE}
.step.cur .ic{border-color:var(--blue);color:var(--blue)}
.step .stt{flex:1;min-width:0;font-weight:700}
.step .pts{flex:none;color:var(--muted);white-space:nowrap}
.step .sd{padding:0 10px 8px}
.step .sd p{margin:0 0 6px}
pre.code{margin:4px 0 6px;background:#0F172A;color:#E2E8F0;border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:22pt;line-height:1.15;white-space:pre-wrap;word-break:break-word;position:relative}
pre.code .cm{color:#94A3B8}
.zoom{border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;padding:0 10px;font-weight:700}
.why{background:var(--amber-soft);border-left:6px solid var(--amber);border-radius:6px;padding:4px 10px;margin:4px 0}
.okmsg{background:var(--ok-soft);border-left:6px solid var(--acc2);border-radius:6px;padding:4px 10px;margin:4px 0}
.btn{border:2px solid var(--acc2);background:var(--acc2);color:#fff;border-radius:8px;padding:0 14px;font-weight:700;white-space:nowrap;height:42px}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.o{background:#fff;color:var(--acc2)}
.btn.b{background:var(--blue);border-color:var(--blue)}
.btn.r{background:var(--bad);border-color:var(--bad)}
.btn.g{background:#fff;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4}

/* терминал */
.ttabs{flex:none;display:flex;align-items:flex-end;gap:4px;background:#1F2937;padding:6px 8px 0}
.ttabs button.tb{border:0;border-radius:10px 10px 0 0;padding:2px 16px 4px;background:#374151;color:#D1D5DB;display:flex;align-items:center;gap:8px;white-space:nowrap}
.ttabs button.tb.on{background:#0C0C0C;color:#fff;font-weight:700}
.ttabs button.tb.ps.on{background:#012456}
.ttabs button.tb.sh.on{background:#300A24}
.ttabs .ti{width:24px;height:20px;border-radius:3px;border:2px solid #9CA3AF;background:#0C0C0C}
.ttabs .ps .ti{background:#012456;border-color:#60A5FA}
.ttabs .sh .ti{background:#300A24;border-color:#E95420}
.ttabs .sp{flex:1}
.ttabs .ib{border:0;background:#374151;color:#fff;border-radius:8px;height:40px;padding:0 12px;margin-bottom:5px;white-space:nowrap}
.term{flex:1;min-height:0;display:flex;flex-direction:column;background:#0C0C0C;color:#CCCCCC;font-family:var(--mono);font-size:22pt;line-height:1.18;cursor:text}
.term.ps{background:#012456;color:#EEEDF0}
.term.sh{background:#300A24;color:#FFFFFF}
.tout{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 10px 0}
.tout div{white-space:pre-wrap;word-break:break-all;min-height:1.18em}
.tin{flex:none;display:flex;align-items:flex-start;padding:0 10px 8px}
.tin .pr{white-space:pre-wrap;word-break:break-all;max-width:60%}
.tin input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:var(--mono);font-size:22pt;padding:0;line-height:1.18;caret-color:#FBBF24}
.c-g{color:#16C60C}.term.sh .c-g{color:#8AE234}.c-b{color:#729FCF}
.c-y{color:#F9F1A5}.c-r{color:#FF7B72}.c-m{color:#9CA3AF}
.term.ps .c-r{color:#FF8A80;background:#000;}
.c-cmd{color:#FBBF24}

/* редактор */
.ed{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;background:#fff;z-index:5}
.ed .eh{flex:none;display:flex;align-items:center;gap:10px;background:#F3F3F3;border-bottom:2px solid #D5DCE3;padding:2px 10px;white-space:nowrap}
.ed .eh .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ed .em{flex:none;padding:0 10px;border-bottom:2px solid #E3E9EF;color:#334155;white-space:nowrap}
.ed textarea{flex:1;min-height:0;resize:none;border:0;outline:0;padding:6px 10px;font-family:var(--mono);font-size:22pt;line-height:1.18;white-space:pre-wrap;color:#111}
.ed .ef{flex:none;display:flex;align-items:center;gap:8px;padding:4px 8px;background:#F3F3F3;border-top:2px solid #D5DCE3}
.ed .ef .st{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed.nano{background:#300A24}
.ed.nano .eh{background:#D3D7CF;color:#300A24;justify-content:center;font-family:var(--mono)}
.ed.nano .em{display:none}
.ed.nano textarea{background:#300A24;color:#fff;caret-color:#FBBF24}
.ed.nano .ef{background:#300A24;border-top:0;color:#fff;font-family:var(--mono)}
.ed.nano .ef .st{color:#D3D7CF}
.ed.nano .ef button{background:#D3D7CF;color:#300A24;border:0;border-radius:4px;padding:0 10px;font-family:var(--mono);height:40px}

/* панели: вопросы, итоги */
.pane{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;z-index:4}
.pane .ph{flex:none;padding:6px 16px;border-bottom:3px solid var(--acc2);display:flex;align-items:center;gap:10px;background:#F1F5F9}
.pane .ph b{flex:1}
.pane .pb{flex:1;min-height:0;overflow:auto;padding:10px 16px}
.pane .pf{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:2px solid var(--line);background:#F1F5F9}
.pane .pf .st{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.nums button{min-width:50px;height:42px;border:2px solid #94A3B8;background:#fff;border-radius:8px;font-weight:700}
.nums button.ans{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.nums button.cur{outline:3px solid var(--amber);outline-offset:1px}
.nums button.ok{background:var(--ok);border-color:var(--ok);color:#fff}.nums button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.qtxt{font-weight:700;font-size:24pt;margin-bottom:8px;line-height:1.2}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;border:2px solid #94A3B8;background:#fff;border-radius:10px;padding:4px 14px;line-height:1.2}
.opt.on{border-color:var(--blue);background:var(--blue-soft);font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through}
.opt code,.qtxt code{font-family:var(--mono);background:#F1F5F9;border-radius:4px;padding:0 4px}
.res{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}
.grade{width:110px;height:110px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:60pt;font-weight:800;color:#fff}
.g5{background:#15803D}.g4{background:#0F766E}.g3{background:#A16207}.g2{background:#B91C1C}
.big{font-size:44pt;font-weight:800;line-height:1}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:390px minmax(0,1fr) 90px;gap:10px;align-items:center}
.bar .tr{height:24px;background:#E2E8F0;border-radius:8px;overflow:hidden}
.bar .tr i{display:block;height:100%;width:0;border-radius:8px}
.bar .v{text-align:right;font-weight:700}
table.tb{border-collapse:collapse;width:100%}
.tb th,.tb td{border:2px solid var(--line);padding:1px 8px;text-align:left;vertical-align:middle}
.tb th{background:#F1F5F9}.tb td.c,.tb th.c{text-align:center}
.lv{font-weight:700}.lv.l4{color:var(--ok)}.lv.l3{color:#0F766E}.lv.l2{color:var(--amber)}.lv.l1{color:var(--bad)}
.tabs2{display:flex;gap:6px;margin-bottom:8px}
.tabs2 button{border:2px solid var(--line);background:#fff;border-radius:8px;padding:0 14px;font-weight:700}
.tabs2 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* диалоги */
#dlg{position:absolute;inset:0;background:rgba(5,10,20,.66);display:flex;align-items:center;justify-content:center;z-index:50}
.dbox{background:#fff;border-radius:14px;min-width:560px;max-width:1220px;max-height:690px;overflow:auto;padding:12px 20px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.dbox h3{margin:0 0 8px;font-size:26pt}
.dbox p{margin:0 0 8px}
.dbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;flex-wrap:wrap}
.dbox input[type=text]{width:100%;height:46px;border:2px solid #94A3B8;border-radius:8px;padding:0 10px;font-size:22pt}
.dbox textarea{width:1160px;height:440px;font-family:var(--mono);font-size:22pt;border:2px solid var(--line);border-radius:8px;padding:8px}
.dbox pre.code{font-size:22pt;max-height:520px;overflow:auto}
.intro{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;width:1160px}
.intro ul{margin:0 0 8px;padding-left:1.2em}
#toast{position:absolute;left:8px;bottom:8px;width:500px;background:#14532D;color:#fff;padding:6px 20px;border-radius:12px;z-index:70;max-width:1000px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);border:2px solid var(--acc)}
#toast.bad{background:#7F1D1D;border-color:#F87171}
#printArea{display:none}
@media print{body{overflow:visible;background:#fff}#stage{display:none}#printArea{display:block}}
</style>
</head>
<body>
<div id="stage">
  <div id="top"></div>
  <div id="main">
    <div id="mis"></div>
    <div id="right">
      <div class="ttabs" id="ttabs"></div>
      <div class="term" id="term"><div class="tout" id="tout"></div><div class="tin"><span class="pr" id="tpr"></span><input id="tin" type="text" autocomplete="off" spellcheck="false" aria-label="Командная строка"></div></div>
      <div class="ed hidden" id="ed"></div>
      <div class="pane hidden" id="pane"></div>
    </div>
  </div>
  <div id="dlg" class="hidden"></div>
  <div id="toast" class="hidden"></div>
</div>
<div id="printArea"></div>
<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pad=n=>String(n).padStart(2,'0');
const r2=x=>Math.round(x*100)/100;
const fmt=x=>String(r2(x)).replace('.',',');
const NOW=()=>new Date();
const DAY=864e5;
const dRu=d=>`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const tRu=d=>`${String(d.getHours()).padStart(2,' ')}:${pad(d.getMinutes())}:${pad(d.getSeconds())},${pad(Math.floor(d.getMilliseconds()/10))}`;
const dInv=d=>`${pad(d.getMonth()+1)}/${pad(d.getDate())}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const wild=(p,ci)=>new RegExp('^'+p.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$',ci?'i':'');

/* ======================= ВИРТУАЛЬНЫЕ ФАЙЛОВЫЕ СИСТЕМЫ ======================= */
class FS{
 constructor(win){this.win=win;this.root={t:'d',n:'',c:{},m:NOW()}}
 key(n){return this.win?n.toLowerCase():n}
 split(abs){return this.win?abs.replace(/^[A-Za-z]:/,'').split('\\').filter(Boolean):abs.split('/').filter(Boolean)}
 join(parts){return this.win?'C:\\'+parts.join('\\'):'/'+parts.join('/')}
 norm(cwd,p){
  p=String(p??'');
  if(this.win){p=p.replace(/\//g,'\\');let base;
   if(/^[A-Za-z]:/.test(p)){base=[];p=p.replace(/^[A-Za-z]:\\?/,'')}else if(p.startsWith('\\')){base=[];p=p.slice(1)}else base=this.split(cwd);
   for(const s of p.split('\\')){if(!s||s==='.')continue;if(s==='..'){base.pop();continue}base.push(s)}
   return this.join(this.fix(base))}
  if(p==='~'||p.startsWith('~/'))p='/home/student'+p.slice(1);
  let base=p.startsWith('/')?[]:this.split(cwd);
  for(const s of p.split('/')){if(!s||s==='.')continue;if(s==='..'){base.pop();continue}base.push(s)}
  return this.join(base)}
 fix(parts){let n=this.root;return parts.map(s=>{const c=n&&n.c&&n.c[this.key(s)];if(c){n=c;return c.n}n=null;return s})}
 get(abs){let n=this.root;for(const s of this.split(abs)){if(!n||n.t!=='d')return null;n=n.c[this.key(s)]}return n||null}
 isDir(abs){const n=this.get(abs);return !!n&&n.t==='d'}
 isFile(abs){const n=this.get(abs);return !!n&&n.t==='f'}
 parent(abs){const ps=this.split(abs);const name=ps.pop()||'';return [this.join(ps),name]}
 mkdir(abs,p){let n=this.root;const ps=this.split(abs);for(let i=0;i<ps.length;i++){const k=this.key(ps[i]);let c=n.c[k];if(!c){if(!p&&i<ps.length-1)return 'noparent';c=n.c[k]={t:'d',n:ps[i],c:{},m:NOW()}}else if(c.t!=='d')return 'file';n=c}return 'ok'}
 write(abs,content,append){const [d,name]=this.parent(abs);const dn=this.get(d);if(!dn||dn.t!=='d'||!name)return false;const k=this.key(name);let f=dn.c[k];if(f&&f.t==='d')return false;
  if(!f)f=dn.c[k]={t:'f',n:name,s:'',m:NOW(),mode:this.win?'':'rw-r--r--'};f.s=append?f.s+content:content;f.m=NOW();delete f.sz;return true}
 read(abs){const f=this.get(abs);return f&&f.t==='f'?f.s:null}
 rm(abs){const [d,name]=this.parent(abs);const dn=this.get(d);if(!dn)return false;const k=this.key(name);if(!dn.c[k])return false;delete dn.c[k];return true}
 list(abs){const n=this.get(abs);return n&&n.t==='d'?Object.values(n.c).sort((a,b)=>a.n.localeCompare(b.n)):null}
 size(f){return f.sz!=null?f.sz:new Blob([f.s]).size}
 glob(cwd,pat){const abs=this.norm(cwd,pat);const [d,name]=this.parent(abs);if(!/[*?]/.test(name))return this.get(abs)?[abs]:[];
  const re=wild(name,this.win);return (this.list(d)||[]).filter(x=>x.t==='f'&&re.test(x.n)&&(this.win||!x.n.startsWith('.')||name.startsWith('.'))).map(x=>this.join([...this.split(d),x.n]))}
 lines(abs){const s=this.read(abs);return s==null?[]:s.split(/\r?\n/).filter(x=>x.trim())}
}
let W,L;
function seedFS(){
 const t=Date.now();
 W=new FS(true);
 ['C:\\Windows\\System32','C:\\Users\\student\\Documents','C:\\Users\\student\\Desktop','C:\\Program Files','C:\\Data','C:\\Temp'].forEach(p=>W.mkdir(p,true));
 const wf=(p,s,ago,sz)=>{W.write(p,s);const f=W.get(p);f.m=new Date(t-ago);if(sz)f.sz=sz};
 wf('C:\\Data\\report1.txt','Отчёт за неделю 1\r\nЗаявок закрыто: 42\r\n',DAY+3e6);
 wf('C:\\Data\\report2.txt','Отчёт за неделю 2\r\nЗаявок закрыто: 37\r\n',DAY+2e6);
 wf('C:\\Data\\notes.txt','Заменить патч-корд в серверной 2.\r\n',DAY+1e6);
 wf('C:\\Data\\budget.xlsx','',2*DAY,18432);
 wf('C:\\Data\\photo.jpg','',3*DAY,524288);
 TEMP0.forEach(([n,ago,sz])=>wf('C:\\Temp\\'+n,'',ago,sz));
 L=new FS(false);
 ['/etc','/var/log','/tmp','/home/student/data'].forEach(p=>L.mkdir(p,true));
 const lf=(p,s,ago,sz)=>{L.write(p,s);const f=L.get(p);f.m=new Date(t-ago);if(sz)f.sz=sz};
 lf('/home/student/.bashrc','# ~/.bashrc\n',30*DAY);
 lf('/home/student/data/report.txt','Report: 42 tickets closed\n',DAY);
 lf('/home/student/data/notes.txt','Check UPS in server room\n',DAY);
 lf('/home/student/data/image.png','',2*DAY,204800);
 lf('/etc/hostname','srv\n',90*DAY);
}

function shStatements(src){const st=[];src.split('\n').forEach((raw,i)=>{let l=raw.replace(/\r$/,'');if(/^\s*#/.test(l))return;
 /* убрать комментарий вне кавычек */let q=null,cut=l.length;for(let k=0;k<l.length;k++){const c=l[k];if(q){if(c===q)q=null;continue}if(c==='"'||c==="'"){q=c;continue}if(c==='#'&&(k===0||/\s/.test(l[k-1]))){cut=k;break}}l=l.slice(0,cut);
 splitTop(l,';','"\'').forEach(s=>{s=s.trim();if(!s)return;let m;
  if((m=s.match(/^(then|do|else)\s+(.+)$/))){st.push({k:m[1],line:i+1});st.push({k:'cmd',c:m[2],line:i+1});return}
  st.push({k:/^(if|elif)\s/.test(s)?s.split(/\s/)[0]:/^(then|else|fi|do|done)$/.test(s)?s:/^for\s/.test(s)?'for':/^while\s/.test(s)?'while':'cmd',c:s,line:i+1})})});return st}
function shParse(st){let i=0;const block=(ends)=>{const out=[];while(i<st.length){const s=st[i];if(ends.includes(s.k))return out;i++;
  if(s.k==='if'){const node={t:'if',branches:[],els:null,line:s.line};let cond=s.c.replace(/^if\s+/,'');if(st[i]&&st[i].k==='then')i++;else throw {line:s.line,msg:'ожидается «then»'};
   node.branches.push({cond,body:block(['elif','else','fi'])});while(st[i]&&st[i].k==='elif'){const c=st[i].c.replace(/^elif\s+/,'');i++;if(st[i]&&st[i].k==='then')i++;node.branches.push({cond:c,body:block(['elif','else','fi'])})}
   if(st[i]&&st[i].k==='else'){i++;node.els=block(['fi'])}if(!st[i]||st[i].k!=='fi')throw {line:s.line,msg:'синтаксическая ошибка: неожиданный конец файла (нет «fi»)'};i++;out.push(node);continue}
  if(s.k==='for'){const m=s.c.match(/^for\s+(\w+)\s+in\s+(.*)$/);if(!m)throw {line:s.line,msg:'синтаксическая ошибка в for'};if(st[i]&&st[i].k==='do')i++;else throw {line:s.line,msg:'ожидается «do»'};const body=block(['done']);if(!st[i])throw {line:s.line,msg:'нет «done»'};i++;out.push({t:'for',v:m[1],list:m[2],body});continue}
  if(['then','fi','do','done','else','elif'].includes(s.k))throw {line:s.line,msg:`синтаксическая ошибка рядом с неожиданным маркером «${s.k}»`};
  out.push({t:'cmd',c:s.c,line:s.line})}return out};const r=block([]);if(i<st.length)throw {line:st[i].line,msg:`синтаксическая ошибка рядом с неожиданным маркером «${st[i].k}»`};return r}
function runSh(p,o,ctx){const f=L.get(p);S.runs.sh++;ev('sh.run:'+p);const vars=Object.assign({},SH.sh.vars);let ast;
 if(/\r/.test(f.s)){}
 try{ast=shParse(shStatements(f.s))}catch(e){o.push([`${p.replace('/home/student/','./')}: строка ${e.line}: ${e.msg}`,'']);S.runs.err++;ev('sh.syntax');return 2}
 const keep=SH.sh.cwd;let errs=0;const c2={script:true};
 const exec=(nodes)=>{for(const nd of nodes){if(nd.t==='cmd'){const c=bLine(nd.c,o,vars,c2);if(c&&!/^(\[|test)\s/.test(nd.c.trim()))errs++}
  else if(nd.t==='if'){let done=false;for(const b of nd.branches){if(bLine(b.cond,[],vars,c2)===0){exec(b.body);done=true;break}}if(!done&&nd.els)exec(nd.els)}
  else if(nd.t==='for'){const items=bWords(bTok(nd.list),vars).map(x=>x.s);items.forEach(v=>{vars[nd.v]=v;exec(nd.body)})}}};
 exec(ast);SH.sh.cwd=keep;if(errs)S.runs.err++;return errs?1:0}

let ED=null;
function openEditor(kind,path){
 if(kind==='np'){if(!path){toast('Укажите имя файла: notepad C:\\Scripts\\имя.bat',1);return}
  if(!W.isDir(W.parent(path)[0])){out('cmd','Блокнот: не удается найти путь '+W.parent(path)[0],'c-r');dialog('Блокнот',`<p>Не удаётся найти папку <b>${esc(W.parent(path)[0])}</b>.</p><p>Сначала создайте её командой <b>mkdir</b>.</p>`,[{t:'OK'}]);return}
  const exist=W.isFile(path);if(!exist){dialog('Блокнот',`<p>Не удаётся найти файл <b>${esc(path)}</b>.</p><p>Создать новый файл?</p>`,[{t:'Нет',cls:'g'},{t:'Да',fn:()=>{W.write(path,'');showEditor('np',path)}}]);return}
  showEditor('np',path);return}
 if(kind==='nano'){if(!path){toast('Укажите имя файла: nano backup.sh',1);return}if(!L.isDir(L.parent(path)[0])){toast('Нет такого каталога',1);return}showEditor('nano',path);return}
 if(kind==='cron'){showEditor('cron',null)}}
const CRON_HDR='# Изменение задач cron пользователя student\n# Формат: минута час день месяц день_недели команда\n# Пример: 30 18 * * 5 /home/student/report.sh\n';
function showEditor(kind,path){const fs=kind==='np'?W:L;const text=kind==='cron'?(S.cron||CRON_HDR):(fs.read(path)||'');
 ED={kind,path,orig:text,fs};const e=$('#ed');e.className='ed'+(kind==='np'?'':' nano');
 const nm=kind==='cron'?'/tmp/crontab.student':path;
 e.innerHTML=kind==='np'?`<div class="eh"><span class="nm" id="edn">${esc(W.parent(path)[1])} — Блокнот</span><button class="btn g" data-a="edwide" title="Шире">⇔</button></div><div class="em">Файл  Правка  Формат  Вид  Справка</div><textarea id="eta" spellcheck="false" wrap="soft"></textarea><div class="ef"><span class="st" id="eds">Ctrl+S — сохранить</span><button class="btn" data-a="edsave">Сохранить</button><button class="btn g" data-a="edclose">Закрыть</button></div>`
 :`<div class="eh"><span class="nm" id="edn">GNU nano 7.2   ${esc(nm.replace('/home/student/',''))}</span><button class="btn g" data-a="edwide" title="Шире">⇔</button></div><textarea id="eta" spellcheck="false" wrap="soft"></textarea><div class="ef"><span class="st" id="eds"></span><button data-a="edsave">^O Записать</button><button data-a="edclose">^X Выход</button></div>`;
 const ta=$('#eta');ta.value=text.replace(/\r\n/g,'\n');e.classList.remove('hidden');ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
 ta.addEventListener('input',()=>{const mod=ta.value!==ED.orig.replace(/\r\n/g,'\n');$('#edn').textContent=kind==='np'?(mod?'*':'')+W.parent(path)[1]+' — Блокнот':'GNU nano 7.2   '+nm.replace('/home/student/','')+(mod?'   Изменён':'')});
 ta.addEventListener('keydown',ev2=>{if(ev2.key==='Tab'){ev2.preventDefault();const s=ta.selectionStart;ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=s+2}
  if((ev2.ctrlKey||ev2.metaKey)&&(ev2.key==='s'||ev2.key==='ы'||ev2.key==='o'||ev2.key==='щ')){ev2.preventDefault();edSave()}
  if(ev2.ctrlKey&&(ev2.key==='x'||ev2.key==='ч')&&kind!=='np'){ev2.preventDefault();edClose()}})}
function edSave(){if(!ED)return;const ta=$('#eta');let v=ta.value;
 if(ED.kind==='cron'){const bad=v.split('\n').map((l,i)=>[l.trim(),i+1]).filter(([l])=>l&&!l.startsWith('#')&&!/^\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+/.test(l));
  if(bad.length){$('#eds').textContent=`Ошибка в строке ${bad[0][1]}: нужно 5 полей времени и команда`;ev('sh.cronErr');toast('crontab: ошибка в строке '+bad[0][1],1);return false}
  const fl=v.split('\n').filter(l=>l.trim()&&!l.trim().startsWith('#'));for(const l of fl){const f=l.trim().split(/\s+/);const ok=[[0,59],[0,23],[1,31],[1,12],[0,7]].every((r,i)=>f[i]==='*'||/^\*\/\d+$/.test(f[i])||f[i].split(',').every(x=>/^\d+(-\d+)?$/.test(x)&&x.split('-').every(y=>+y>=r[0]&&+y<=r[1])));if(!ok){$('#eds').textContent='Ошибка: неверное значение поля времени';toast('crontab: неверное значение времени',1);return false}}
  S.cron=v.endsWith('\n')?v:v+'\n';ED.orig=v;out('sh','crontab: installing new crontab','');ev('sh.cronSaved');$('#eds').textContent='Сохранено';$('#edn').textContent='GNU nano 7.2   /tmp/crontab.student';check();renderTerm();return true}
 if(ED.kind==='np')v=v.replace(/\r?\n/g,'\r\n');ED.fs.write(ED.path,v);ED.orig=v;$('#eds').textContent=ED.kind==='np'?'Сохранено: '+ED.path:'[ Записано строк: '+v.split('\n').filter((x,i,arr)=>i<arr.length-1||x).length+' ]';
 $('#edn').textContent=ED.kind==='np'?W.parent(ED.path)[1]+' — Блокнот':'GNU nano 7.2   '+ED.path.replace('/home/student/','');ev('ed.save:'+ED.path.toLowerCase());check();renderMis();return true}
function edClose(force){if(!ED)return;const ta=$('#eta');const mod=ta&&ta.value!==ED.orig.replace(/\r\n/g,'\n');
 if(mod&&!force){dialog(ED.kind==='np'?'Блокнот':'nano',`<p>Сохранить изменения${ED.path?' в файле <b>'+esc(ED.path)+'</b>':''}?</p>`,[{t:'Отмена',cls:'g'},{t:'Не сохранять',cls:'g',fn:()=>edClose(true)},{t:'Сохранить',fn:()=>{if(edSave()!==false)edClose(true)}}]);return}
 $('#ed').classList.add('hidden');$('#ed').innerHTML='';ED=null;focusIn()}

function misScore(m){if(m.id===7)return S.quiz.done?QUIZ.filter((q,i)=>S.quiz.a[i]===q[2]).length:0;return m.steps.reduce((s,x)=>s+(S.done[x.id]?x.p:0),0)}

 if(gained.length){toast(gained.map(s=>`+${s.p} б. — ${s.t}`).join(' · '));renderTop();renderMis()}}

/* ---------- ввод команд ---------- */
function exec(sh,line){const s=SH[sh];if(!S.t0){toast('Сначала зарегистрируйтесь',1);return}
 if(S.fin){out(sh,prompt(sh)+line);out(sh,'Работа сдана — команды не выполняются.','c-y');renderTerm();return}
 const pr=prompt(sh);out(sh,pr+line,'');if(line.trim()&&!s.pending){s.hist.push(line);s.hp=s.hist.length;S.cmds++;S.hist.push([sh,line,new Date()]);if(S.hist.length>300)S.hist.shift()}
 let code=0;
 if(sh==='cmd'){const o=[];code=cmdLine(cmdExpand(line,false),{batch:false,o,depth:0});o.forEach(x=>out('cmd',x[0],x[1]));if(code)S.errs.cmd++;if(line.trim())out('cmd','')}
 else if(sh==='ps'){const o=[];code=psLine(line,o);o.forEach(x=>out('ps',x[0],x[1]))}
 else{const o=[];code=shRunLine(line,o);o.forEach(x=>out('sh',x[0],x[1]));if(code&&line.trim())S.errs.sh++}
 check();renderTerm();renderMis();renderTop()}
function shRunLine(line,o){const t=line.trim();if(!t)return 0;let code=0;
 if(/^(if|for|while)\s/.test(t)){try{const ast=shParse(shStatements(t));const vars=SH.sh.vars;const ex=(nodes)=>{for(const nd of nodes){if(nd.t==='cmd')code=bLine(nd.c,o,vars,{});else if(nd.t==='if'){let done=false;for(const b of nd.branches){if(bLine(b.cond,[],vars,{})===0){ex(b.body);done=true;break}}if(!done&&nd.els)ex(nd.els)}else if(nd.t==='for'){bWords(bTok(nd.list),vars).map(x=>x.s).forEach(v=>{vars[nd.v]=v;ex(nd.body)})}}};ex(ast)}catch(e){o.push(['bash: '+e.msg,''])}return code}
 splitTop(t,';','"\'').forEach(seg=>{if(!seg.trim())return;const parts=seg.split(/\s*&&\s*/);for(const p of parts){code=bLine(p,o,SH.sh.vars,{});if(code)break}});return code}
const tin=$('#tin');
tin.addEventListener('keydown',e=>{const sh=S.tab,s=SH[sh];
 if(e.key==='Enter'){e.preventDefault();const v=tin.value;tin.value='';exec(sh,v);return}
 if(e.key==='ArrowUp'){e.preventDefault();if(s.hp>0){s.hp--;tin.value=s.hist[s.hp]||''}return}
 if(e.key==='ArrowDown'){e.preventDefault();if(s.hp<s.hist.length){s.hp++;tin.value=s.hist[s.hp]||''}return}
 if(e.key==='Tab'){e.preventDefault();complete();return}
 if(e.key==='l'&&e.ctrlKey){e.preventDefault();SH[sh].out=[];renderTerm()}});
function complete(){const v=tin.value;const m=v.match(/(^|\s)(\S*)$/);if(!m)return;const part=m[2].replace(/^["']/,'');const sh=S.tab;const fs=sh==='sh'?L:W;const sep=sh==='sh'?'/':'\\';
 const idx=Math.max(part.lastIndexOf('\\'),part.lastIndexOf('/'));const dirPart=idx>=0?part.slice(0,idx+1):'';const base=idx>=0?part.slice(idx+1):part;
 const dir=fs.norm(SH[sh].cwd,dirPart||'.');const items=(fs.list(dir)||[]).filter(x=>x.n.toLowerCase().startsWith(base.toLowerCase()));
 if(items.length===1){let rep=dirPart+items[0].n+(items[0].t==='d'?sep:'');if(sh==='ps'&&!dirPart&&items[0].t==='f'&&/\.ps1$/i.test(items[0].n)&&m.index===0&&!m[1])rep='.\\'+rep;tin.value=v.slice(0,v.length-m[2].length)+rep}
 else if(items.length>1){out(sh,prompt(sh)+v);out(sh,items.map(x=>x.n).join('  '),'c-m');renderTerm()}}

 else if(S.rtab===1){const weak=A.rows.filter(r=>r.p<70);body=`<table class="tb"><tr><th>Миссия</th><th class="c">%</th><th>Уровень</th></tr>${A.rows.map(r=>`<tr><td>${r.m.id}. ${esc(COMP[r.m.id])}</td><td class="c">${r.p}</td><td><span class="lv ${r.lv[1]}">${r.lv[0]}</span></td></tr>`).join('')}</table>

 else body=`<table class="tb"><tr><th>Показатель</th><th class="c">Значение</th></tr><tr><td>Введено команд</td><td class="c">${S.cmds}</td></tr><tr><td>Команды с ошибкой (CMD / PS / Bash)</td><td class="c">${S.errs.cmd} / ${S.errs.ps} / ${S.errs.sh}</td></tr><tr><td>Запусков сценариев (bat / ps1 / sh)</td><td class="c">${S.runs.bat} / ${S.runs.ps} / ${S.runs.sh}</td></tr><tr><td>Запусков с ошибкой</td><td class="c">${S.runs.err}</td></tr><tr><td>Шагов выполнено</td><td class="c">${Object.keys(S.done).length} из ${MIS.reduce((s,m)=>s+m.steps.length,0)}</td></tr></table><p class="muted" style="margin-top:8px">Невыполненные шаги и подсказки — в отчёте.</p>`;
 return `<div class="ph"><b>Итоги и анализ</b>${S.fin?'<span class="badge ok">работа сдана</span>':''}</div><div class="pb">${tabs}${body}</div><div class="pf"><span class="st">${S.fin?'Сохраните отчёт.':'Несданные вопросы — 0 баллов.'}</span><button class="btn g" data-a="mis" data-v="7">◀ Вопросы</button>${S.fin?'':'<button class="btn r" data-a="finish">Сдать работу</button>'}<button class="btn" data-a="report">Отчёт</button><button class="btn o" data-a="print">Печать</button></div>`}

/* ======================= ОТЧЁТ ======================= */
const FILES=[['C:\\Scripts\\automate.bat',W],['C:\\Scripts\\cleanup.ps1',W],['C:\\Scripts\\disk_monitor.ps1',W],['/home/student/backup.sh',L]];
function scripts(){return [['C:\\Scripts\\automate.bat','w'],['C:\\Scripts\\cleanup.ps1','w'],['C:\\Scripts\\disk_monitor.ps1','w'],['/home/student/backup.sh','l']].map(([p,k])=>[p,(k==='w'?W:L).read(p)]).concat([['crontab (student)',S.cron||null]])}
function reportHTML(){const T=total(),[g,gt]=grade(T),A=analysis(),dt=new Date().toLocaleString('ru-RU');const weak=A.rows.filter(r=>r.p<70);
 return `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Отчёт — ${esc(S.name||'студент')}</title><style>
body{font-family:"Times New Roman",serif;font-size:14pt;color:#000;max-width:190mm;margin:10mm auto;line-height:1.35}h1{font-size:18pt;text-align:center;margin:0 0 4mm}h2{font-size:15pt;margin:6mm 0 2mm}
table{border-collapse:collapse;width:100%;font-size:12pt}th,td{border:1px solid #000;padding:2px 6px;vertical-align:top;text-align:left}th{background:#eee}
pre{font-family:Consolas,"Courier New",monospace;font-size:11pt;background:#f4f4f4;border:1px solid #999;padding:4px 8px;white-space:pre-wrap}
.ok{color:#15803d;font-weight:bold}.no{color:#b91c1c;font-weight:bold}.sig{margin-top:12mm;display:flex;justify-content:space-between}.small{font-size:11pt}
</style></head><body>
<h1>Отчёт о выполнении практической работы</h1>
<p><b>Тема:</b> Автоматизация работы в ОС: командные файлы и сценарии Windows (bat, PowerShell) и Linux (Bash)<br><b>Студент:</b> ${esc(S.name||'—')} &nbsp; <b>Группа:</b> ${esc(S.group||'—')}<br><b>Дата:</b> ${dt} &nbsp; <b>Время работы:</b> ${used()} из 90 мин &nbsp; <b>Статус:</b> ${S.fin?'работа сдана':'промежуточный отчёт'}</p>
<h2>1. Результаты по миссиям</h2><table><tr><th>№</th><th>Миссия</th><th>Баллы</th><th>%</th><th>Уровень</th></tr>${A.rows.map(r=>`<tr><td>${r.m.id}</td><td>${esc(r.m.t)}</td><td>${r.v} / ${r.mx}</td><td>${r.p}</td><td>${r.lv[0]}</td></tr>`).join('')}<tr><th></th><th>Итого</th><th>${T} / 100</th><th colspan="2">Оценка: ${g} (${gt})</th></tr></table>
<h2>2. Выполнение шагов</h2><table><tr><th>Шаг</th><th>Содержание</th><th>Баллы</th><th></th></tr>${MIS.flatMap(m=>m.steps.map(s=>`<tr><td>${s.id}</td><td>${esc(s.t)}${!S.done[s.id]&&s.why&&s.why()?`<br><i class="small">${esc(s.why())}</i>`:''}</td><td>${S.done[s.id]?s.p:0} / ${s.p}</td><td class="${S.done[s.id]?'ok':'no'}">${S.done[s.id]?'✓':'✗'}</td></tr>`)).join('')}</table>
<h2>3. Контрольные вопросы</h2><table><tr><th>№</th><th>Вопрос</th><th>Ответ студента</th><th>Верный ответ</th><th></th></tr>${QUIZ.map((q,i)=>`<tr><td>${i+1}</td><td>${q[0]}</td><td>${S.quiz.a[i]!=null?q[1][S.quiz.a[i]]:'—'}</td><td>${q[1][q[2]]}</td><td class="${S.quiz.done&&S.quiz.a[i]===q[2]?'ok':'no'}">${S.quiz.done&&S.quiz.a[i]===q[2]?'✓':'✗'}</td></tr>`).join('')}</table>
<h2>4. Анализ</h2><p>Введено команд: ${S.cmds}; с ошибкой: CMD — ${S.errs.cmd}, PowerShell — ${S.errs.ps}, Bash — ${S.errs.sh}. Запусков сценариев: bat — ${S.runs.bat}, ps1 — ${S.runs.ps}, sh — ${S.runs.sh}; из них с ошибкой — ${S.runs.err}.</p>
${weak.length?'<p><b>Рекомендации:</b></p><ul>'+weak.map(r=>`<li><b>${esc(COMP[r.m.id])}:</b> ${esc(REC[r.m.id])}</li>`).join('')+'</ul>':'<p>Все миссии выполнены на уровне «достаточный» и выше.</p>'}
<h2>5. Сценарии студента</h2>${scripts().map(([p,c])=>`<p><b>${esc(p)}</b></p>${c?`<pre>${esc(c)}</pre>`:'<p class="small">— файл не создан —</p>'}`).join('')}
<h2>6. Журнал команд (последние ${Math.min(80,S.hist.length)})</h2><pre>${esc(S.hist.slice(-80).map(([sh,l,t])=>`${pad(t.getHours())}:${pad(t.getMinutes())} [${{cmd:'CMD',ps:'PS',sh:'Bash'}[sh]}] ${l}`).join('\n'))||'—'}</pre>
<div class="sig"><span>Студент: ____________ / ${esc(S.name||'')}</span><span>Преподаватель: ____________</span></div>
</body></html>`}
function reportTXT(){const T=total(),[g,gt]=grade(T),A=analysis();return `ОТЧЁТ О ВЫПОЛНЕНИИ ПРАКТИЧЕСКОЙ РАБОТЫ
Тема: Автоматизация работы в ОС: командные файлы и сценарии (bat, PowerShell, Bash)
Студент: ${S.name||'—'}   Группа: ${S.group||'—'}
Дата: ${new Date().toLocaleString('ru-RU')}   Время: ${used()} из 90 мин
Статус: ${S.fin?'работа сдана':'промежуточный отчёт'}

${A.rows.map(r=>`${r.m.id}. ${r.m.t}: ${r.v} / ${r.mx} (${r.p} %, ${r.lv[0]})`).join('\n')}
ИТОГО: ${T} / 100   ОЦЕНКА: ${g} (${gt})

Невыполненные шаги:
${A.miss.length?A.miss.map(x=>`- ${x.s.id} ${x.s.t}${x.why?' — '+x.why:''}`).join('\n'):'- нет'}

Статистика: команд ${S.cmds}; ошибок CMD/PS/Bash ${S.errs.cmd}/${S.errs.ps}/${S.errs.sh}; запусков bat/ps1/sh ${S.runs.bat}/${S.runs.ps}/${S.runs.sh}, с ошибкой ${S.runs.err}

${scripts().map(([p,c])=>`=== ${p} ===\n${c?c.replace(/\r\n/g,'\n'):'— файл не создан —'}`).join('\n\n')}
`}
function download(name,text,type){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:type+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Файл отчёта сохраняется…')}catch(e){toast('Скачивание недоступно — используйте «Копировать»',1)}}
const fname=ext=>`Отчёт_автоматизация_${(S.name||'студент').replace(/\s+/g,'_')}.${ext}`;
let REPORT='';
function copyRep(){const t=$('#rep');let ok=false;try{if(navigator.clipboard){navigator.clipboard.writeText(REPORT);ok=true}}catch(e){}if(!ok&&t){t.select();try{ok=document.execCommand('copy')}catch(e){}}toast(ok?'Отчёт скопирован':'Выделите текст и скопируйте вручную',!ok)}

/* ======================= ДЕЙСТВИЯ ======================= */
const ACT={
 mis(v){if(!S.t0)return;if(v==='res'){S.view='res';S.rtab=0}else{const n=+v;if(n<1||n>7)return;S.view=n;const m=MIS[n-1];if(m.sh&&S.tab!==m.sh){S.tab=m.sh}}if(ED&&S.view!=='res'&&S.view!==7){}else if(ED)edClose(true);S.open=null;render()},
 tab(v){S.tab=v;if(ED&&((v==='cmd'||v==='ps')!==(ED.kind==='np')))edClose(true);renderTabs();renderTerm();focusIn()},
 wide(){S.wide=!S.wide;renderTabs();$('#main').classList.toggle('wide',S.wide||S.view==='res');focusIn()},
 edwide(){ACT.wide()},
 stepopen(v){S.open=S.open===v?null:v;S.keepScroll=true;renderMis()},
 zoom(v){const [m,i]=v.split('.').map(Number);const s=MIS[m-1].steps[i-1];dialog(s.t,`<pre class="code">${esc(s.code2)}</pre>`,[{t:'Закрыть'}])},
 resetTemp(){resetTemp();(W.read('C:\\Scripts\\cleanup_log.txt')!=null)&&W.write('C:\\Scripts\\cleanup_log.txt','');delete S.ev['ps.cleanupRun'];toast('Папка C:\\Temp восстановлена, журнал очистки очищен');renderMis()},
 edsave(){edSave()},edclose(){edClose()},
 dlgb(v){const b=DLG[+v];closeDlg();b&&b.fn&&b.fn()},
 start(){const n=$('#fn').value.trim(),g=$('#fg').value.trim();if(!n||!g){toast('Введите фамилию, имя и группу',1);return}S.name=n;S.group=g;S.t0=Date.now();closeDlg();
  out('cmd','Microsoft Windows [Version 10.0.26100]');out('cmd','(c) Корпорация Майкрософт. Все права защищены.');out('cmd','');
  out('ps','Windows PowerShell');out('ps','(C) Корпорация Майкрософт. Все права защищены.');out('ps','');
  out('sh','Добро пожаловать на сервер srv (Ubuntu 24.04 LTS)');out('sh','Введите help — список команд.','c-m');out('sh','');render();toast('Работа начата. Удачи!')},
 full(){const el=document.documentElement;if(document.fullscreenElement){try{document.exitFullscreen()}catch(e){}return}const fail=()=>toast('Полный экран недоступен в этом окне',1);try{if(document.fullscreenEnabled&&el.requestFullscreen){const r=el.requestFullscreen();r&&r.catch&&r.catch(fail)}else fail()}catch(e){fail()}},
 qgo(v){S.quiz.cur=+v;renderRight()},
 qans(v){if(S.quiz.done||S.fin)return;S.quiz.a[S.quiz.cur]=+v;const nx=QUIZ.findIndex((q,i)=>S.quiz.a[i]==null);if(nx>=0)S.quiz.cur=nx;renderRight();renderMis()},
 qsubmit(){const n=Object.keys(S.quiz.a).length;dialog('Сдать ответы?',`<p>Отвечено: ${n} из 10. Изменить ответы будет нельзя.</p>`,[{t:'Отмена',cls:'g'},{t:'Сдать',fn:()=>{S.quiz.done=true;render();toast(`Вопросы: ${misScore(MIS[6])} из 10`)}}])},
 rtab(v){S.rtab=+v;renderRight()},
 finish(){dialog('Сдать работу?','<p>После сдачи команды выполняться не будут. Несданные вопросы получат 0 баллов.</p>',[{t:'Отмена',cls:'g'},{t:'Сдать работу',cls:'r',fn:()=>finish(false)}])},
 report(){REPORT=reportTXT();dialog('Отчёт',`<textarea id="rep" readonly>${esc(REPORT)}</textarea>`,[{t:'Закрыть',cls:'g'},{t:'Копировать',cls:'o',fn:copyRep},{t:'Скачать .txt',cls:'o',fn:()=>download(fname('txt'),reportTXT(),'text/plain')},{t:'Скачать .html',fn:()=>download(fname('html'),reportHTML(),'text/html')}])},
 print(){const pa=$('#printArea');const h=reportHTML();pa.innerHTML=h.slice(h.indexOf('<h1>'),h.lastIndexOf('</body>'));try{window.print()}catch(e){toast('Печать недоступна — скачайте отчёт .html',1)}}
};
stage.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f){e.preventDefault();f(b.dataset.v,b,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dlg').classList.contains('hidden')&&S.t0){closeDlg()}
 if(e.key==='Enter'&&!S.t0&&(e.target.id==='fn'||e.target.id==='fg')){e.preventDefault();ACT.start()}});
window.addEventListener('beforeunload',e=>{if(S.t0&&!S.fin){e.preventDefault();e.returnValue=''}});
function tick(){const el=$('#clock');if(!el)return;if(!S.t0){el.textContent='90:00';return}const now=S.fin?S.tEnd:Date.now();const rem=Math.max(0,S.limit-Math.floor((now-S.t0)/1000));el.textContent=`${pad(Math.floor(rem/60))}:${pad(rem%60)}`;el.className='pill clock'+(rem<=300?' crit':rem<=900?' warn':'');if(rem<=0&&!S.fin)finish(true)}

dialog('',`<div class="intro"><div><h3>Практикум: автоматизация в ОС</h3><p>Вы — системный администратор ООО «СетьСервис». За 90 минут автоматизируйте рутину:</p><ul><li>командный файл резервного копирования;</li><li>сценарии PowerShell: очистка и мониторинг диска;</li><li>запуск по расписанию в Windows и Linux;</li><li>контрольные вопросы.</li></ul><p class="muted">Слева — задание по шагам с кодом, справа — терминал. Шаги засчитываются автоматически.</p></div><div><p><b>Регистрация</b></p><p>Фамилия и имя</p><input type="text" id="fn" autocomplete="off"><p style="margin-top:8px">Группа</p><input type="text" id="fg" autocomplete="off"><div class="dbtns"><button class="btn" data-a="start">▶ Начать (90 минут)</button></div></div></div>`,[]);
$('.dbtns:last-child',$('#dlg'))&&($('#dlg .dbox>.dbtns').style.display='none');
