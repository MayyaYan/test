<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Взаимодействие ОС с оборудованием — практическая работа</title>
<style>
/* ===== Практикум «Лаборатория: ОС и оборудование»: сцена 1280×720, кегль не меньше 22 pt ===== */
:root{
  --side:#1E1B4B; --side2:#312E81; --ink:#1E1B4B; --muted:#4B5563; --line:#CBD5E1; --bg:#EEF0F8; --card:#FFFFFF;
  --acc:#7C3AED; --acc-soft:#EDE9FE; --teal:#0F766E; --teal-soft:#CCFBF1; --blue:#1D4ED8; --blue-soft:#DBEAFE;
  --amber:#B45309; --amber-soft:#FEF3C7; --ok:#15803D; --ok-soft:#DCFCE7; --bad:#B91C1C; --bad-soft:#FEE2E2;
  --ff:"Segoe UI","PT Sans",Arial,sans-serif; --mono:Consolas,"PT Mono","Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0F0D2E}
body{font-family:var(--ff);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:default}
:focus-visible{outline:4px solid #F59E0B;outline-offset:2px}
.hidden{display:none!important}
.muted{color:var(--muted)}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:var(--bg);font-size:22pt;line-height:1.2}

/* боковая панель */
#side{position:absolute;left:0;top:0;bottom:0;width:300px;background:var(--side);color:#E0E7FF;display:flex;flex-direction:column}
#side .brand{height:62px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#14123A}
#side .chip{width:44px;height:44px;border-radius:10px;background:var(--acc);display:flex;align-items:center;justify-content:center}
#side .chip svg{width:30px;height:30px}
#side .brand b{color:#fff;line-height:1.05;white-space:nowrap}
#nav{flex:1;display:flex;flex-direction:column;gap:3px;padding:8px}
#nav button{border:0;background:transparent;color:#C7D2FE;border-radius:10px;height:54px;padding:0 6px;display:flex;align-items:center;gap:6px;text-align:left;white-space:nowrap}
#nav button:hover:not(:disabled){background:rgba(255,255,255,.08)}
#nav button.on{background:#fff;color:var(--ink);font-weight:700}
#nav button:disabled{opacity:.45}
#nav .n{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-weight:700}
#nav button.done .n{background:#22C55E;border-color:#22C55E;color:#fff}
#nav .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#nav .s{flex:none;font-weight:700;color:#A5B4FC}
#nav button.on .s{color:var(--acc)}
#side .tot{padding:8px 14px 12px;border-top:2px solid var(--side2);display:flex;align-items:center;justify-content:space-between}
#side .tot b{font-size:30pt;color:#fff}

/* рабочая область */
#card{position:absolute;left:310px;right:10px;top:10px;bottom:10px;background:var(--card);border-radius:14px;box-shadow:0 10px 30px rgba(30,27,75,.18);display:flex;flex-direction:column;overflow:hidden}
.ch{flex:none;height:54px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:3px solid var(--acc)}
.ch b{font-size:24pt;white-space:nowrap}
.ch .sp{flex:1}
.badge{padding:0 12px;border-radius:8px;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.mid{background:var(--amber-soft);color:var(--amber)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.new{background:var(--acc-soft);color:var(--acc)}
.tabs{flex:none;display:flex;gap:4px;padding:6px 12px 0;background:#F5F3FF;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:transparent;padding:2px 16px 6px;border-radius:10px 10px 0 0;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--acc);font-weight:700;box-shadow:0 -3px 0 var(--acc) inset}
.cb{flex:1;min-height:0;overflow:auto;padding:10px 18px}
.cf{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#F5F3FF;border-top:2px solid var(--line)}
.cf .st{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}

/* общие элементы */
p{margin:0 0 8px}
h3{font-size:26pt;margin:0 0 8px;line-height:1.15}
.btn{border:2px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:0 16px;font-weight:700;white-space:nowrap;height:44px}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.o{background:#fff;color:var(--acc)}
.btn.g{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.t{background:var(--teal);border-color:var(--teal)}
.btn.r{background:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4}
.chip{border:2px solid #94A3B8;background:#fff;border-radius:999px;padding:0 14px;white-space:nowrap;line-height:1.5}
.chip:hover:not(:disabled){border-color:var(--acc)}
.chip.on{background:var(--acc-soft);border-color:var(--acc);font-weight:700}
.chip.ok{background:var(--ok-soft);border-color:var(--ok);color:#14532D;font-weight:700}
.chip.bad{background:var(--bad-soft);border-color:var(--bad);color:#7F1D1D;text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.lbl{font-weight:700;color:var(--ink)}
.box{border:2px solid var(--line);border-radius:12px;padding:6px 14px;background:#fff}
.box.acc{background:var(--acc-soft);border-color:#C4B5FD}.box.ok{background:var(--ok-soft);border-color:#86EFAC}.box.bad{background:var(--bad-soft);border-color:#FCA5A5}.box.amb{background:var(--amber-soft);border-color:#FCD34D}
input[type=text]{border:2px solid #94A3B8;border-radius:8px;padding:0 10px;background:#fff;font-size:22pt;width:100%;height:42px}
input[type=text]:focus{border-color:var(--acc)}
input.okf{border-color:var(--ok);background:var(--ok-soft)}input.badf{border-color:var(--bad);background:var(--bad-soft)}
table.tb{border-collapse:collapse;width:100%}
.tb th,.tb td{border:2px solid var(--line);padding:1px 10px;text-align:left;vertical-align:middle}
.tb th{background:#F5F3FF}
.tb td.c,.tb th.c{text-align:center}
.tb input{text-align:center;height:38px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:1px 0;line-height:1.12;border-bottom:2px solid #E5E7EB}
.prow .chips{flex-wrap:nowrap}
.qblk{margin-bottom:10px}
.rad td{padding:1px 8px}.rad th.c{width:190px}
.mcol .chips{flex-direction:column;align-items:flex-start}.qblk .ql{font-weight:700;margin-bottom:4px}

/* упорядочивание */
.ord{display:grid;grid-template-columns:1fr;gap:8px}
.ord .col{display:flex;flex-direction:column;gap:4px}
.ord .col:first-child{flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center}
.ord .col:first-child .cap{width:100%}
.ord .cap{font-weight:700;color:var(--muted)}
.ord .it{border:2px solid var(--line);background:#fff;border-radius:10px;padding:1px 10px;text-align:left;line-height:1.12;min-height:40px}
.ord .it:hover:not(:disabled){border-color:var(--acc)}
.ord .seq .it{border-color:var(--acc);background:var(--acc-soft);display:flex;gap:8px;align-items:center}
.ord .seq .it i{font-style:normal;font-weight:700;color:var(--acc);flex:none;width:30px}
.ord .seq .it.ok{border-color:var(--ok);background:var(--ok-soft)}.ord .seq .it.ok i{color:var(--ok)}
.ord .seq .it.bad{border-color:var(--bad);background:var(--bad-soft)}.ord .seq .it.bad i{color:var(--bad)}
.ord .slot{border:2px dashed var(--line);border-radius:10px;min-height:40px;display:flex;align-items:center;padding:0 12px;color:#9CA3AF}

/* Диспетчер устройств */
.dm{display:grid;grid-template-columns:400px minmax(0,1fr);gap:12px;height:100%}
.win{border:2px solid #8B95A7;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;background:#fff;min-height:0}
.win .wt{flex:none;background:#F3F3F3;border-bottom:2px solid #D5DCE3;padding:0 10px;display:flex;align-items:center;gap:8px;white-space:nowrap;height:40px}
.win .wt .sp{flex:1}
.win .wb{flex:1;min-height:0;overflow:auto;padding:4px 8px}
.tree .cat{display:flex;align-items:center;gap:6px;color:#334155;white-space:nowrap}
.tree button.dev{display:flex;align-items:flex-start;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:2px 6px 2px 30px;border-radius:6px;line-height:1.15}
.tree button.dev .di{margin-top:5px}
.tree button.dev:hover{background:#EFF6FF}
.tree button.dev.sel{background:#CCE4FF}
.di{flex:none;width:22px;height:22px;border-radius:4px;background:#64748B;position:relative}
.di.w::after{content:"!";position:absolute;right:-8px;bottom:-6px;width:18px;height:18px;border-radius:50%;background:#FACC15;color:#000;font-weight:800;font-size:22pt;line-height:18px;text-align:center;transform:scale(.62);transform-origin:center}
.di.x::after{content:"↓";position:absolute;right:-8px;bottom:-6px;width:18px;height:18px;border-radius:50%;background:#475569;color:#fff;font-weight:800;font-size:22pt;line-height:18px;text-align:center;transform:scale(.62)}
.ptabs{display:flex;gap:4px;margin-bottom:6px}
.ptabs button{border:2px solid var(--line);background:#fff;border-radius:8px 8px 0 0;padding:0 12px}
.ptabs button.on{border-bottom-color:#fff;font-weight:700;background:#F8FAFC}
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:2px 10px}
.kv span{color:var(--muted)}
.stbox{border:2px solid var(--line);border-radius:6px;padding:2px 8px;margin-top:6px;background:#F8FAFC}
.stbox.w{border-color:#FACC15;background:#FEFCE8}
.hwid{font-family:var(--mono);word-break:break-all;border:2px solid var(--line);border-radius:6px;padding:2px 8px;background:#F8FAFC}
.dbtns2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.dbtns2 .btn{height:42px}
.cat tr.sel td{background:var(--acc-soft)}
.mono{font-family:var(--mono)}

/* замещение страниц */
.refs{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.refs span{width:52px;height:46px;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--mono);background:#fff}
.refs span.cur{background:var(--acc);border-color:var(--acc);color:#fff;transform:scale(1.08)}
.refs span.past{color:#9CA3AF;background:#F3F4F6}
.frames{display:flex;gap:10px;align-items:stretch;margin-bottom:8px}
.frames button.fr{width:150px;height:96px;border:3px solid var(--teal);border-radius:12px;background:var(--teal-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.frames button.fr b{font-family:var(--mono);font-size:36pt}
.frames button.fr.empty{border-style:dashed;background:#fff;color:#9CA3AF}
.frames button.fr:hover:not(:disabled){border-color:var(--bad);background:#FFF1F2}
.frames .acts{display:flex;flex-direction:column;gap:6px;justify-content:center;margin-left:8px}
.hist{border-collapse:collapse}
.hist th,.hist td{border:2px solid var(--line);width:62px;height:36px;text-align:center;font-family:var(--mono);padding:0}
.hist th:first-child,.hist td:first-child{width:150px;font-family:var(--ff);text-align:left;padding:0 8px;background:#F5F3FF}
.hist td.ok{background:var(--ok-soft)}.hist td.bad{background:var(--bad-soft)}
.hist td.p{color:var(--bad);font-weight:700}.hist td.h{color:var(--ok);font-weight:700}

/* итоги */
.res{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}
.grade{width:110px;height:110px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:60pt;font-weight:800;color:#fff}
.g5{background:#15803D}.g4{background:#0F766E}.g3{background:#A16207}.g2{background:#B91C1C}
.big{font-size:44pt;font-weight:800;line-height:1}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:330px minmax(0,1fr) 90px;gap:10px;align-items:center}
.bar .tr{height:24px;background:#E5E7EB;border-radius:8px;overflow:hidden}
.bar .tr i{display:block;height:100%;width:0;border-radius:8px}
.bar .v{text-align:right;font-weight:700}
.lv{font-weight:700}.lv.l4{color:var(--ok)}.lv.l3{color:var(--teal)}.lv.l2{color:var(--amber)}.lv.l1{color:var(--bad)}
.start{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
.start .tb td,.start .tb th{padding:0 8px}
.form{background:#F8FAFC;border:2px solid var(--line);border-radius:14px;padding:8px 16px;display:flex;flex-direction:column;gap:6px}

/* диалоги */
#dlg{position:absolute;inset:0;background:rgba(15,13,46,.6);display:flex;align-items:center;justify-content:center;z-index:50}
.dbox{background:#fff;border-radius:16px;min-width:560px;max-width:1180px;max-height:680px;overflow:auto;padding:14px 22px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.dbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;flex-wrap:wrap}
.dbox textarea{width:1120px;height:420px;font-family:var(--mono);font-size:22pt;border:2px solid var(--line);border-radius:10px;padding:8px}
.calc input{font-family:var(--mono)}
.calc .out{font-family:var(--mono);font-size:26pt;font-weight:700;color:var(--blue);min-height:40px}
.calc .keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.calc .keys button{min-width:70px;height:46px;border:2px solid var(--line);background:#F8FAFC;border-radius:10px;font-family:var(--mono)}
#toast{position:absolute;left:310px;right:10px;bottom:76px;margin:0 auto;width:fit-content;max-width:900px;background:var(--side);color:#fff;padding:6px 20px;border-radius:12px;z-index:70;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.bad{background:#7F1D1D}#toast.good{background:#14532D}
#printArea{display:none}
@media print{body{overflow:visible;background:#fff}#stage{display:none}#printArea{display:block}}
</style>
</head>

</div>

<script>
(function(){

function correctAct(k){const s=S.t5[k];const p=REF[s.i];if(s.fr.includes(p))return {a:'hit'};const fi=s.fr.indexOf(null);if(fi>=0)return {a:'free',slot:fi};
 let best=0;s.fr.forEach((x,j)=>{const key=k==='fifo'?s.load:s.use;if(key[x]<key[s.fr[best]])best=j});return {a:'evict',slot:best,page:s.fr[best]}}
function simStep(k,act){const s=S.t5[k];if(s.i>=REF.length||S.t5.done)return;const p=REF[s.i];const c=correctAct(k);
 const ok=act.a===c.a&&(c.a!=='evict'||act.slot===c.slot);
 if(c.a==='free'){s.fr[c.slot]=p;s.load[p]=s.i}else if(c.a==='evict'){delete s.load[c.page];s.fr[c.slot]=p;s.load[p]=s.i}
 s.use[p]=s.i;s.dec.push({p,ok,fault:c.a!=='hit',victim:c.page,fr:s.fr.slice()});s.i++;
 if(ok)toast(c.a==='hit'?`Верно: страница ${p} уже в памяти`:c.a==='free'?`Верно: страница ${p} загружена в свободный кадр`:`Верно: вытеснена страница ${c.page}`,'good');
 else toast(c.a==='hit'?`Неверно: страница ${p} уже есть в кадре — прерывания нет`:c.a==='free'?`Неверно: есть свободный кадр — страница ${p} загружается туда`:`Неверно: по ${k==='fifo'?'FIFO':'LRU'} вытесняется страница ${c.page}`,'bad');
 renderCard(true)}
function countFaults(k){const fr=[],load={},use={};let n=0;REF.forEach((p,i)=>{if(fr.includes(p)){use[p]=i;return}n++;if(fr.length<3){fr.push(p)}else{let b=0;fr.forEach((x,j)=>{const key=k==='fifo'?load:use;if(key[x]<key[fr[b]])b=j});fr[b]=p}load[p]=i;use[p]=i});return n}

function calc(expr){const s=String(expr).replace(/,/g,'.').replace(/\s+/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-');let i=0;const pk=()=>s[i];
 const nm=()=>{const m=s.slice(i).match(/^\d+(\.\d+)?/);if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
 const prim=()=>{if(pk()==='('){i++;const v=add();if(s[i]!==')')throw 0;i++;return v}if(pk()==='-'){i++;return -prim()}const f=s.slice(i).match(/^(floor|mod)/);if(f){i+=f[1].length;if(s[i]!=='(')throw 0;i++;const a=add();if(f[1]==='mod'){if(s[i]!==';')throw 0;i++;const b=add();if(s[i]!==')')throw 0;i++;return a%b}if(s[i]!==')')throw 0;i++;return Math.floor(a)}return nm()};
 const pow=()=>{let v=prim();if(pk()==='^'){i++;v=Math.pow(v,pow())}return v};
 const mul=()=>{let v=pow();while(pk()==='*'||pk()==='/'||pk()==='%'){const o=s[i++],r=pow();v=o==='*'?v*r:o==='/'?v/r:v%r}return v};
 const add=()=>{let v=mul();while(pk()==='+'||pk()==='-'){const o=s[i++],r=mul();v=o==='+'?v+r:v-r}return v};
 const v=add();if(i<s.length||!isFinite(v))throw 0;return v}

 start(){const n=$('#fn').value.trim(),g=$('#fg').value.trim();if(!n||!g){toast('Введите фамилию, имя и группу','bad');return}S.name=n;S.group=g;S.t0=Date.now();S.view='t1';render();toast('Работа начата. Удачи!')},
 dlgb(v){const b=DLG[+v];closeDlg();b&&b.fn&&b.fn()},
 dlgpick(v){const f=PICK;closeDlg();PICK=null;f&&f(v)},
 submit(id){const t=TASKS.find(x=>x.id===id);ask('Сдать задание?','После сдачи изменить ответы будет нельзя. Пустые ответы засчитываются как неверные.','Сдать',()=>{S[id].done=true;render();toast(`Задание сдано: ${fmt(SC(id))} из ${t.pts}`,'good')})},
 finish(){ask('Сдать работу?','После этого изменить ответы будет нельзя. Несданные задания получат 0 баллов.','Сдать работу',()=>finish(),'r')},
 report(){REPORT=reportTXT();dialog('Отчёт',`<textarea id="rep" readonly>${esc(REPORT)}</textarea>`,[{t:'Закрыть',cls:'g'},{t:'Копировать',cls:'o',fn:copyRep},{t:'Скачать .txt',cls:'o',fn:()=>download(fname('txt'),reportTXT(),'text/plain')},{t:'Скачать .html',fn:()=>download(fname('html'),reportHTML(),'text/html')}])},
 print(){const pa=$('#printArea');const h=reportHTML();pa.innerHTML=h.slice(h.indexOf('<h1>'),h.lastIndexOf('</body>'));const st=document.createElement('style');st.textContent='@media print{#printArea{font-family:"Times New Roman",serif;font-size:14pt}#printArea table{border-collapse:collapse;width:100%;font-size:12pt}#printArea th,#printArea td{border:1px solid #000;padding:2px 6px}}';pa.prepend(st);try{window.print()}catch(e){toast('Печать недоступна — скачайте отчёт .html','bad')}},
 calc(){openCalc()},ck(v){const x=$('#cx');x.value+=v;x.focus()},cc(){$('#cx').value='';$('#co').innerHTML='&nbsp;'},
 ceq(){const x=$('#cx'),o=$('#co');try{const r=calc(x.value);o.textContent='= '+String(Math.round(r*1e6)/1e6).replace('.',',')}catch(e){o.textContent='Ошибка в выражении'}},
 /* упорядочивание */
 oadd(v){const [id,k]=v.split(':');if(S[id].done)return;S[id].ord.push(+k);renderCard(true)},
 orem(v){const [id,i]=v.split(':');if(S[id].done)return;S[id].ord.splice(+i,1);renderCard(true)},
 /* 1 */ t1m(v){if(S.t1.done)return;const [i,j]=v.split(':').map(Number);S.t1.m[i]=j;renderCard(true)},
 /* 2 */
 dsel(v){S.t2.sel=v;if(v==='unk'&&dev('unk').st==='nodrv')S.t2.found=true;renderCard(true)},
 ptab(v){S.t2.ptab=+v;renderCard(true)},
 dupd(){const x=dev(S.t2.sel);if(!x||S.t2.done)return;if(x.id==='unk'&&x.st==='nodrv'){S.t2.tab=1;renderCard();toast('Выберите драйвер в каталоге по ИД оборудования');return}
  dialog('Обновление драйверов',`<p><b>${esc(x.name)}</b></p><p>Наилучшие драйверы для этого устройства уже установлены.</p>`,[{t:'Закрыть'}]);if(x.id==='eth'&&!S.t2.rbFirst)S.t2.rbFirst='upd'},
 drb(){const x=dev(S.t2.sel);if(!x||!x.prev||S.t2.done)return;ask('Откат драйвера',`Вернуть предыдущую версию драйвера ${esc(x.prev[2])} от ${x.prev[1]}?`,'Да',()=>{x.drv=x.prev;x.prev=null;x.st='ok';if(x.id==='eth'){S.t2.rb=true;if(!S.t2.rbFirst)S.t2.rbFirst='rb'}renderCard(true);toast('Драйвер откачен. Устройство работает нормально.','good')})},
 doff(){const x=dev(S.t2.sel);if(!x||S.t2.done)return;if(x.id!=='eth'){toast('Исправные устройства в этом задании не трогаем','bad');return}
  if(x.st==='off'){x.st=S.t2.rb?'ok':'err';toast('Устройство включено');}else{x.st='off';if(!S.t2.rbFirst)S.t2.rbFirst='off';toast('Сетевая карта отключена — сети нет!','bad')}renderCard(true)},
 ddel(){const x=dev(S.t2.sel);if(!x||S.t2.done)return;if(x.id!=='eth'&&x.id!=='unk'){toast('Исправные устройства в этом задании не трогаем','bad');return}
  ask('Удаление устройства',`Удалить ${esc(x.name)} из системы?`,'Удалить',()=>{x.removed=true;S.t2.sel=null;if(x.id==='eth'&&!S.t2.rbFirst)S.t2.rbFirst='del';renderCard(true);toast('Устройство удалено. Нажмите ⟳, чтобы ОС снова нашла оборудование.')},'r')},
 dscan(){const rm=S.t2.dev2.filter(x=>x.removed);if(!rm.length){toast('Изменений в оборудовании не найдено');return}rm.forEach(x=>{x.removed=false;if(x.id==='eth'&&!S.t2.rb){x.st='err'}});renderCard(true);toast('Plug and Play: устройство найдено снова, драйвер установлен тот же')},
 dcat(v){if(S.t2.done)return;S.t2.cat=v;renderCard(true)},
 dinst(){const T=S.t2;if(T.done||T.inst)return;const u=dev('unk');if(u.removed){toast('Неизвестное устройство удалено: нажмите ⟳ в Диспетчере','bad');return}const c=CATALOG.find(x=>x.id===T.cat);if(!c)return;
  if(!u.hw.includes(c.hw)){T.att++;dialog('Установка драйвера',`<p>Указанная папка не содержит совместимого драйвера для этого устройства.</p><p class="muted">ИД оборудования: ${esc(u.hw)}</p>`,[{t:'OK'}]);renderCard(true);return}
  T.inst=true;Object.assign(u,{st:'ok',cat:'Сетевые адаптеры',name:'Intel Wi-Fi 6 AX200 160MHz',maker:'Intel Corporation',drv:['Intel','14.08.2026',c.ver]});renderCard(true);toast('Драйвер установлен. Устройство работает нормально.','good')},
 t2code(v){if(S.t2.done)return;S.t2.code=+v;renderCard(true)},
 t2f(v){if(S.t2.done)return;S.t2.f[v]=!S.t2.f[v];renderCard(true)},
 /* 3 */ t3r(v){if(S.t3.done)return;S.t3.r[v]=!S.t3.r[v];renderCard(true)},t3y(v){if(S.t3.done)return;S.t3.y=+v;renderCard(true)},
 /* 4 */ t4f(v){if(S.t4.done)return;const i=+v;PICK=x=>{S.t4.v['f'+i]=x==='d'?'d':+x;renderCard(true)};const d=$('#dlg');DLG=[{t:'Отмена',cls:'g'}];
  d.innerHTML=`<div class="dbox"><h3>Где страница адреса ${ADDR[i]}?</h3><div class="chips">${[0,1,2,3,4,5,6,7].map(k=>`<button class="chip" data-a="dlgpick" data-v="${k}">кадр ${k}</button>`).join('')}<button class="chip" data-a="dlgpick" data-v="d">на диске (page fault)</button></div><div class="dbtns"><button class="btn g" data-a="dlgb" data-v="0">Отмена</button></div></div>`;d.classList.remove('hidden')},
 /* 5 */ t5hit(k){simStep(k,{a:'hit'})},t5free(k){simStep(k,{a:'free'})},t5ev(v){const [k,j]=v.split(':');simStep(k,{a:'evict',slot:+j})},
 t5c(v){if(S.t5.done)return;const [i,j]=v.split(':').map(Number);S.t5.c[i]=j;renderCard(true)},
 /* 6 */ t6a(v){if(S.t6.done)return;const [i,j]=v.split(':').map(Number);S.t6.a[i]=j;renderCard(true)},t6b(v){if(S.t6.done)return;const [i,j]=v.split(':').map(Number);S.t6.b[i]=j;renderCard(true)},
 /* 7 */ t7e(v){if(S.t7.done)return;const [i,j]=v.split(':').map(Number);S.t7.e[i]=j;renderCard(true)}
};
stage.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f)f(b.dataset.v,b,e)});
stage.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;const p=k.split('.');if(p.length===2)S[p[0]][p[1]]=e.target.value;else S[p[0]][p[1]][p[2]]=e.target.value});
stage.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.in){const sc=$('.cb')?$('.cb').scrollTop:0;const f=V[S.view].foot();const st=$('.cf .st');if(st)st.innerHTML=f[0]}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dlg').classList.contains('hidden'))closeDlg();if(e.key==='Enter'&&(e.target.id==='fn'||e.target.id==='fg'))ACT.start()});
window.addEventListener('beforeunload',e=>{if(S.t0&&!S.fin){e.preventDefault();e.returnValue=''}});
function finish(){if(S.fin)return;S.fin=true;S.view='res';S.rtab=0;render();dialog('Работа сдана',`<p>Результат: <b>${fmt(total())} из 100</b>. Сохраните отчёт кнопкой «Отчёт».</p>`,[{t:'К итогам'}])}
render();
window.APP={S,ACT,G,SC,total,countFaults,correctAct,tr,ADDR,LEVELS,PNP,IRQS,MODEQ,IOQ,SPQ,IEV,T5Q,DRVF,RES,reportHTML,reportTXT,render};
})();
</script>
